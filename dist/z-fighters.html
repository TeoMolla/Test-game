/** The sprite set for a hero, or null when it should use the placeholder. */
function spriteSet(heroId) {
  return (heroId && SETS[heroId]) || null;
}

function hasSprites(heroId) {
  return !!spriteSet(heroId);
}

/** Every image URL a sprite set references \u2014 used by the single-file build. */
function spriteUrls() {
  const urls = [];
  for (const set of Object.values(SETS)) {
    for (const f of Object.values(set.frames)) urls.push(f.src);
    urls.push(set.portrait.src, set.bust.src);
  }
  return urls;
}

/**
 * Bust markup for cards, portraits and the battle dock: the drawn art when a
 * hero has it, otherwise the CSS/SVG placeholder.
 * `art` is the placeholder descriptor from the hero definition.
 */
function bustHTML(heroId, art, bustSVG) {
  const set = spriteSet(heroId);
  if (!set) return bustSVG(art);
  return `<img class="art-img bust" src="${set.bust.src}" alt="" decoding="async">`;
}

/** Full-body markup for the hero-detail portrait stage. */
function portraitHTML(heroId, art, bustSVG) {
  const set = spriteSet(heroId);
  if (!set) return bustSVG(art);
  return `<img class="art-img portrait" src="${set.portrait.src}" alt="" decoding="async">`;
}

/* ===== src/ui/spriteAnimator.js ===== */
/**
 * ui/spriteAnimator.js \u2014 Plays a sprite clip on one unit's <img>.
 *
 * Clips are declared in ui/sprites.js. This only sequences frames and enforces
 * the interruption rules: a higher-priority clip cuts off a lower one (getting
 * hit interrupts a swing; dying interrupts everything), while an equal or lower
 * one is ignored until the current clip finishes.
 *
 * Timings are divided by the battle's speed multiplier so animations stay in
 * step with the simulation at x2 and x3.
 */

function createAnimator(set, img, { speed = () => 1, onBeam = null } = {}) {
  let timer = null;
  let current = null;       // name of the clip playing, null when idle
  let priority = -1;
  let idleFrame = 'idle';
  let alive = true;

  function show(name) {
    const frame = set.frames[name];
    if (!frame) return;
    img.src = frame.src;
    img.style.setProperty('--cx', frame.cx);
  }

  function toIdle() {
    current = null;
    priority = -1;
    show(idleFrame);
  }

  /** Swap the resting pose \u2014 used to show a badly hurt unit reeling. */
  function setIdleFrame(name) {
    if (!set.frames[name] || idleFrame === name) return;
    idleFrame = name;
    if (!current) show(name);
  }

  /**
   * Start a clip. Returns how long it will run in ms (0 if it was ignored),
   * so the caller can schedule what happens afterwards.
   */
  function play(name) {
    if (!alive) return 0;
    const anim = set.anims[name];
    if (!anim) return 0;
    if (current && anim.priority <= priority) return 0;

    clearTimeout(timer);
    current = name;
    priority = anim.priority;

    const div = Math.max(0.25, speed());
    let total = 0;
    let i = 0;

    const step = () => {
      if (i >= anim.clip.length) {
        // A held clip stays "current" so nothing \u2014 not the resting-pose swap,
        // not a later hit \u2014 can put a downed unit back on its feet.
        if (!anim.hold) toIdle();
        return;
      }
      const [frameName, ms] = anim.clip[i];
      show(frameName);
      if (onBeam && set.beamOnFrame && set.beamOnFrame[name] === i) {
        onBeam(ms / div);
      }
      i += 1;
      timer = setTimeout(step, ms / div);
    };

    for (const [, ms] of anim.clip) total += ms / div;
    step();
    return total;
  }

  function stop() {
    alive = false;
    clearTimeout(timer);
  }

  show(idleFrame);
  return { play, stop, setIdleFrame, playing: () => current };
}

const __screen_campaign = (() => {
/**
 * ui/screens/campaign.js \u2014 Linear story stage list.
 */








function render(host) {
  const power = teamPower();
  const list = stageList();

  host.appendChild(h('div', {
    class: 'power-banner',
    html: `<div class="pb-label">Team Power</div>
           <div class="pb-value">\u26a1 ${fmt(power)}</div>
           <button class="btn ghost small" data-action="edit-team">Edit Team</button>`,
  }));

  const wrap = h('div', { class: 'stage-list' });

  for (const entry of list) {
    const { stage, cleared, locked, underpowered } = entry;
    const enemies = buildEnemyTeam(stage.id);
    const previews = enemies.slice(0, 4).map((e) => {
      const r = rarityOf(e.rarity);
      return `<span class="enemy-chip" style="--rc:${r.color}">${bustSVG(e.art)}</span>`;
    }).join('');

    const statusClass = locked ? 'locked' : cleared ? 'cleared' : underpowered ? 'risky' : 'ready';

    wrap.appendChild(h('div', {
      class: `stage-card ${statusClass}`,
      dataset: { stage: stage.id },
      html: `
        <div class="stage-num">${stage.id}</div>
        <div class="stage-body">
          <div class="stage-name">${stage.name} ${cleared ? '<span class="tick">\u2713</span>' : ''}</div>
          <div class="stage-sub">${stage.subtitle}</div>
          <div class="enemy-row">${previews}${enemies.length > 4 ? `<span class="more">+${enemies.length - 4}</span>` : ''}</div>
          <div class="stage-meta">
            <span class="gate ${underpowered ? 'warn' : 'ok'}">\u26a1 ${fmt(stage.requiredPower)} recommended</span>
          </div>
        </div>
        <div class="stage-action">
          ${locked
            ? '<span class="lock">\ud83d\udd12</span>'
            : `<button class="btn ${underpowered ? 'warn' : 'primary'} small" data-action="play" data-stage="${stage.id}">${cleared ? 'Replay' : 'Fight'}</button>`}
        </div>`,
    }));
  }

  host.appendChild(wrap);

  host.appendChild(h('p', {
    class: 'note',
    text: 'Recommended power is a warning, not a wall \u2014 you can attempt an over-tuned fight and lose.',
  }));

  onAction(host, {
    play: (el) => navigate('formation', { stageId: Number(el.dataset.stage) }),
    'edit-team': () => navigate('formation', { stageId: null }),
  });
}
return { render };
})();

const __screen_roster = (() => {
/**
 * ui/screens/roster.js \u2014 Hero grid.
 *
 * Owned heroes show level + stars; unowned heroes are greyed out with a
 * shard-collection fraction (e.g. "5/15") toward unlocking, mirroring the
 * reference roster screen.
 */







function render(host) {
  const entries = rosterEntries();
  const owned = entries.filter((e) => e.owned).length;

  host.appendChild(h('div', {
    class: 'power-banner',
    html: `<div class="pb-label">Collection</div>
           <div class="pb-value">${owned} / ${entries.length} heroes</div>`,
  }));

  const grid = h('div', { class: 'hero-grid' });

  for (const entry of entries) {
    const { id, def, rarity, owned: isOwned, star, level, unlock } = entry;
    const canUnlock = unlock.canUnlock;

    grid.appendChild(h('button', {
      class: `hero-card ${isOwned ? '' : 'locked'} ${canUnlock ? 'unlockable' : ''}`,
      style: { '--rarity': rarity.color, '--glow': rarity.glow },
      dataset: { action: isOwned ? 'open' : 'unlock', hero: id },
      html: `
        <span class="rarity-tag">${rarity.short}</span>
        <span class="card-art">${bustHTML(id, def.art, bustSVG)}</span>
        <span class="card-name">${def.name}</span>
        ${isOwned
          ? `<span class="card-sub">Lv.${level} \u00b7 \u26a1${fmt(entry.power)}</span>
             <span class="card-stars">${starRow(star)}</span>`
          : `<span class="shard-frac ${canUnlock ? 'ready' : ''}">${unlock.have}/${unlock.need}</span>
             <span class="card-sub">${canUnlock ? 'Tap to summon' : 'Shards needed'}</span>`}`,
    }));
  }

  host.appendChild(grid);
  host.appendChild(h('p', { class: 'note', text: 'Shards drop from campaign stages. Collect enough and a hero joins the team.' }));

  onAction(host, {
    open: (el) => navigate('heroDetail', { heroId: el.dataset.hero }),
    unlock: (el) => {
      const heroId = el.dataset.hero;
      if (unlockHero(heroId)) {
        toast(`${heroId.toUpperCase()} joined your team!`, 'good');
        navigate('heroDetail', { heroId });
      } else {
        toast('Not enough shards yet.', 'warn');
        refresh();
      }
    },
  });
}
return { render };
})();

        el.textContent = 'Tap again to erase everything';
        el.classList.add('danger');
        setTimeout(() => {
          if (!resetArmed) return;
          resetArmed = false;
          el.textContent = 'Reset Progress';
          el.classList.remove('danger');
        }, 4000);
        return;
      }
      resetArmed = false;
      resetSave();
      toast('Progress reset.', 'warn');
      navigate('campaign', {}, { replace: true });
    },
  });
}
return { render };
})();

              <span class="rarity-tag">${e.rarity.short}</span>

        </div>

      </div>`,

  onAction(sheet, {

      const heroId = el.dataset.hero;

      if (replacingHeroId) {
        const slot = state.team.find((s) => s.heroId === replacingHeroId);

/* ===== src/ui/screens/battle.js ===== */
const __screen_battle = (() => {
/**
 * ui/screens/battle.js \u2014 Real-time auto-battle presentation.
 *
 * Side-view lanes: player team on the left, enemies on the right, back row set
 * behind and above the front row. The engine (battle/engine.js) owns the
 * simulation; this file only draws what it emits \u2014 HP bars, floating damage
 * numbers, skill call-outs, and the bottom portrait row with each hero's own
 * technique countdown and ultimate-ready indicator.
 */










let raf = null;
let battle = null;
let nodes = new Map();
let speed = 1;
let finished = false;

function dispose() {
  if (raf) cancelAnimationFrame(raf);
  for (const n of nodes.values()) n.animator?.stop();
  raf = null;
  battle = null;
  nodes = new Map();
  finished = false;
}

function render(host, { stageId }) {
  dispose();
  const stage = getStage(stageId);
  battle = startStageBattle(stageId);
  speed = 1;

  const screen = h('div', { class: 'battle-screen' });

  /* ---- top bar ---- */
  const top = h('div', {
    class: 'bt-top',
    html: `
      <span class="bt-stage">${stage ? `${stage.id}. ${stage.name}` : 'Battle'}</span>
      <span class="bt-timer" id="bt-timer">0.0s</span>
      <button class="btn ghost tiny" id="bt-speed">x1</button>`,
  });
  screen.appendChild(top);

  /* ---- arena ---- */
  const arena = h('div', { class: 'arena' });
  const sides = {
    player: h('div', { class: 'side side-player' }),
    enemy: h('div', { class: 'side side-enemy' }),
  };
  const lanes = {
    player: { back: h('div', { class: 'lane lane-back' }), front: h('div', { class: 'lane lane-front' }) },
    enemy: { front: h('div', { class: 'lane lane-front' }), back: h('div', { class: 'lane lane-back' }) },
  };
  sides.player.append(lanes.player.back, lanes.player.front);
  sides.enemy.append(lanes.enemy.front, lanes.enemy.back);
  arena.append(sides.player, sides.enemy);
  screen.appendChild(arena);

  for (const unit of battle.units) {
    const r = rarityOf(unit.rarity);
    const set = spriteSet(unit.heroId);
    const artInner = set
      ? '<div class="u-sprite"><img class="u-frame" alt="" decoding="async"></div><div class="u-beam"></div>'
      : bodySVG(unit.art, { facing: unit.side === 'player' ? 'right' : 'left' });

    const node = h('div', {
      class: `unit ${unit.side} row-${unit.row} ${set ? 'has-sprite' : ''}`,
      style: { '--rarity': r.color, '--aura': unit.art?.aura || r.color },
      html: `
        <div class="u-callout"></div>
        <div class="u-fx"></div>
        <div class="u-art">${artInner}</div>
        <div class="u-bar"><span class="u-fill"></span></div>
        <div class="u-name">${unit.name}</div>`,
    });
    lanes[unit.side][unit.row].appendChild(node);

    const entry = {
      root: node,
      fill: node.querySelector('.u-fill'),
      fx: node.querySelector('.u-fx'),
      callout: node.querySelector('.u-callout'),
      art: node.querySelector('.u-art'),
      swings: 0,
    };

    if (set) {
      const beam = node.querySelector('.u-beam');
      entry.animator = createAnimator(set, node.querySelector('.u-frame'), {
        speed: () => speed,
        onBeam: (ms) => fireBeam(beam, node, unit, ms),
      });
    }
    entry.unit = unit;
    nodes.set(unit.uid, entry);
  }

  /* ---- bottom portrait row (per-hero cooldown timers) ---- */
  const dock = h('div', { class: 'bt-dock' });
  for (const unit of battle.units.filter((u) => u.side === 'player')) {
    const r = rarityOf(unit.rarity);
    const card = h('button', {
      class: 'dock-card',
      style: { '--rarity': r.color, '--glow': r.glow },
      dataset: { uid: unit.uid },
      html: `
        <span class="dc-timer">\u2014</span>
        <span class="dc-art">${bustHTML(unit.heroId, unit.art, bustSVG)}</span>
        <span class="dc-ult"><span class="dc-ult-fill"></span></span>
        <span class="dc-name">${unit.name}</span>
        <span class="dc-hp"><span class="dc-hp-fill"></span></span>`,
    });
    // ULTIMATE_MODE === 'tap' would make this the activation control; in 'auto'
    // the tap is a no-op and the ready state is purely informational.
    card.addEventListener('click', () => {
      if (ULTIMATE_MODE === 'tap') battle.requestUltimate(unit.uid);
    });
    dock.appendChild(card);
    const n = nodes.get(unit.uid);
    n.dock = card;
    n.dockTimer = card.querySelector('.dc-timer');
    n.dockUlt = card.querySelector('.dc-ult-fill');
    n.dockHp = card.querySelector('.dc-hp-fill');
  }
  screen.appendChild(dock);

  host.appendChild(screen);

  // Base positions are read once, before anything is translated, so the
  // advance can be recomputed later without measuring its own effect.
  const arenaBox = arena.getBoundingClientRect();
  for (const n of nodes.values()) {
    const r = n.root.getBoundingClientRect();
    n.baseCX = r.left + r.width / 2 - arenaBox.left;
    n.baseCY = r.top + r.height / 2 - arenaBox.top;
  }
  updateAdvance(true);

  top.querySelector('#bt-speed').addEventListener('click', (ev) => {
    speed = speed === 1 ? 2 : speed === 2 ? 3 : 1;
    ev.currentTarget.textContent = `x${speed}`;
  });

  const timerEl = top.querySelector('#bt-timer');
  let last = performance.now();

  const frame = (now) => {
    const dt = Math.min((now - last) / 1000, 0.25);
    last = now;

    const events = battle.update(dt * speed);
    for (const ev of events) handleEvent(ev);
    paint(timerEl);

    if (battle.state === 'running') {
      raf = requestAnimationFrame(frame);
    } else if (!finished) {
      finished = true;
      endBattle(stageId);
    }
  };
  raf = requestAnimationFrame(frame);
}

/* ---------------- event -> DOM ---------------- */

function handleEvent(ev) {
  const n = nodes.get(ev.uid);
  switch (ev.t) {
    case 'damage': {
      if (!n) return;
      floater(n.fx, `-${fmt(ev.amount)}`, ev.crit ? 'crit' : (ev.self ? 'self' : 'dmg'));
      const unit = battle.unitById(ev.uid);
      pulse(n.art, 'hit');
      if (n.animator && !ev.self && unit?.alive) {
        // PLACEHOLDER: what counts as a "heavy" hit worth the knockback clip.
        const heavy = ev.crit || ev.amount / unit.maxHp > 0.12;
        n.animator.play(heavy ? 'hit_heavy' : 'hit');
      }
      const from = nodes.get(ev.from);
      if (from && ev.from !== ev.uid && !from.animator) pulse(from.art, 'lunge');
      break;
    }
    case 'heal':
      if (n) floater(n.fx, `+${fmt(ev.amount)}`, 'heal');
      break;
    case 'skill':
      if (!n) break;
      if (ev.slot !== 'attack') callout(n.callout, `${ev.icon || ''} ${ev.name}`, ev.slot);
      if (n.animator) {
        if (ev.slot === 'attack') {
          // Alternate punch and kick so repeated auto-attacks don't loop one pose.
          n.animator.play(n.swings++ % 2 ? 'attack_alt' : 'attack');
        } else if (ev.slot === 'technique' || ev.slot === 'ultimate') {
          n.animator.play(ev.slot);
        }
      }
      break;
    case 'passive':
      if (n) callout(n.callout, `${ev.icon || ''} ${ev.name}`, 'passive');
      break;
    case 'buff':
      if (n) floater(n.fx, `${ev.stat.toUpperCase()} \u25b2`, 'buff');
      break;
    case 'debuff':
      if (n) floater(n.fx, `${ev.stat.toUpperCase()} \u25bc`, 'debuff');
      break;
    case 'death':
      if (!n) break;
      if (n.animator) {
        // Let the fall play out, then clear the body off the field.
        const ms = n.animator.play('defeat');
        n.root.classList.add('dying');
        clearTimeout(n.deathTimer);
        n.deathTimer = setTimeout(() => n.root.classList.add('dead'), ms);
      } else {
        n.root.classList.add('dead');
      }
      break;
    default:
      break;
  }
}

/**
 * Put every melee unit next to the enemy it is actually fighting.
 *
 * Each attacker runs to the midpoint between itself and its target and squares
 * up there. Attackers sharing a target fan out \u2014 the first goes toe to toe, and
 * each one after that stands a step further back and off to one side \u2014 which is
 * what makes a group visibly close in on one defender rather than stacking on
 * the same spot. Ranged and back-row units never move.
 *
 * Distances come from the positions captured before anything was translated, so
 * this is safe to re-run whenever targets change or a unit falls.
 * PLACEHOLDER: the spacing constants are feel, not measurement.
 */
const STANDOFF = 56;   // centre-to-centre distance when standing toe to toe
const FAN = 34;        // each extra attacker on the same target stands back this much
const FAN_Y = 18;      // ...and off to one side by this much
const MAX_Y = 26;      // never slide this far vertically; the lanes still read

let advanceSig = '';

function updateAdvance(force = false) {
  const all = [...nodes.values()];
  const sig = all.map((n) => `${n.unit.uid}:${n.unit.targetUid}:${n.unit.alive ? 1 : 0}`).join('|');
  if (!force && sig === advanceSig) return;
  advanceSig = sig;

  const groups = new Map();
  for (const n of all) {
    if (!n.unit.alive || !n.unit.engages) continue;
    const tid = n.unit.targetUid;
    if (!tid) continue;
    if (!groups.has(tid)) groups.set(tid, []);
    groups.get(tid).push(n);
  }

  const ms = Math.round((COMBAT.approachSeconds * 1000) / Math.max(0.25, speed));
  for (const n of all) {
    n.root.style.setProperty('--approach-ms', `${ms}ms`);
  }

  for (const [tid, members] of groups) {
    const target = nodes.get(tid);
    if (!target || !target.unit.alive) continue;
    members.forEach((n, i) => {
      const dir = n.unit.side === 'player' ? 1 : -1;
      // Meet in the middle of the pair rather than running to where the target
      // is standing now \u2014 the target is usually charging too, and aiming at its
      // starting spot makes the two of them run straight past each other.
      const meetX = (n.baseCX + target.baseCX) / 2;
      const wantX = meetX - dir * (STANDOFF / 2 + i * FAN);
      // i === 0 squares up; the rest peel off alternating sides
      const offsetY = i === 0 ? 0 : (i % 2 ? -FAN_Y : FAN_Y);
      const dx = wantX - n.baseCX;
      const dy = Math.max(-MAX_Y, Math.min(MAX_Y, target.baseCY + offsetY - n.baseCY));
      // Nobody retreats to engage.
      const clampedX = dir > 0 ? Math.max(0, dx) : Math.min(0, dx);
      n.root.style.setProperty('--advance-x', `${Math.round(clampedX)}px`);
      n.root.style.setProperty('--advance-y', `${Math.round(dy)}px`);
      // Depth order by final height on screen: lower is nearer the viewer, so a
      // unit that peeled downward covers the one it stepped in front of rather
      // than showing through it.
      n.root.style.zIndex = String(2 + Math.round(n.baseCY + dy));
      n.root.classList.add('engaged');
    });
  }
}

/**
 * The release frame draws the hands thrust forward but no beam, so the beam is
 * a DOM effect \u2014 which also lets it stretch to actually reach its target.
 */
function fireBeam(beam, casterNode, unit, ms) {
  const foe = battle.units.find((u) => u.side !== unit.side && u.alive);
  const foeNode = foe && nodes.get(foe.uid)?.root;
  let len = 150;                                  // PLACEHOLDER fallback length
  if (foeNode) {
    const a = casterNode.getBoundingClientRect();
    const b = foeNode.getBoundingClientRect();
    len = Math.max(70, Math.abs((unit.side === 'player' ? b.left - a.right : a.left - b.right)) + 40);
  }
  beam.style.setProperty('--beam-len', `${Math.round(len)}px`);
  beam.style.setProperty('--beam-ms', `${Math.round(ms)}ms`);
  beam.classList.remove('fire');
  void beam.offsetWidth;                          // restart the animation
  beam.classList.add('fire');
  setTimeout(() => beam.classList.remove('fire'), ms + 60);
}

function floater(host, text, kind) {
  const node = h('span', { class: `float ${kind}`, text });
  // PLACEHOLDER: jitter so simultaneous numbers don't stack into one
  // unreadable blob. Vertical offset matters more than horizontal.
  node.style.setProperty('--dx', `${(Math.random() * 46 - 23).toFixed(0)}px`);
  node.style.setProperty('--dy', `${(Math.random() * 26 - 8).toFixed(0)}px`);
  host.appendChild(node);
  setTimeout(() => node.remove(), 950);
}

function callout(host, text, kind) {
  host.textContent = text;
  host.className = `u-callout show ${kind}`;
  clearTimeout(host._t);
  host._t = setTimeout(() => { host.className = 'u-callout'; }, 900);
}

function pulse(node, cls) {
  node.classList.remove(cls);
  // force reflow so the animation restarts on rapid repeat hits
  void node.offsetWidth;
  node.classList.add(cls);
}

/* ---------------- per-frame paint ---------------- */

function paint(timerEl) {
  timerEl.textContent = `${battle.elapsed.toFixed(1)}s`;
  updateAdvance();   // cheap: only rewrites when a target or a life changes

  for (const unit of battle.units) {
    const n = nodes.get(unit.uid);
    if (!n) continue;
    const pct = Math.max(0, unit.hp / unit.maxHp) * 100;
    n.fill.style.width = `${pct}%`;
    n.fill.classList.toggle('low', pct < 30);

    // Resting pose: closing the distance, badly hurt, or neither.
    // PLACEHOLDER threshold for "badly hurt".
    const closing = unit.alive && battle.elapsed < unit.readyAt;
    n.root.classList.toggle('advancing', closing);
    if (unit.alive) {
      n.animator?.setIdleFrame(closing ? 'guard' : pct < 25 ? 'heavy_stun' : 'idle');
    }

    if (!n.dock) continue;
    n.dockHp.style.width = `${pct}%`;

    if (!unit.alive) {
      n.dock.classList.add('down');
      n.dockTimer.textContent = 'KO';
      n.dockUlt.style.width = '0%';
      continue;
    }

    // Individual technique cooldown countdown, as in the reference dock.
    if (unit.skills.technique) {
      n.dockTimer.textContent = `${Math.max(0, unit.techniqueTimer).toFixed(1)}s`;
    } else {
      n.dockTimer.textContent = '\u2014';
    }

    const chargePct = unit.skills.ultimate
      ? (unit.ultimateCharge / COMBAT.ultimateChargeMax) * 100
      : 0;
    n.dockUlt.style.width = `${Math.min(100, chargePct)}%`;
    n.dock.classList.toggle('ult-ready', !!unit.ultimateReady);
  }
}

/* ---------------- resolution ---------------- */

function endBattle(stageId) {
  const won = battle.state === 'victory';
  const survivors = battle.units.filter((u) => u.side === 'player' && u.alive).length;
  const seconds = battle.elapsed;

  const rewards = won ? completeStage(stageId) : (recordDefeat(), null);

  setTimeout(() => {
    navigate('results', { stageId, won, survivors, seconds, rewards });
  }, 1000);
}
return { dispose, render };
})();

      </div>

}
return { render };

/* ===== src/ui/app.js ===== */
/**
 * ui/app.js \u2014 Screen router and app shell.
 *
 * Screens are plain modules exporting `render(container, params)` and an
 * optional `dispose()`. Adding a screen is a one-line registry change.
 */












const SCREENS = { campaign: __screen_campaign, roster: __screen_roster, bag: __screen_bag, heroDetail: __screen_heroDetail, formation: __screen_formation, battle: __screen_battle, results: __screen_results };

const TITLES = {
  campaign: 'Campaign',
  roster: 'Heroes',
  bag: 'Bag',
  heroDetail: 'Hero',
  formation: 'Formation',
  battle: 'Battle',
  results: 'Results',
};

/** Screens that hide the shell chrome. */
const FULLSCREEN = new Set(['battle', 'results']);

/** Which tab lights up for a given screen. */
const TAB_OF = { campaign: 'campaign', roster: 'roster', bag: 'bag', heroDetail: 'roster', formation: 'campaign' };

let current = null;
let history = [];

function navigate(name, params = {}, { replace = false } = {}) {
  const screen = SCREENS[name];
  if (!screen) { console.error('[app] unknown screen', name); return; }

  if (current && SCREENS[current.name]?.dispose) {
    try { SCREENS[current.name].dispose(); } catch (err) { console.error(err); }
  }

  if (current && !replace) history.push(current);
  if (FULLSCREEN.has(name)) history = history.filter((h) => !FULLSCREEN.has(h.name));

  current = { name, params };

  const host = $('#screen');
  clear(host);
  host.dataset.screen = name;
  document.body.dataset.screen = name;

  $('#screen-title').textContent = TITLES[name] || name;
  $('#topbar').hidden = FULLSCREEN.has(name);
  $('#tabbar').hidden = FULLSCREEN.has(name);
  $('.back-btn').hidden = history.length === 0 || FULLSCREEN.has(name);

  for (const tab of document.querySelectorAll('.tab')) {
    tab.classList.toggle('active', tab.dataset.tab === TAB_OF[name]);
  }

  host.scrollTop = 0;
  screen.render(host, params);
  refreshWallet();
}

function back() {
  const prev = history.pop();
  if (!prev) return navigate('campaign', {}, { replace: true });
  const keep = history;
  navigate(prev.name, prev.params, { replace: true });
  history = keep;
}

/** Re-render the current screen in place (after a purchase, promote, etc). */
function refresh() {
  if (!current) return;
  const keep = history.slice();
  navigate(current.name, current.params, { replace: true });
  history = keep;
}

function currentScreen() {
  return current;
}

function refreshWallet() {
  const chip = $('#wallet-zeni .val');
  if (chip) chip.textContent = fmt(getState().zeni);
}

function initShell() {
  document.querySelector('.back-btn').addEventListener('click', back);
  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      history = [];
      navigate(tab.dataset.tab, {}, { replace: true });
    });
  }
  subscribe(refreshWallet);
  refreshWallet();
}

/* ===== src/main.js ===== */
/**
 * main.js \u2014 Entry point. Loads the save, boots the shell, shows the campaign.
 */




load();
initShell();
navigate('campaign', {}, { replace: true });

// iOS can discard a backgrounded tab without a beforeunload; pagehide is the
// reliable moment to flush.
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistNow();
});

// Surface module errors on-device, where there is no console.
window.addEventListener('error', (ev) => {
  const box = document.getElementById('toasts');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="toast toast-warn">${ev.message}</div>`);
});
</script>
