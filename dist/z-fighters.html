function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;

  const merged = { ...base, ...raw, version: SCHEMA_VERSION };
  merged.heroes = { ...base.heroes };
  let bestAllyLevel = 1;
  for (const [id, saved] of Object.entries(raw.heroes || {})) {
    if (!base.heroes[id]) continue; // hero removed from the game
    merged.heroes[id] = {
      ...base.heroes[id],
      ...saved,
      equipped: { ...emptyEquipped(), ...(saved.equipped || {}) },
    };
    // v2 -> v3 levels became XP; v3 -> v4 allies went back to a stored level.
    // v5 drops per-companion levels entirely \u2014 the slots carry it now \u2014 so a
    // companion's old level is folded into the starting slot level instead of
    // being thrown away.
    const hero = merged.heroes[id];
    const storedXp = Math.max(saved.xp ?? 0, xpToReach(saved.level ?? 1));
    if (isProtagonist(id)) {
      hero.xp = storedXp;
    } else {
      hero.xp = 0;
      bestAllyLevel = Math.max(bestAllyLevel, saved.level ?? levelFromXp(storedXp));
    }
    delete hero.level;
  }
  merged.senzu = Number.isFinite(raw.senzu) ? raw.senzu : base.senzu;
  // v8 adds iron and per-slot levels. An older save simply has neither.
  merged.iron = Number.isFinite(raw.iron) ? raw.iron : 0;
  merged.gearSlotLevels = Object.fromEntries(
    GEAR_SLOTS.map((s) => [s, Math.max(0, Math.round(raw.gearSlotLevels?.[s] ?? 0))])
  );
  merged.shards = { ...raw.shards };
  // v7 gives every gear instance a level. Anything from an older save was
  // earned before levels existed, so it starts at 1 rather than being guessed
  // at from where it might have dropped.
  // v9 adds a lock flag. Anything from an older save starts unlocked.
  merged.gear = (Array.isArray(raw.gear) ? raw.gear : []).map((g) => ({
    ...g,
    level: Math.max(1, Math.round(g.level ?? 1)),
    locked: !!g.locked,
  }));
  merged.campaign = { ...base.campaign, ...(raw.campaign || {}) };
  merged.campaign.cleared = { ...(raw.campaign?.cleared || {}) };

  merged.dungeons = { cleared: { ...(raw.dungeons?.cleared || {}) } };

  // goes back in the bag rather than quietly disappearing, and the protagonist
  // is put back at the head of the team if an old save had him benched.
  for (const [id, hero] of Object.entries(merged.heroes)) {
    if (isProtagonist(id)) continue;
    for (const slot of GEAR_SLOTS) {
      const uid = hero.equipped[slot];
      if (!uid) continue;
      const inst = merged.gear.find((g) => g.uid === uid);
      if (inst) inst.equippedBy = null;
      hero.equipped[slot] = null;
    }
  }
  merged.team = enforceProtagonist(merged.team, merged.heroes);

  merged.companionSlots = Array.from({ length: COMPANION_SLOTS }, (_, i) => ({
    level: Math.max(1, raw.companionSlots?.[i]?.level ?? bestAllyLevel),
  }));
  return merged;
}

/**

 * on load and after any team edit, so no path can produce a team without him.
 */

  const rest = (team || []).filter((s) => s && s.heroId !== PROTAGONIST_ID && heroes[s.heroId]);

    || { heroId: PROTAGONIST_ID, row: HEROES[PROTAGONIST_ID].preferredRow };

let state = defaultState();

    console.warn('[save] load failed, starting fresh', err);
    state = defaultState();
  }
  return state;
}

let pending = null;

/** Debounced write \u2014 battles mutate state often. */
function persist() {
  if (pending) return;
  pending = setTimeout(() => {
    pending = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn('[save] persist failed (quota or private mode)', err);
    }
    emit();
  }, 60);
}

/** Write immediately \u2014 used before navigating away. */
function persistNow() {
  if (pending) { clearTimeout(pending); pending = null; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('[save] persist failed', err);
  }
  emit();
}

function resetSave() {
  state = defaultState();
  persistNow();

}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function emit() {
  for (const fn of listeners) {
    try { fn(state); } catch (err) { console.error('[save] listener error', err); }
  }
}

/**
 * gear/index.js \u2014 Public interface of the gear system.
 *
 * A gear *definition* lives in gear.js; a gear *instance* is what the player
 * owns: { uid, defId, equippedBy }. Instances live in the inventory so that
 * unequipping never loses an item.

let uidCounter = 0;

/** Create an owned instance of a gear definition at a given level. */
function createGearInstance(defId, level = 1, seedUid) {
  if (!GEAR[defId]) return null;
  const uid = seedUid || `g_${Date.now().toString(36)}_${(uidCounter++).toString(36)}`;
  return { uid, defId, level: Math.max(1, Math.round(level)), locked: false, equippedBy: null };

/**

 * { flat, pct } totals. Unknown / missing uids are ignored, so a save that
 * references deleted gear degrades gracefully.

function bonusesFor(equipped, gearInstances, slotLevels = {}) {
  const flat = { atk: 0, hp: 0, def: 0, speed: 0 };
  const pct = { atk: 0, hp: 0, def: 0, speed: 0 };
  if (!equipped) return { flat, pct };

  for (const slot of GEAR_SLOTS) {
    const uid = equipped[slot];
    if (!uid) continue;
    const inst = gearInstances.find((g) => g.uid === uid);
    const def = inst && getGearDef(inst.defId);
    if (!def) continue;
    // The instance's level is what makes two copies of the same item differ;
    // the SLOT's level then multiplies whatever is sitting in it, which is why
    // an empty slot's level is worth nothing.
    const at = statsAtLevel(def, inst.level);
    const sm = gearSlotMult(slotLevels[slot]);
    for (const k of Object.keys(flat)) {
      if (at.flat[k]) flat[k] += at.flat[k] * sm;
      if (at.pct[k]) pct[k] += at.pct[k] * sm;
    }
  }
  return { flat, pct };
}

/** Short "+12 ATK, +5% ATK" style summary for list rows, at a given level. */

  const at = statsAtLevel(def, level);

  for (const [k, v] of Object.entries(at.flat)) parts.push(`+${Math.round(v)} ${k.toUpperCase()}`);
  for (const [k, v] of Object.entries(at.pct)) parts.push(`+${Math.round(v * 100)}% ${k.toUpperCase()}`);

/**
 * One number for "how good is this piece", used to rank the bag and the equip
 * picker so the best option is always the first thing you see. Weights match
 * computePower()'s intent closely enough for ordering; it is not a power value
 * and is never shown.

  const def = getGearDef(inst?.defId);
  if (!def) return 0;
  const at = statsAtLevel(def, inst.level);

  let score = 0;
  for (const [k, v] of Object.entries(at.flat)) score += v * (W[k] || 1);

  // rough mid-game stat line so the two halves are comparable.
  const REF = { atk: 200, hp: 4000, def: 100, speed: 1 };
  for (const [k, v] of Object.entries(at.pct)) score += v * (REF[k] || 1) * (W[k] || 1);

/** Best first. Ties break on rarity, then level, so the order is stable. */
function sortGear(list) {

    if (Math.abs(d) > 0.01) return d;
    const ra = rarityOf(getGearDef(a.defId)?.rarity).order;

/**

/**

 * piece you can hold is set by how deep you have got, not by a cap constant
 * and not by your hero's level.

/**
 * Dungeon-style drop: roll a RARITY from weights, then a random item of that
 * rarity. This is the difference between the two systems \u2014 a campaign stage
 * drops specific named items tied to its story beat, a dungeon drops "gear of
 * roughly this quality", which is what makes difficulty tiers mean something.
 *
 * A rarity with no items defined yet (epic, ssr) walks back down the ladder
 * rather than dropping nothing, so adding higher-rarity gear later needs no
 * change to any dungeon's table.

function rollGearTable(spec) {

  const total = weights.reduce((sum, [, w]) => sum + w, 0);
  if (!total) return [];

  const drops = [];
  for (let i = 0; i < (spec.rolls || 1); i += 1) {
    let roll = Math.random() * total;
    let rarity = weights[weights.length - 1][0];
    for (const [id, w] of weights) {
      roll -= w;
      if (roll <= 0) { rarity = id; break; }

    if (id) drops.push({ defId: id, level: rollLevel(spec.level) });

function pickOfRarityOrBelow(rarity) {
  let idx = RARITY_ORDER.indexOf(rarity);
  if (idx < 0) idx = 0;
  for (let i = idx; i >= 0; i -= 1) {
    const pool = gearIdsByRarity(RARITY_ORDER[i]);
    if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
  }
  return null;
}

 *
 * Applying a skill's effects to units is the battle engine's job
 * (battle/engine.js) \u2014 this module stays free of combat state so skills can be
 * inspected from the roster UI without spinning up a battle.
 */






/** Star rank required for a slot, or null if the slot can never unlock. */
function slotRequirement(slot, rarityId) {
  if (RESERVED_SLOTS.includes(slot)) return null; // transformation \u2014 future pass
  if (slot === 'passive' && !rarityOf(rarityId).hasPassive) return null;
  const req = SKILL_SLOT_UNLOCK[slot];
  return req === undefined ? null : req;
}

function isSlotUnlocked(slot, rarityId, star) {
  const req = slotRequirement(slot, rarityId);
  return req !== null && star >= req;
}

/**
 * Human-readable reason a slot is locked, for the Stars tab.
 */
function slotLockLabel(slot, rarityId) {
  if (RESERVED_SLOTS.includes(slot)) return 'Future';
  if (slot === 'passive' && !rarityOf(rarityId).hasPassive) return 'Epic+';
  const req = slotRequirement(slot, rarityId);
  return req === null ? '\u2014' : `${req}\u2605`;
}

/**
 * Every slot for a hero with its skill + lock state. Drives the Stars tab and
 * the skills list, and is also what the battle engine filters on.
 */
function loadoutSlots(loadout, rarityId, star) {
  return SKILL_SLOTS.map((slot) => {
    const skill = loadout && loadout[slot] ? getSkill(loadout[slot]) : null;
    const requirement = slotRequirement(slot, rarityId);
    return {
      slot,
      skill,
      requirement,
      unlocked: requirement !== null && star >= requirement && !!skill,
      lockLabel: slotLockLabel(slot, rarityId),
      reserved: RESERVED_SLOTS.includes(slot),
    };
  });
}

/** The skills a unit can actually use in combat right now. */
function activeSkills(loadout, rarityId, star) {
  const out = { attack: null, technique: null, ultimate: null, passive: null };
  for (const entry of loadoutSlots(loadout, rarityId, star)) {
    if (entry.unlocked && entry.slot in out) out[entry.slot] = entry.skill;
  }
  return out;
}

/* ===== src/hero/index.js ===== */
/**
 * hero/index.js \u2014 Public interface of the hero system.
 *
 * Turns a hero *definition* (static, hero/heroes.js) plus the player's *hero
 * state* (owned / star / level / equipped, in the save) into the concrete
 * numbers the rest of the game uses.
 *
 * Nothing outside this module should multiply base stats by anything.
 */










function heroSave(heroId) {
  return getState().heroes[heroId] || null;
}

/**
 * The protagonist's level is derived from lifetime XP. Companions have no level
 * of their own \u2014 they all fight at the companion level below.
 */
function levelOf(heroId) {
  const hs = heroSave(heroId);
  if (!hs) return 1;
  return isProtagonist(heroId) ? levelFromXp(hs.xp || 0) : companionLevel();
}

/** Companions can never pass the protagonist. */
function companionLevelCap() {
  return Math.min(MAX_LEVEL, levelOf(PROTAGONIST_ID) + COMPANION_LEVEL_CAP_OFFSET);
}

/**
 * The level every companion fights at: the LOWEST slot, capped at the hero's
 * level. Running one slot ahead of the other buys nothing, which is what forces
 * the investment to be spread rather than dumped into a favourite.
 */
function companionLevel() {
  const slots = getState().companionSlots || [];
  if (!slots.length) return 1;
  return Math.min(companionLevelCap(), ...slots.map((s) => s.level || 1));
}

/** Per-slot state for the training panel. */
function slotInfo(index) {
  const slots = getState().companionSlots || [];
  const slot = slots[index];
  if (!slot) return null;
  const level = slot.level || 1;
  const lowest = Math.min(...slots.map((s) => s.level || 1));
  const cap = companionLevelCap();
  const atMax = level >= MAX_LEVEL;
  const atCap = level >= cap;
  const zeniCost = slotTrainZeni(level);
  const senzuCost = slotTrainSenzu(level);
  return {
    index, level, cap, atCap, atMax,
    // A slot above the lowest is not the level companions are fighting at, so
    // raising it further changes nothing until the other one catches up.
    binding: level === lowest,
    zeniCost, senzuCost,
    haveZeni: inventory.zeni(), haveSenzu: inventory.senzu(),
    canTrain: !atCap && !atMax
      && inventory.zeni() >= zeniCost && inventory.senzu() >= senzuCost,
  };
}

/** Spend beans and zeni to raise one companion slot. */
function trainSlot(index) {
  const info = slotInfo(index);
  if (!info || !info.canTrain) return false;
  // Take the scarce resource first: if beans are short, nothing is spent.
  if (!inventory.spendSenzu(info.senzuCost)) return false;
  if (!inventory.spendZeni(info.zeniCost)) {
    inventory.addSenzu(info.senzuCost);
    return false;
  }
  getState().companionSlots[index].level = info.level + 1;
  persist();
  return true;
}

/* ---------------- bonds ---------------- */

/** Which companions are currently fielded. */
function equippedCompanions() {
  return new Set(
    getState().team.filter((s) => s?.heroId && !isProtagonist(s.heroId)).map((s) => s.heroId)
  );
}

/**
 * What one companion lends, at its current star rank and slot share. Null for
 * the protagonist and for anyone not yet recruited.
 */
function bondOf(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId);
  if (!def?.bond || !hs?.owned || isProtagonist(heroId)) return null;
  const mult = (BOND_RARITY_MULT[def.rarity] ?? 1)
    * (BOND_STAR_MULT[Math.min(hs.star, BOND_STAR_MULT.length - 1)] ?? 0);
  const share = equippedCompanions().has(heroId) ? BOND_EQUIPPED_SHARE : BOND_COLLECTED_SHARE;
  const scale = mult * share;
  const flat = {};
  const pct = {};
  for (const [k, v] of Object.entries(def.bond.flat || {})) flat[k] = v * scale;
  for (const [k, v] of Object.entries(def.bond.pct || {})) pct[k] = v * scale;
  return { label: def.bond.label, equipped: share === BOND_EQUIPPED_SHARE, flat, pct };
}

/** Everything the collection lends the protagonist, summed. */
function bondTotals() {
  const flat = { atk: 0, hp: 0, def: 0, speed: 0 };
  const pct = { atk: 0, hp: 0, def: 0, speed: 0 };
  for (const id of ALLY_IDS) {
    const bond = bondOf(id);
    if (!bond) continue;
    for (const k of Object.keys(flat)) {
      flat[k] += bond.flat[k] || 0;
      pct[k] += bond.pct[k] || 0;
    }
  }
  return { flat, pct };
}

function isOwned(heroId) {
  const hs = heroSave(heroId);
  return !!(hs && hs.owned);
}

/**
 * Stats before gear, at a given star + level.
 * PLACEHOLDER: `speed` deliberately does NOT scale with star or level \u2014 it
 * sets combat pacing, and letting it inflate makes battles unreadable. Only
 * gear moves it.
 */
function baseStatsAt(def, star, level = 1) {
  const rarity = rarityOf(def.rarity);
  const starMult = STAR_STAT_MULT[Math.min(star, MAX_STARS)] ?? 1;
  const levelMult = 1 + LEVEL_STAT_STEP * (level - 1);
  const scale = rarity.statMult * starMult * levelMult;
  return {
    atk: Math.round(def.baseStats.atk * scale),
    hp: Math.round(def.baseStats.hp * scale * HP_SCALE),
    def: Math.round(def.baseStats.def * scale),
    speed: def.baseStats.speed,
  };
}

/** Final stats including equipped gear. */
function statsFor(heroId, override = {}) {
  const def = getHeroDef(heroId);
  if (!def) return { atk: 0, hp: 0, def: 0, speed: 1 };
  const hs = heroSave(heroId) || { star: 0, level: 1, equipped: {} };
  const star = override.star ?? hs.star;
  const level = override.level ?? levelOf(heroId);
  const equipped = override.equipped ?? hs.equipped;

  const base = baseStatsAt(def, star, level);
  const { flat, pct } = bonusesFor(equipped, getState().gear, getState().gearSlotLevels);

  // Bonds land on the protagonist only \u2014 he is the one the collection lends to.
  if (isProtagonist(heroId) && override.bonds !== false) {
    const bonds = bondTotals();
    for (const k of Object.keys(flat)) {
      flat[k] += bonds.flat[k] || 0;
      pct[k] += bonds.pct[k] || 0;
    }
  }

  return {
    atk: Math.round((base.atk + flat.atk) * (1 + pct.atk)),
    hp: Math.round((base.hp + flat.hp) * (1 + pct.hp)),
    def: Math.round((base.def + flat.def) * (1 + pct.def)),
    speed: +((base.speed + flat.speed) * (1 + pct.speed)).toFixed(3),
  };
}

function powerOf(heroId, override = {}) {
  const hs = heroSave(heroId) || { star: 0 };
  return computePower(statsFor(heroId, override), override.star ?? hs.star);
}

function teamPower(team = getState().team) {
  return team.reduce((sum, slot) => sum + (slot?.heroId ? powerOf(slot.heroId) : 0), 0);
}

/** Skills usable right now, given the hero's star rank. */
function skillsFor(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId);
  if (!def || !hs) return { attack: null, technique: null, ultimate: null, passive: null };
  return activeSkills(def.loadout, def.rarity, hs.star);
}

/** Every slot with lock state \u2014 drives the Stars tab. */
function slotsFor(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId) || { star: 0 };
  if (!def) return [];
  return loadoutSlots(def.loadout, def.rarity, hs.star);
}

/* ---------------- unlocking ---------------- */

function unlockInfo(heroId) {
  const def = getHeroDef(heroId);
  const rarity = rarityOf(def.rarity);
  const have = inventory.shards(heroId);
  const need = rarity.shardsToUnlock;
  return { have, need, canUnlock: !isOwned(heroId) && have >= need };
}

function unlockHero(heroId) {
  const info = unlockInfo(heroId);
  if (!info.canUnlock) return false;
  if (!inventory.spendShards(heroId, info.need)) return false;
  const hs = heroSave(heroId);
  hs.owned = true;
  hs.star = getHeroDef(heroId).startStar ?? 1;
  persist();
  return true;
}

/* ---------------- star promotion ---------------- */

function promoteInfo(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId);
  if (!def || !hs) return null;
  const atMax = hs.star >= MAX_STARS;
  const cost = atMax ? 0 : STAR_PROMOTE_SHARDS[hs.star];
  const have = inventory.shards(heroId);
  const level = levelOf(heroId);
  const current = baseStatsAt(def, hs.star, level);
  const next = atMax ? current : baseStatsAt(def, hs.star + 1, level);
  return { star: hs.star, atMax, cost, have, canPromote: !atMax && have >= cost, current, next };
}

function promote(heroId) {
  const info = promoteInfo(heroId);
  if (!info || !info.canPromote) return false;
  if (!inventory.spendShards(heroId, info.cost)) return false;
  heroSave(heroId).star += 1;
  persist();
  return true;
}

/* ---------------- levelling ---------------- */

/** Everything the UI needs to draw an XP bar. */
function xpInfo(heroId) {
  const hs = heroSave(heroId);
  if (!hs) return null;
  const level = levelOf(heroId);
  const atMax = level >= MAX_LEVEL;
  const xp = hs.xp || 0;
  const base = xpToReach(level);
  const needed = atMax ? 0 : xpForLevel(level);
  const into = atMax ? 0 : xp - base;
  return { level, atMax, xp, into, needed, pct: atMax ? 100 : Math.min(100, (into / needed) * 100) };
}

/**
 * Award XP and report what it bought. Levels fall out of the total, so this
 * cannot desynchronise from the stored value.
 */
function grantXp(heroId, amount) {
  const hs = heroSave(heroId);
  if (!hs || !hs.owned || amount <= 0) return { gained: 0, from: 1, to: 1 };
  const from = levelOf(heroId);
  hs.xp = (hs.xp || 0) + Math.round(amount);
  const to = levelOf(heroId);
  persist();
  return { gained: Math.round(amount), from, to };
}

/**
 * Battle XP belongs to the protagonist alone. Allies learn nothing from
 * fighting \u2014 they are trained with beans and zeni instead, so that the two
 * tracks stay distinct and his is the one the campaign feeds.
 */
function awardBattleXp(amount) {
  const res = grantXp(PROTAGONIST_ID, amount);
  return res.gained ? [{ heroId: PROTAGONIST_ID, ...res }] : [];
}

/* ---------------- roster view model ---------------- */

/**
 * The collection grid: companions actually recruited. Ones you do not own are
 * deliberately absent \u2014 the Bag tracks shard progress toward them instead.
 */
function allyEntries() {
  return rosterEntries().filter((e) => !isProtagonist(e.id) && e.owned);
}

/** Companions you have enough shards to recruit right now. */
function recruitableEntries() {
  return rosterEntries().filter((e) => !isProtagonist(e.id) && !e.owned && e.unlock.canUnlock);
}

function rosterEntries() {
  return HERO_IDS.map((id) => {
    const def = getHeroDef(id);
    const hs = heroSave(id);
    const owned = !!hs?.owned;
    return {
      id, def, rarity: rarityOf(def.rarity), owned,
      protagonist: isProtagonist(id),
      star: hs?.star ?? 0,
      level: levelOf(id),
      power: owned ? powerOf(id) : 0,
      unlock: unlockInfo(id),
    };
  }).sort((a, b) => (b.owned - a.owned) || (b.rarity.order - a.rarity.order) || b.power - a.power);
}

/* ===== src/progression/index.js ===== */
/**
 * progression/index.js \u2014 Campaign state: which stages are open, what a clear
 * pays out, and how the enemy team for a stage is built.
 */













function isCleared(stageId) {
  return !!getState().campaign.cleared[stageId];
}

/**
 * A stage is playable when the previous stage is cleared. Power is a *warning*
 * gate, not a hard lock \u2014 the player can attempt an over-tuned fight and lose,
 * which reads better than a greyed-out button.
 * PLACEHOLDER: flip `locked` to include power if a hard gate is preferred.
 */
function stageList() {
  const power = teamPower();
  return STAGES.map((stage, idx) => {
    const prevCleared = idx === 0 || isCleared(STAGES[idx - 1].id);
    return {
      stage,
      cleared: isCleared(stage.id),
      locked: !prevCleared,
      underpowered: power < stage.requiredPower,
      power,
    };
  });
}

function nextStage() {
  const list = stageList();
  return (list.find((s) => !s.cleared && !s.locked) || list[list.length - 1]).stage;
}

/** Build the concrete enemy units for a stage (pre-battle preview + combat). */
function buildEnemyTeam(stageId) {
  return buildUnits(getStage(stageId)?.enemies);
}

/** Shared by stages and dungeons \u2014 both describe enemies the same way. */
function buildUnits(entries) {
  if (!entries) return [];
  return entries.map((entry, i) => {
    const def = getEnemyDef(entry.defId);
    if (!def) return null;
    const scale = entry.scale ?? 1;
    return {
      uid: `e${i}`,
      defId: def.id,
      name: def.name,
      rarity: def.rarity,
      row: entry.row || 'front',
      art: def.art,
      skills: def.skills,
      phases: def.phases || null,
      stats: {
        atk: Math.round(def.stats.atk * scale),
        hp: Math.round(def.stats.hp * scale * HP_SCALE),
        def: Math.round(def.stats.def * scale),
        speed: def.stats.speed,
      },
    };
  }).filter(Boolean);
}

/** Rough "how hard is this" number, shown next to the team's power. */
function stagePower(stageId) {
  return unitsPower(buildEnemyTeam(stageId));
}

function unitsPower(units) {
  return units.reduce(
    (sum, e) => sum + Math.round(e.stats.atk * 2.4 + e.stats.hp * 0.22 + e.stats.def * 1.8),
    0
  );
}

/**
 * Record a victory and pay out. First clear adds a one-time bonus.
 * Returns a summary for the results screen.
 */
function completeStage(stageId) {
  const stage = getStage(stageId);
  if (!stage) return null;
  const first = !isCleared(stageId);

  const shards = { ...(stage.rewards.shards || {}) };
  let zeni = stage.rewards.zeni || 0;
  let senzu = stage.rewards.senzu || 0;
  if (first && stage.firstClear) {
    zeni += stage.firstClear.zeni || 0;
    senzu += stage.firstClear.senzu || 0;
    for (const [heroId, amount] of Object.entries(stage.firstClear.shards || {})) {
      shards[heroId] = (shards[heroId] || 0) + amount;
    }
  }

  const gear = rollGearDrops(stage.rewards.gearTable, stage.rewards.gearLevel);
  // A boss stage always hands over one piece, at a level above anything it
  // rolls \u2014 so clearing a boss is never a dry run and always moves the gear
  // floor up.
  if (stage.rewards.bossDrop) gear.push({ ...stage.rewards.bossDrop });
  const summary = inventory.grantRewards({ zeni, senzu, shards, gear });

  // XP is not an inventory item \u2014 it goes straight to the roster. First clears
  // pay double, which is what makes pushing forward better than farming.
  const xp = (stage.rewards.xp || 0) * (first ? 2 : 1);
  summary.xp = xp;
  summary.levels = awardBattleXp(xp).filter((r) => r.to > r.from);

  const st = getState();
  st.campaign.cleared[stageId] = true;
  st.campaign.highestCleared = Math.max(st.campaign.highestCleared, stageId);
  st.stats.battlesWon += 1;
  persist();

  return { ...summary, firstClear: first, stage };
}

function recordDefeat() {
  getState().stats.battlesLost += 1;
  persist();
}

/* ==========================================================================
   DUNGEONS

   Repeatable gear fights, kept structurally separate from the campaign: a
   dungeon has no story position, no XP, no senzu and no shards. It exists so
   the gear track has a source the player controls, rather than gear arriving
   only as a side effect of pushing the story forward.
   ========================================================================== */

function isDungeonCleared(dungeonId, tier) {
  return !!getState().dungeons.cleared[dungeonKey(dungeonId, tier)];
}

/**
 * View model for the dungeon screen: every dungeon, each with its four
 * difficulties resolved against what the player has cleared.
 *
 * A tier opens when the one below it is cleared, and Easy is always open. As
 * on the campaign, `requiredPower` is a warning rather than a wall \u2014 the
 * difficulty ladder is the real gate.
 */
function dungeonList() {
  const power = teamPower();
  return DUNGEONS.map((dungeon) => ({
    dungeon,
    available: dungeon.available,
    tiers: DUNGEON_TIERS.map((tier, idx) => {
      const def = dungeon.tiers[tier];
      if (!def) return null;
      const prev = DUNGEON_TIERS[idx - 1];
      return {
        tier,
        meta: TIER_META[tier],
        def,
        cleared: isDungeonCleared(dungeon.id, tier),
        locked: !!prev && !isDungeonCleared(dungeon.id, prev),
        underpowered: power < def.requiredPower,
        enemies: buildUnits(def.enemies),
      };
    }).filter(Boolean),
  }));
}

function buildDungeonEnemies(dungeonId, tier) {
  return buildUnits(getDungeonTier(dungeonId, tier)?.enemies);
}

/**
 * Pay out a dungeon clear. Gear and zeni only \u2014 see the note at the top of
 * this block for why nothing else belongs here.
 */
function completeDungeon(dungeonId, tier) {
  const def = getDungeonTier(dungeonId, tier);
  if (!def) return null;
  const first = !isDungeonCleared(dungeonId, tier);

  const summary = inventory.grantRewards({
    zeni: def.zeni || 0,
    gear: rollGearTable(def.drops),
  });
  summary.xp = 0;
  summary.levels = [];

  const st = getState();
  st.dungeons.cleared[dungeonKey(dungeonId, tier)] = true;
  st.stats.battlesWon += 1;
  persist();

  // Dungeons pay the same on every run \u2014 there is no first-clear bonus to
  // announce. What a first clear *does* do is open the next difficulty, so
  // that is what the results screen gets told about.
  const next = DUNGEON_TIERS[DUNGEON_TIERS.indexOf(tier) + 1];
  const unlocked = first && next && getDungeonTier(dungeonId, next)
    ? TIER_META[next].name
    : null;

  return { ...summary, firstClear: false, unlocked, dungeon: getDungeon(dungeonId), tier };
}

/* ==========================================================================
   ENCOUNTERS

   The battle and results screens do not care whether a fight came from the
   story or a dungeon \u2014 they need a name, a lineup, a recommended power and
   something to call on victory. An encounter reference is the small
   serialisable value that carries that, so those screens have exactly one
   code path and adding a third source of fights later touches neither.
   ========================================================================== */

function stageRef(stageId) {
  return { kind: 'stage', stageId: Number(stageId) };
}

function dungeonRef(dungeonId, tier) {
  return { kind: 'dungeon', dungeonId, tier };
}

/** Everything the pre-battle and battle screens need to draw an encounter. */
function encounterInfo(ref) {
  if (ref?.kind === 'dungeon') {
    const dungeon = getDungeon(ref.dungeonId);
    const def = getDungeonTier(ref.dungeonId, ref.tier);
    if (!dungeon || !def) return null;
    const meta = TIER_META[ref.tier];
    return {
      kind: 'dungeon',
      title: `${dungeon.name} \u00b7 ${meta.name}`,
      shortTitle: `${meta.name} \u2014 ${def.title}`,
      subtitle: def.note,
      requiredPower: def.requiredPower,
      enemies: buildUnits(def.enemies),
      accent: meta.color,
      cleared: isDungeonCleared(ref.dungeonId, ref.tier),
    };
  }

  const stage = getStage(ref?.stageId);
  if (!stage) return null;
  return {
    kind: 'stage',
    title: `${stage.id}. ${stage.name}`,
    shortTitle: stage.name,
    subtitle: stage.subtitle,
    requiredPower: stage.requiredPower,
    enemies: buildEnemyTeam(stage.id),
    accent: null,
    cleared: isCleared(stage.id),
  };
}

function buildEncounterEnemies(ref) {
  return ref?.kind === 'dungeon'
    ? buildDungeonEnemies(ref.dungeonId, ref.tier)
    : buildEnemyTeam(ref?.stageId);
}

function completeEncounter(ref) {
  return ref?.kind === 'dungeon'
    ? completeDungeon(ref.dungeonId, ref.tier)
    : completeStage(ref?.stageId);
}

/* ===== src/battle/targeting.js ===== */
/**
 * battle/targeting.js \u2014 Who a skill hits.
 *
 * FORMATION RULE (adjustable via TARGETING_MODE in config.js):
 *   'strict'   \u2014 single-target *basic* attacks can only hit the enemy front
 *                row while any front-row unit is alive. Back row is protected.
 *   'priority' \u2014 back row is targetable but only chosen when nothing in the
 *                front row is available.
 *
 * Basic attacks also STICK: a unit keeps swinging at whoever it picked until
 * that target goes down, rather than choosing again every swing. With
 * FOCUS_FIRE on, the replacement pick prefers whoever its allies are already
 * fighting, so a team converges on one enemy instead of spreading out \u2014 which
 * is what makes a group of attackers visibly gang up on a single defender.
 *
 * Deliberate exception: `lowestHp` and `highestAtk` targeting IGNORE rows.
 * That is what makes techniques and ultimates feel different from auto-attacks
 * and keeps a back-row glass cannon genuinely at risk. Change `respectsRows`
 * below to make row protection absolute.
 */



const respectsRows = {
  frontFirst: true,
  lowestHp: false,
  highestAtk: false,
  allEnemies: false,
  self: false,
  allies: false,
  lowestHpAlly: false,
};

function livingOpponents(battle, unit) {
  return battle.units.filter((u) => u.side !== unit.side && u.alive);
}

function livingAllies(battle, unit) {
  return battle.units.filter((u) => u.side === unit.side && u.alive);
}

/**
 * Prefer whoever this unit's allies are already attacking. Ties \u2014 including
 * the opening pick, when nobody has a target yet \u2014 break randomly, so a team
 * does not deterministically pile onto the same slot every battle.
 */
function focusPick(battle, unit, allowed) {
  const votes = new Map();
  for (const ally of battle.units) {
    if (ally === unit || ally.side !== unit.side || !ally.alive || !ally.targetUid) continue;
    votes.set(ally.targetUid, (votes.get(ally.targetUid) || 0) + 1);
  }
  let best = -1;
  let tied = [];
  for (const cand of allowed) {
    const v = votes.get(cand.uid) || 0;
    if (v > best) { best = v; tied = [cand]; }
    else if (v === best) tied.push(cand);
  }
  return tied[Math.floor(Math.random() * tied.length)];
}

/** Apply the formation rule to a candidate pool. */
function applyRowRule(candidates) {
  const front = candidates.filter((u) => u.row === 'front');
  if (TARGETING_MODE === 'strict') {
    return front.length ? front : candidates;
  }
  // 'priority': back row only when the front row is empty of choices
  return front.length ? front : candidates;
}

/**
 * Resolve a targeting mode into an array of units.
 * Returns [] when nothing is targetable (caller should skip the skill).
 */
function resolveTargets(battle, unit, mode) {
  switch (mode) {
    case 'self':
      return unit.alive ? [unit] : [];

    case 'allies':
      return livingAllies(battle, unit);

    case 'lowestHpAlly': {
      const allies = livingAllies(battle, unit);
      if (!allies.length) return [];
      return [allies.reduce((a, b) => (a.hp / a.maxHp <= b.hp / b.maxHp ? a : b))];
    }

    case 'allEnemies':
      return livingOpponents(battle, unit);

    case 'lowestHp': {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      return [pool.reduce((a, b) => (a.hp <= b.hp ? a : b))];
    }

    case 'highestAtk': {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      return [pool.reduce((a, b) => (a.stats.atk >= b.stats.atk ? a : b))];
    }

    case 'frontFirst':
    default: {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      const allowed = respectsRows[mode] === false ? pool : applyRowRule(pool);

      // Keep the current target while it is alive and still a legal pick.
      const held = allowed.find((u) => u.uid === unit.targetUid);
      if (held) return [held];

      const pick = FOCUS_FIRE ? focusPick(battle, unit, allowed) : allowed[Math.floor(Math.random() * allowed.length)];
      unit.targetUid = pick.uid;
      return [pick];
    }
  }
}

/* ===== src/battle/engine.js ===== */
/**
 * battle/engine.js \u2014 Turn-based combat simulation.
 *
 * TURN ORDER is an action-value queue, not rounds. Every unit carries an
 * `av` \u2014 the distance until its next turn \u2014 and whoever is closest acts next.
 * Acting resets that unit's av to BASE_AV / speed, so a faster unit simply
 * comes round again sooner. Two consequences worth knowing:
 *   - SPEED is a real stat again. It buys turns, not a shorter timer.
 *   - The order is knowable ahead of time, so `battle.preview()` can show the
 *     next several turns and a charging attack can say which turn it lands on.
 *
 * A TURN, in order:
 *   1. the unit's cooldowns and buffs tick down one turn
 *   2. a hit it was charging resolves now, and the turn ends
 *   3. otherwise it picks an action \u2014 the player chooses for their heroes,
 *      the AI chooses for everyone else (and for the player under auto-battle)
 *
 * CHARGING replaces the real-time telegraph: a heavy skill is announced on one
 * turn and lands at the start of the caster's next one, so the answer to it is
 * a turn you actually get rather than a second of reaction time.
 *
 * The engine is headless \u2014 it emits events and never touches the DOM \u2014 so the
 * same fight runs in a browser, in a test, or a thousand times in the balance
 * harness.
 */





let uidSeq = 0;

/** Turn-order distance a unit of speed 1.0 travels per turn. */
const BASE_AV = 1000;

function avStep(unit) {
  return BASE_AV / Math.max(0.2, effectiveStat(unit, 'speed'));
}

function makeUnit(desc, side) {
  const skills = {};
  for (const [slot, id] of Object.entries(desc.skills || {})) {
    const skill = typeof id === 'string' ? getSkill(id) : id;
    if (skill) skills[slot] = skill;
  }
  const maxHp = Math.max(1, Math.round(desc.stats.hp));
  const unit = {
    uid: desc.uid || `u${uidSeq++}`,
    side,
    heroId: desc.heroId || null,
    defId: desc.defId || null,
    name: desc.name,
    rarity: desc.rarity,
    level: desc.level ?? 1,
    star: desc.star ?? 0,
    row: desc.row === 'back' ? 'back' : 'front',
    art: desc.art,
    stats: { ...desc.stats },
    maxHp,
    hp: maxHp,
    alive: true,
    skills,
    buffs: [],
    // Front-line melee units stand forward; the UI reads this for staging.
    engages: engagesInMelee(desc.row === 'back' ? 'back' : 'front', skills.attack),
    // Turns, not seconds, from here down.
    techniqueCd: 0,
    ultimateCharge: 0,
    ultimateReady: false,
    guarding: false,
    charging: null,          // { skill, slot } announced, lands next turn
    turnsTaken: 0,
    passiveFired: false,
    phases: desc.phases || null,
    phasesFired: new Set(),
    av: 0,
  };
  unit.av = avStep(unit);
  return unit;
}

function effectiveStat(unit, stat) {
  let pct = 0;
  for (const b of unit.buffs) if (b.stat === stat) pct += b.pct;
  return Math.max(0, unit.stats[stat] * (1 + pct));
}

/**
 * PLACEHOLDER damage formula:
 *   atk * mult * K / (K + effectiveDef) , then variance, crit and guard.
 * Defence is a soft mitigation curve, so stacking DEF never reaches immunity.
 */
function computeDamage(attacker, target, effect) {
  const atk = effectiveStat(attacker, 'atk');
  const def = effectiveStat(target, 'def') * (1 - (effect.defIgnore || 0));
  const base = atk * (effect.mult ?? 1) * (COMBAT.defenseConstant / (COMBAT.defenseConstant + def));
  const variance = 1 + (Math.random() * 2 - 1) * COMBAT.damageVariance;
  const crit = Math.random() < COMBAT.critChance;
  let amount = base * variance * (crit ? COMBAT.critMult : 1);
  const guarded = !!target.guarding;
  if (guarded) amount *= COMBAT.guardDamageMult;
  return { amount: Math.max(1, Math.round(amount)), crit, guarded };
}

function addCharge(unit, amount) {
  if (!unit.skills.ultimate || unit.ultimateReady) return;
  unit.ultimateCharge = Math.min(COMBAT.ultimateChargeMax, unit.ultimateCharge + amount);
  if (unit.ultimateCharge >= COMBAT.ultimateChargeMax) unit.ultimateReady = true;
}

function createBattle({ playerUnits = [], enemyUnits = [], stageId = null, auto = false } = {}) {
  const units = [
    ...playerUnits.map((d) => makeUnit(d, 'player')),
    ...enemyUnits.map((d) => makeUnit(d, 'enemy')),
  ];

  const battle = {
    stageId,
    units,
    turn: 0,                 // turns taken by anyone, for the readout
    state: 'running',        // 'running' | 'victory' | 'defeat'
    events: [],
    auto,
    pending: null,           // { uid, isPlayer } \u2014 a turn open and waiting
    retreated: false,
    log: [],
  };

  battle.player = () => battle.units.filter((u) => u.side === 'player');
  battle.enemy = () => battle.units.filter((u) => u.side === 'enemy');
  battle.unitById = (uid) => battle.units.find((u) => u.uid === uid) || null;
  battle.living = () => battle.units.filter((u) => u.alive);
  battle.setAuto = (v) => { battle.auto = !!v; };

  // Passives with a battleStart trigger land before anyone acts.
  for (const unit of units) {
    const passive = unit.skills.passive;
    if (passive && passive.trigger === 'battleStart') firePassive(battle, unit, passive);
  }

  /**
   * The next `count` units to act, soonest first. Pure lookahead \u2014 it clones
   * the queue state and rolls it forward, so asking never changes anything.
   */
  battle.preview = (count = 6) => {
    const sim = battle.living().map((u) => ({ uid: u.uid, av: u.av, step: avStep(u) }));
    const out = [];
    for (let i = 0; i < count && sim.length; i++) {
      sim.sort((a, b) => a.av - b.av);
      const next = sim[0];
      const delta = next.av;
      for (const s of sim) s.av -= delta;
      out.push(next.uid);
      next.av = next.step;
    }
    return out;
  };

  /** Open the next turn. Returns the events it produced. */
  battle.advance = () => {
    battle.events = [];
    if (battle.state !== 'running' || battle.pending) return battle.events;

    const alive = battle.living();
    if (!alive.length) { checkEnd(battle); return battle.events; }

    // Roll the queue forward to whoever is closest.
    alive.sort((a, b) => a.av - b.av);
    const actor = alive[0];
    const delta = actor.av;
    if (delta > 0) for (const u of alive) u.av -= delta;

    battle.turn += 1;
    actor.turnsTaken += 1;

    // Start-of-turn upkeep. Guard only lasts until your own next turn, which
    // is what makes guarding a trade rather than a free mitigation.
    actor.guarding = false;
    if (actor.techniqueCd > 0) actor.techniqueCd -= 1;
    if (actor.buffs.length) {
      actor.buffs = actor.buffs.filter((b) => {
        b.turns -= 1;
        return b.turns > 0;
      });
    }
    addCharge(actor, COMBAT.ultimateChargePerTurn);

    battle.events.push({ t: 'turnStart', uid: actor.uid, turn: battle.turn, side: actor.side });

    // A charged hit lands now and consumes the turn.
    if (actor.charging) {
      const { skill, slot } = actor.charging;
      actor.charging = null;
      battle.events.push({ t: 'release', uid: actor.uid, skillId: skill.id, name: skill.name, icon: skill.icon });
      resolveCast(battle, actor, skill, slot);
      endTurn(battle, actor);
      return battle.events;
    }

    battle.pending = { uid: actor.uid, isPlayer: actor.side === 'player' };
    return battle.events;
  };

  /**
   * What the unit whose turn it is can legally do. The UI renders this
   * directly, so anything not in here cannot be chosen.
   */
  battle.actions = (uid = battle.pending?.uid) => {
    const unit = battle.unitById(uid);
    if (!unit || !unit.alive) return [];
    const list = [];
    if (unit.skills.attack) {
      list.push({ id: 'attack', skill: unit.skills.attack, ready: true });
    }
    if (unit.skills.technique) {
      list.push({
        id: 'technique', skill: unit.skills.technique,
        ready: unit.techniqueCd <= 0, cooldown: unit.techniqueCd,
      });
    }
    if (unit.skills.ultimate) {
      list.push({
        id: 'ultimate', skill: unit.skills.ultimate,
        ready: unit.ultimateReady,
        charge: unit.ultimateCharge, chargeMax: COMBAT.ultimateChargeMax,
      });
    }
    list.push({ id: 'guard', skill: GUARD, ready: true });
    return list;
  };

  /**
   * Take the pending turn. `targetUid` overrides the skill's own targeting for
   * single-target skills; everything else ignores it.
   * Returns true if the action was legal and resolved.
   */
  battle.act = (actionId, targetUid = null) => {
    battle.events = [];
    if (battle.state !== 'running' || !battle.pending) return false;
    const unit = battle.unitById(battle.pending.uid);
    if (!unit || !unit.alive) { battle.pending = null; return false; }

    const action = battle.actions(unit.uid).find((a) => a.id === actionId);
    if (!action || !action.ready) return false;

    battle.pending = null;

    if (actionId === 'guard') {
      unit.guarding = true;
      addCharge(unit, COMBAT.ultimateChargeOnGuard);
      battle.events.push({ t: 'guard', uid: unit.uid, name: GUARD.name, icon: GUARD.icon });
      endTurn(battle, unit);
      return true;
    }

    const skill = action.skill;
    if (actionId === 'ultimate') {
      unit.ultimateCharge = 0;
      unit.ultimateReady = false;
    }
    if (actionId === 'technique') {
      unit.techniqueCd = skill.cooldownTurns ?? COMBAT.defaultTechniqueCooldown;
    }

    castSkill(battle, unit, skill, actionId, targetUid);
    endTurn(battle, unit);
    return true;
  };

  /** What the AI would do with the pending turn. Also drives auto-battle. */
  battle.aiChoose = (uid = battle.pending?.uid) => chooseAction(battle, battle.unitById(uid));

  /** Resolve the pending turn with the AI's choice. */
  battle.takeAiTurn = () => {
    const choice = battle.aiChoose();
    if (!choice) return false;
    return battle.act(choice.actionId, choice.targetUid);
  };

  /** True when the fight is waiting on the player rather than on a timer. */
  battle.awaitingInput = () => !!battle.pending && battle.pending.isPlayer && !battle.auto;

  /** Give up now rather than play out a decided fight. */
  battle.retreat = () => {
    if (battle.state !== 'running') return false;
    battle.events = [];
    battle.state = 'defeat';
    battle.retreated = true;
    battle.pending = null;
    battle.events.push({ t: 'end', result: 'defeat', retreated: true });
    return true;
  };

  return battle;
}

/** The one action every unit always has, and the answer to a charging hit. */
const GUARD = {
  id: 'guard', name: 'Guard', slot: 'guard', icon: '\ud83d\udee1\ufe0f',
  desc: 'Brace. Halves damage until your next turn and builds ki.',
};

function endTurn(battle, unit) {
  unit.av += avStep(unit);
  checkEnd(battle);
  battle.events.push({ t: 'turnEnd', uid: unit.uid });
}

/* ---------------- casting ---------------- */

/**
 * Start a skill. A skill with `charge: true` is announced now and lands at the
 * start of this unit's next turn; everything else resolves immediately.
 */
function castSkill(battle, caster, skill, slot, targetUid = null) {
  if (!skill || !caster.alive) return false;

  if (skill.charge) {
    caster.charging = { skill, slot };
    const targets = resolveTargets(battle, caster, skill.targeting || 'frontFirst');
    battle.events.push({
      t: 'charge', uid: caster.uid, skillId: skill.id, slot,
      name: skill.name, icon: skill.icon,
      targets: targets.map((u) => u.uid),
    });
    return true;
  }
  return resolveCast(battle, caster, skill, slot, targetUid);
}

/** Apply a skill now. */
function resolveCast(battle, caster, skill, slot, targetUid = null) {
  if (!skill || !caster.alive) return false;

  let targets = resolveTargets(battle, caster, skill.targeting || 'frontFirst');
  // A player-picked target overrides the rule, but only for skills that hit
  // one thing \u2014 overriding an "everyone" skill is meaningless.
  if (targetUid && targets.length <= 1) {
    const picked = battle.unitById(targetUid);
    if (picked && picked.alive && picked.side !== caster.side) targets = [picked];
  }

  const needsTarget = (skill.effects || []).some((e) => e.kind === 'damage');
  if (needsTarget && !targets.length) return false;

  battle.events.push({
    t: 'skill', uid: caster.uid, skillId: skill.id, slot,
    name: skill.name, icon: skill.icon, targets: targets.map((u) => u.uid),
  });

  for (const effect of skill.effects || []) {
    applyEffect(battle, caster, effect, targets, { skill, slot });
  }
  return true;
}

function applyEffect(battle, caster, effect, targets, ctx) {
  switch (effect.kind) {
    case 'damage': {
      const hits = effect.hits || 1;
      for (let h = 0; h < hits; h++) {
        for (const target of targets) {
          if (!target.alive) continue;
          dealDamage(battle, caster, target, effect, ctx);
        }
      }
      break;
    }

    case 'heal': {
      const amount = Math.round(effectiveStat(caster, 'atk') * (effect.mult ?? 1));
      for (const target of targets) {
        if (!target.alive) continue;
        target.hp = Math.min(target.maxHp, target.hp + amount);
        battle.events.push({ t: 'heal', uid: target.uid, amount });
      }
      break;
    }

    case 'selfDamage': {
      const amount = Math.max(1, Math.round(caster.maxHp * (effect.pctMaxHp || 0)));
      caster.hp = Math.max(0, caster.hp - amount);
      battle.events.push({ t: 'damage', uid: caster.uid, from: caster.uid, amount, crit: false, self: true });
      if (caster.hp <= 0) killUnit(battle, caster);
      break;
    }

    case 'buff': {
      const pool = effect.target === 'allies'
        ? battle.units.filter((u) => u.side === caster.side && u.alive)
        : [caster];
      for (const target of pool) {
        target.buffs.push({ stat: effect.stat, pct: effect.pct, turns: turnsFor(effect) });
        battle.events.push({ t: 'buff', uid: target.uid, stat: effect.stat, pct: effect.pct });
      }
      break;
    }

    case 'debuff': {
      for (const target of targets) {
        if (!target.alive) continue;
        target.buffs.push({ stat: effect.stat, pct: -Math.abs(effect.pct), turns: turnsFor(effect) });
        battle.events.push({ t: 'debuff', uid: target.uid, stat: effect.stat, pct: effect.pct });
      }
      break;
    }

    case 'charge':
      addCharge(caster, effect.amount || 0);
      break;

    default:
      console.warn('[battle] unknown effect kind', effect.kind);
  }
}

/**
 * Buff durations are authored in seconds (the real-time era) or in turns.
 * Turns win when given; otherwise a second is worth roughly a third of a turn,
 * which keeps the old data usable without a rewrite of every skill.
 */
function turnsFor(effect) {
  if (effect.turns != null) return effect.turns;
  const seconds = effect.seconds ?? 6;
  return seconds >= 900 ? 9999 : Math.max(1, Math.round(seconds / 3));
}

function dealDamage(battle, attacker, target, effect, ctx = {}) {
  const { amount, crit, guarded } = computeDamage(attacker, target, effect);
  target.hp = Math.max(0, target.hp - amount);
  battle.events.push({
    t: 'damage', uid: target.uid, from: attacker.uid,
    amount, crit, guarded, slot: ctx.slot || null,
  });

  addCharge(attacker, COMBAT.ultimateChargeOnHitDealt);
  addCharge(target, COMBAT.ultimateChargeOnHitTaken);

  if (target.hp <= 0) {
    killUnit(battle, target);
  } else {
    checkLowHpPassive(battle, target);
    checkPhase(battle, target);
  }

  if (!ctx.fromPassive) {
    const passive = attacker.skills.passive;
    if (passive && passive.trigger === 'onHitDealt' && Math.random() < (passive.chance ?? 1)) {
      firePassive(battle, attacker, passive, [target]);
    }
  }
}

/**
 * Boss phases. Crossing an HP threshold transforms the unit once: it takes the
 * phase's effects and, if the phase names one, swaps in a new skill.
 *
 * This is what gives a long fight a shape. Without it a boss at 5% health
 * fights exactly as it did at full.
 */
function checkPhase(battle, unit) {
  if (!unit.phases) return;
  const pct = unit.hp / unit.maxHp;
  unit.phases.forEach((phase, i) => {
    if (unit.phasesFired.has(i) || pct > phase.atPct) return;
    unit.phasesFired.add(i);

    for (const [slot, id] of Object.entries(phase.skills || {})) {
      const skill = getSkill(id);
      if (skill) unit.skills[slot] = skill;
    }
    for (const effect of phase.effects || []) {
      applyEffect(battle, unit, effect, [unit], { slot: 'phase', fromPassive: true });
    }
    // Turning interrupts whatever it was charging \u2014 the transformation is the
    // moment, not the attack it was about to throw.
    unit.charging = null;
    battle.events.push({ t: 'phase', uid: unit.uid, name: phase.name, icon: phase.icon || '\u26a1' });
  });
}

function checkLowHpPassive(battle, unit) {
  const passive = unit.skills.passive;
  if (!passive || passive.trigger !== 'lowHp' || unit.passiveFired) return;
  if (unit.hp / unit.maxHp <= (passive.hpThreshold ?? 0.5)) {
    unit.passiveFired = true;
    firePassive(battle, unit, passive);
  }
}

function firePassive(battle, unit, passive, targets) {
  const resolved = targets || resolveTargets(battle, unit, passive.targeting || 'self');
  battle.events.push({
    t: 'passive', uid: unit.uid, skillId: passive.id, name: passive.name, icon: passive.icon,
  });
  for (const effect of passive.effects || []) {
    applyEffect(battle, unit, effect, resolved, { skill: passive, slot: 'passive', fromPassive: true });
  }
}

function killUnit(battle, unit) {
  if (!unit.alive) return;
  unit.alive = false;
  unit.hp = 0;
  unit.ultimateReady = false;
  unit.guarding = false;
  // Killing something mid-charge cancels the hit. That is the payoff for
  // answering a telegraph by removing the caster.
  unit.charging = null;
  battle.events.push({ t: 'death', uid: unit.uid });
}

function checkEnd(battle) {
  if (battle.state !== 'running') return;
  const playersAlive = battle.units.some((u) => u.side === 'player' && u.alive);
  const enemiesAlive = battle.units.some((u) => u.side === 'enemy' && u.alive);

  if (!enemiesAlive) battle.state = 'victory';
  else if (!playersAlive) battle.state = 'defeat';
  else if (battle.turn >= COMBAT.maxTurns) battle.state = 'defeat';
  else return;

  battle.pending = null;
  battle.events.push({ t: 'end', result: battle.state });
}

/* ---------------- the AI ----------------
   Drives the enemy team, and the player's team under auto-battle \u2014 so it has
   to be good enough that a farming run is not a worse run. The order is a
   priority list, not a score: simple to reason about and to explain on screen.
*/

function chooseAction(battle, unit) {
  if (!unit || !unit.alive) return null;
  const foes = battle.units.filter((u) => u.side !== unit.side && u.alive);
  if (!foes.length) return { actionId: 'guard', targetUid: null };

  // 1. Ultimate the moment it is up. Held charge does nothing.
  if (unit.ultimateReady && unit.skills.ultimate) {
    return { actionId: 'ultimate', targetUid: pickTarget(battle, unit, unit.skills.ultimate, foes) };
  }

  // 2. Brace for a hit already in the air aimed at this unit, if it is hurt
  //    enough to care. Guarding at full health wastes the turn.
  const incoming = battle.units.some((u) => (
    u.alive && u.side !== unit.side && u.charging
    && (u.charging.skill.targeting === 'allEnemies'
        || resolveTargets(battle, u, u.charging.skill.targeting || 'frontFirst').some((t) => t.uid === unit.uid))
  ));
  if (incoming && unit.hp / unit.maxHp < COMBAT.aiGuardHpThreshold) {
    return { actionId: 'guard', targetUid: null };
  }

  // 3. Technique off cooldown.
  if (unit.skills.technique && unit.techniqueCd <= 0) {
    return { actionId: 'technique', targetUid: pickTarget(battle, unit, unit.skills.technique, foes) };
  }

  // 4. Swing.
  return { actionId: 'attack', targetUid: pickTarget(battle, unit, unit.skills.attack, foes) };
}

/** Finish anything already in range of dying; otherwise take the rule's pick. */
function pickTarget(battle, unit, skill, foes) {
  if (!skill) return foes[0]?.uid ?? null;
  const legal = resolveTargets(battle, unit, skill.targeting || 'frontFirst');
  if (legal.length !== 1) return null;   // AoE and self-targeting ignore the pick
  const finisher = legal.find((t) => t.hp <= estimateDamage(unit, t, skill));
  return (finisher || legal[0]).uid;
}

function estimateDamage(attacker, target, skill) {
  const dmg = (skill.effects || []).find((e) => e.kind === 'damage');
  if (!dmg) return 0;
  const atk = effectiveStat(attacker, 'atk');
  const def = effectiveStat(target, 'def') * (1 - (dmg.defIgnore || 0));
  return atk * (dmg.mult ?? 1) * (COMBAT.defenseConstant / (COMBAT.defenseConstant + def)) * (dmg.hits || 1);
}

/* ===== src/battle/index.js ===== */
/**
 * battle/index.js \u2014 Public interface of the battle system.
 *
 * Bridges saved player/campaign data into the headless engine so the engine
 * itself never imports the save layer.
 */









/** Turn the saved team ([{heroId,row}]) into engine unit descriptors. */
function buildPlayerUnits(team = getState().team) {
  return team
    .filter((slot) => slot && slot.heroId)
    .slice(0, TEAM_SIZE)
    .map((slot, i) => {
      const def = getHeroDef(slot.heroId);
      const hs = getState().heroes[slot.heroId];
      if (!def || !hs) return null;
      const skills = skillsFor(slot.heroId);
      return {
        uid: `p${i}`,
        heroId: def.id,
        name: def.name,
        rarity: def.rarity,
        row: slot.row || def.preferredRow,
        art: def.art,
        level: levelOf(slot.heroId),
        star: hs.star,
        stats: statsFor(slot.heroId),
        // Only unlocked slots make it into combat \u2014 a 0\u2605 hero really does
        // fight with nothing but its auto-attack.
        skills: Object.fromEntries(
          Object.entries(skills).filter(([, s]) => !!s).map(([slotName, s]) => [slotName, s.id])
        ),
      };
    })
    .filter(Boolean);
}

function startStageBattle(stageId) {
  return createBattle({
    stageId,
    playerUnits: buildPlayerUnits(),
    enemyUnits: buildEnemyTeam(stageId),
  });
}

/**
 * Start a fight from an encounter reference (a story stage or a dungeon tier).
 * The engine is told nothing about where the enemies came from \u2014 it only ever
 * sees two lists of units.
 *
 * Auto-battle starts ON for anything already cleared: a farming run should be
 * hands-free, and a fight you have never won should have your attention. The
 * player can flip it either way once the fight starts.
 */
function startEncounterBattle(ref) {
  const info = encounterInfo(ref);
  return createBattle({
    stageId: ref?.stageId ?? null,
    playerUnits: buildPlayerUnits(),
    enemyUnits: buildEncounterEnemies(ref),
    auto: AUTO_BATTLE_ON_CLEARED && !!info?.cleared,
  });
}

/**
 * Headless run used for balance checks (see tools/simulate.mjs). Plays the
 * whole fight with the AI on both sides \u2014 which is exactly what auto-battle
 * does, so these numbers describe a real farming run rather than a model of
 * one. A player choosing their own turns should do better than this baseline.
 */
function simulate(battle, { maxTurns = 200 } = {}) {
  let guard = maxTurns + 20;
  while (battle.state === 'running' && guard-- > 0) {
    battle.advance();
    if (battle.pending) battle.takeAiTurn();
  }
  return {
    result: battle.state,
    turns: battle.turn,
    survivors: battle.units.filter((u) => u.side === 'player' && u.alive).length,
    enemyHpLeft: battle.units.filter((u) => u.side === 'enemy').reduce((s, u) => s + u.hp, 0),
    // Kept so callers that print a duration still work; a turn is about a
    // second and a half of wall time once animations are in.
    seconds: +(battle.turn * 1.5).toFixed(1),
  };
}

/* ===== src/ui/dom.js ===== */
/**
 * ui/dom.js \u2014 Minimal DOM helpers. No framework, no build step.
 */

function h(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') {
      // Custom properties (--foo) are invisible to Object.assign \u2014 they must
      // go through setProperty, which is how rarity colours reach the CSS.
      for (const [prop, val] of Object.entries(v)) {
        if (prop.startsWith('--')) node.style.setProperty(prop, val);
        else node.style[prop] = val;
      }
    }
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of [].concat(children)) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function clear(node) {
  // Drop the node's delegated action handlers along with its content. Without
  // this every navigation left another live listener on #screen, so a screen
  // the player had already left kept answering clicks \u2014 and two screens using
  // the same action name (say `open`) would both fire, oldest first.
  const map = actionMaps.get(node);
  if (map) for (const key of Object.keys(map)) delete map[key];
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** Bind clicks by [data-action] within a root \u2014 cheap event delegation. */
const actionMaps = new WeakMap();

/**
 * Delegated click handling for [data-action] descendants.
 *
 * The handlers live in a map owned by the node, not in this closure, so one
 * listener is ever attached per node and clear() can empty it. Calling this
 * twice on the same node merges rather than stacking.
 */
function onAction(root, handlers) {
  let map = actionMaps.get(root);
  if (!map) {
    map = {};
    actionMaps.set(root, map);
    root.addEventListener('click', (ev) => {
      const target = ev.target.closest('[data-action]');
      if (!target || !root.contains(target)) return;
      const fn = map[target.dataset.action];
      if (fn) { ev.preventDefault(); fn(target, ev); }
    });
  }
  Object.assign(map, handlers);
}

function fmt(n) {
  return Math.round(n).toLocaleString('en-US');
}

/** Star pip row, e.g. \u2605\u2605\u2605\u2606\u2606 */
function starRow(star, max = 5) {
  let out = '';
  for (let i = 0; i < max; i++) out += `<span class="pip ${i < star ? 'on' : ''}">\u2605</span>`;
  return `<span class="stars">${out}</span>`;
}

/** Brief non-blocking message at the top of the screen. */
function toast(message, kind = 'info') {
  const host = document.getElementById('toasts') || document.body;
  const node = h('div', { class: `toast toast-${kind}`, text: message });
  host.appendChild(node);
  setTimeout(() => node.classList.add('out'), 1800);
  setTimeout(() => node.remove(), 2200);
}

/* ===== src/ui/avatar.js ===== */
/**
 * ui/avatar.js \u2014 PLACEHOLDER CHARACTER ART.
 *
 * Every character is drawn as an inline SVG from a handful of colour/shape
 * parameters on the hero definition (`art`). This is stand-in art: it exists
 * so the prototype reads as a game on a phone screen without shipping any
 * real or borrowed artwork. Replacing it with sprites means swapping this one
 * module \u2014 nothing else knows how a character is drawn.
 */

const EYE = '#1f2937';

function hair(style, colour, cx, cy, rx, ry, skin = '#f2c9a0') {
  switch (style) {
    case 'spiky': {
      const spikes = [];
      const count = 9;
      for (let i = 0; i < count; i++) {
        const a = Math.PI + (Math.PI * i) / (count - 1);
        const x = cx + Math.cos(a) * rx * 1.02;
        const y = cy + Math.sin(a) * ry * 1.02;
        // Tip radii are the largest that keep every spike inside the viewBox
        // for both the bust (cy 44, ry 24) and the body (cy 30, ry 17).
        const tx = cx + Math.cos(a) * rx * 1.8;
        const ty = cy + Math.sin(a) * ry * 1.68;
        const px = cx + Math.cos(a + 0.34) * rx * 1.02;
        const py = cy + Math.sin(a + 0.34) * ry * 1.02;
        spikes.push(`<polygon points="${x},${y} ${tx},${ty} ${px},${py}" fill="${colour}"/>`);
      }
      return `${spikes.join('')}<path d="M${cx - rx},${cy} a${rx},${ry} 0 0 1 ${rx * 2},0 z" fill="${colour}"/>`;
    }
    case 'mane': {
      return `<path d="M${cx - rx * 1.5},${cy + ry * 2.6} Q${cx - rx * 1.9},${cy - ry * 1.1} ${cx},${cy - ry * 1.25}
        Q${cx + rx * 1.9},${cy - ry * 1.1} ${cx + rx * 1.5},${cy + ry * 2.6}
        Q${cx + rx * 0.9},${cy + ry * 1.2} ${cx},${cy + ry * 1.1}
        Q${cx - rx * 0.9},${cy + ry * 1.2} ${cx - rx * 1.5},${cy + ry * 2.6} z" fill="${colour}"/>`;
    }
    case 'long': {
      return `<path d="M${cx - rx * 1.25},${cy + ry * 1.9} Q${cx - rx * 1.4},${cy - ry} ${cx},${cy - ry * 1.15}
        Q${cx + rx * 1.4},${cy - ry} ${cx + rx * 1.25},${cy + ry * 1.9}
        Q${cx + rx * 0.7},${cy + ry * 0.6} ${cx},${cy + ry * 0.55}
        Q${cx - rx * 0.7},${cy + ry * 0.6} ${cx - rx * 1.25},${cy + ry * 1.9} z" fill="${colour}"/>`;
    }
    case 'bowl': {
      return `<path d="M${cx - rx * 1.06},${cy - ry * 0.02} a${rx * 1.06},${ry * 1.0} 0 0 1 ${rx * 2.12},0 z"
        fill="${colour}"/>`;
    }
    case 'widowsPeak': {
      return `<path d="M${cx - rx},${cy - ry * 0.1} a${rx},${ry} 0 0 1 ${rx * 2},0
        l${-rx * 0.2},${-ry * 0.15} l${-rx * 0.8},${ry * 0.5} l${-rx * 0.8},${-ry * 0.5} z" fill="${colour}"/>`;
    }
    case 'turban': {
      // Antennae are drawn first so the turban sits in front of their base;
      // the turban itself must stop well above the eyes (cy + 0.12ry).
      return `
        <path d="M${cx - rx * 0.5},${cy - ry * 0.9} q${-rx * 0.14},${-ry * 0.6} ${rx * 0.12},${-ry * 0.85}"
          stroke="${skin}" stroke-width="${rx * 0.13}" fill="none" stroke-linecap="round"/>
        <path d="M${cx + rx * 0.5},${cy - ry * 0.9} q${rx * 0.14},${-ry * 0.6} ${-rx * 0.12},${-ry * 0.85}"
          stroke="${skin}" stroke-width="${rx * 0.13}" fill="none" stroke-linecap="round"/>
        <path d="M${cx - rx * 1.06},${cy - ry * 0.32} a${rx * 1.06},${ry * 0.86} 0 0 1 ${rx * 2.12},0
          l0,${ry * 0.2} l${-rx * 2.12},0 z" fill="${colour}"/>
        <rect x="${cx - rx * 1.14}" y="${cy - ry * 0.2}" width="${rx * 2.28}" height="${ry * 0.2}"
          rx="${ry * 0.1}" fill="${colour}" opacity="0.72"/>`;
    }
    case 'saibaman': {
      return `<path d="M${cx},${cy - ry * 1.85} q${rx * 0.2},${ry * 0.55} ${-rx * 0.05},${ry * 0.9}"
        stroke="${colour === 'none' ? '#3f6212' : colour}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
    case 'bald':
    case 'thirdEye':
    case 'none':
    default:
      return '';
  }
}

function face(style, cx, cy, rx, ry, opts = {}) {
  const w = rx * 0.2;
  const h = ry * 0.26;
  const dy = cy + ry * 0.12;
  const dx = rx * 0.42;
  if (style === 'saibaman') {
    return `
      <ellipse cx="${cx - dx}" cy="${dy}" rx="${w * 1.5}" ry="${h * 1.3}" fill="#111827"/>
      <ellipse cx="${cx + dx}" cy="${dy}" rx="${w * 1.5}" ry="${h * 1.3}" fill="#111827"/>
      <ellipse cx="${cx - dx}" cy="${dy - h * 0.3}" rx="${w * 0.5}" ry="${h * 0.45}" fill="#fef08a"/>
      <ellipse cx="${cx + dx}" cy="${dy - h * 0.3}" rx="${w * 0.5}" ry="${h * 0.45}" fill="#fef08a"/>`;
  }
  const third = style === 'thirdEye'
    ? `<ellipse cx="${cx}" cy="${cy - ry * 0.42}" rx="${w * 0.85}" ry="${h * 0.85}" fill="${EYE}"/>`
    : '';
  return `
    <ellipse cx="${cx - dx}" cy="${dy}" rx="${w}" ry="${h}" fill="${EYE}"/>
    <ellipse cx="${cx + dx}" cy="${dy}" rx="${w}" ry="${h}" fill="${EYE}"/>
    ${third}
    ${opts.mouth === false ? '' : `<path d="M${cx - rx * 0.25},${cy + ry * 0.52} q${rx * 0.25},${ry * 0.16} ${rx * 0.5},0"
      stroke="${EYE}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.65"/>`}`;
}

/** Head-and-shoulders bust \u2014 roster cards, hero detail, battle portraits. */
function bustSVG(art = {}, { className = '' } = {}) {
  const a = { skin: '#f2c9a0', hair: '#1b1b23', hairStyle: 'spiky', gi: '#f97316', trim: '#1d4ed8', ...art };
  const cx = 50, cy = 44, rx = 21, ry = 24;
  const backHair = ['long', 'mane'].includes(a.hairStyle) ? hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin) : '';
  const frontHair = backHair ? '' : hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin);

  return `<svg class="avatar-svg ${className}" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    ${backHair}
    <path d="M14,100 Q14,74 34,68 L66,68 Q86,74 86,100 Z" fill="${a.gi}"/>
    <path d="M34,68 L50,86 L66,68 L58,66 L50,76 L42,66 Z" fill="${a.trim}"/>
    <rect x="43" y="60" width="14" height="12" fill="${a.skin}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${a.skin}"/>
    ${frontHair}
    ${face(a.hairStyle, cx, cy, rx, ry)}
  </svg>`;
}

/** Full body \u2014 battlefield units. `facing` flips enemies to face the player. */
function bodySVG(art = {}, { facing = 'right', className = '' } = {}) {
  const a = { skin: '#f2c9a0', hair: '#1b1b23', hairStyle: 'spiky', gi: '#f97316', trim: '#1d4ed8', ...art };
  const cx = 50, cy = 30, rx = 15, ry = 17;
  const backHair = ['long', 'mane'].includes(a.hairStyle) ? hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin) : '';
  const frontHair = backHair ? '' : hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin);
  const flip = facing === 'left' ? 'transform="scale(-1,1) translate(-100,0)"' : '';

  return `<svg class="avatar-svg body ${className}" viewBox="0 0 100 150" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <g ${flip}>
      <ellipse cx="50" cy="146" rx="26" ry="5" fill="rgba(0,0,0,0.32)"/>
      ${backHair}
      <path d="M40,92 L36,140 L46,140 L50,100 L54,140 L64,140 L60,92 Z" fill="${a.trim}"/>
      <path d="M33,60 Q30,52 40,49 L60,49 Q70,52 67,60 L64,94 L36,94 Z" fill="${a.gi}"/>
      <rect x="34" y="82" width="32" height="7" fill="${a.trim}"/>
      <path d="M36,54 L24,80 L31,84 L41,60 Z" fill="${a.gi}"/>
      <path d="M64,54 L76,80 L69,84 L59,60 Z" fill="${a.gi}"/>
      <circle cx="26" cy="83" r="5" fill="${a.skin}"/>
      <circle cx="74" cy="83" r="5" fill="${a.skin}"/>
      <rect x="45" y="42" width="10" height="10" fill="${a.skin}"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${a.skin}"/>
      ${frontHair}
      ${face(a.hairStyle, cx, cy, rx, ry, { mouth: false })}
    </g>
  </svg>`;
}

/**
 * Clips are [frameName, milliseconds] pairs.
 *
 * `hold: true` means the last frame stays up instead of returning to idle \u2014
 * used for defeat, where the unit is done acting.
 *
 * `priority` decides what may interrupt what:
 *   - getting hit interrupts a basic swing, which reads as the hit landing
 *   - but a technique or ultimate plays through hits. A front-row hero takes
 *     chip damage almost continuously, so letting hits interrupt these cancels
 *     the release frame \u2014 and the payoff of a Kamehameha is the release frame.
 *     The hit flash still fires, so being hit is never silent.
 *   - death outranks everything, so a unit that dies mid-swing stops swinging.
 */
const SPRITE_ANIMS = {
  idle:      { priority: 0, loop: true,  clip: [['idle', 1000]] },
  // The punch runs wind-up -> contact -> recoil; the kick leads on the sheet's
  // neutral guard instead, because the punch wind-up telegraphs a right cross
  // and reads wrong in front of a high kick. Both settle on the same recoil.
  attack:    { priority: 1, clip: [['windup', 110], ['punch', 160], ['recoil', 150]] },
  attack_alt:{ priority: 1, clip: [['guard', 100], ['kick', 180], ['recoil', 140]] },
  hit:       { priority: 2, clip: [['stagger', 260]] },
  hit_heavy: { priority: 2, clip: [['knockback', 230], ['ground_impact', 260]] },
  technique: { priority: 3, clip: [['charge_start', 200], ['charge_build', 250], ['release', 430]] },
  ultimate:  { priority: 4, clip: [['charge_start', 250], ['charge_build', 310], ['release', 520]] },
  defeat:    { priority: 9, hold: true, clip: [['falling', 210], ['crumpled', 260], ['ko', 380]] },
};

/**
 * Frame index at which a beam effect should fire, per animation \u2014 the release
 * frame. It draws Goku's hands thrust forward but no beam; the beam is a DOM
 * effect so it can stretch to reach whatever it is aimed at.
 */
const BEAM_ON_FRAME = { technique: 2, ultimate: 2 };
