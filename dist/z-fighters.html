/* main.css \002014 shell, roster, hero detail, campaign, bag.
   Mobile-first portrait; every size is tuned for a ~390px-wide iPhone. */

:root {
  --bg: #0b1020;
  --bg-2: #131a30;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-line: rgba(255, 255, 255, 0.1);
  --text: #eef2ff;
  --muted: #94a3b8;
  --accent: #f97316;
  --accent-2: #38bdf8;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --gold: #fbbf24;
  --radius: 14px;
  /* Anton: condensed heavy caps \002014 a fighting-game title-card voice, and the
     narrow width buys real room for long hero and stage names at 390px.
     Body text stays on the system UI stack, which is what iOS renders best. */
  --font-display: 'Anton', 'Arial Narrow', 'Helvetica Neue Condensed', 'Haettenschweiler', system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --topbar-h: 52px;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(120% 70% at 50% 0%, #1c2545 0%, transparent 60%),
    radial-gradient(90% 60% at 80% 100%, #2a1a3a 0%, transparent 55%),
    var(--bg);
}

button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ---------------- shell ---------------- */

#topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 8px) 14px 8px;
  min-height: calc(var(--topbar-h) + var(--safe-top));
  background: linear-gradient(180deg, rgba(11, 16, 32, 0.96), rgba(11, 16, 32, 0.7));
  border-bottom: 1px solid var(--panel-line);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 5;
}
#topbar[hidden] { display: none; }

.back-btn {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 10px;
  width: 34px; height: 34px;
  font-size: 22px; line-height: 1;
  padding: 0 0 3px;
}

.screen-title {
  font-family: var(--font-display);
  font-size: 21px; letter-spacing: 0.02em; flex: 1;
}

/* Three currencies now, so the chips shrink rather than push the title out. */
.wallet { display: flex; gap: 4px; flex: none; }
.wallet-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 4px 7px; border-radius: 999px;
  font-size: 11.5px; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.wallet-chip .ico { font-size: 12px; }

#screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 24px;
}
#screen[data-screen='battle'] { padding: 0; overflow: hidden; }
#screen[data-screen='results'] { padding: 0; }

#tabbar {
  display: flex;
  border-top: 1px solid var(--panel-line);
  background: rgba(11, 16, 32, 0.94);
  backdrop-filter: blur(12px);
  padding-bottom: var(--safe-bottom);
}
#tabbar[hidden] { display: none; }

.tab {
  flex: 1;
  min-width: 0;
  background: none; border: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 2px 7px;
  /* Five tabs on a 390px screen: the label has to shrink rather than wrap. */
  font-size: 9px; letter-spacing: -0.01em; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tab .ico { font-size: 18px; }
.tab.active { color: var(--accent); }

/* ---------------- shared bits ---------------- */

.btn {
  border: 1px solid var(--panel-line);
  background: var(--panel);
  border-radius: 11px;
  padding: 11px 16px;
  font-weight: 650;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(180deg, #fb923c, #ea580c); border-color: #fdba74; color: #1a0e04; }
.btn.gold { background: linear-gradient(180deg, #fcd34d, #d97706); border-color: #fde68a; color: #241503; }
.btn.warn { background: linear-gradient(180deg, #64748b, #475569); border-color: #94a3b8; }
.btn.ghost { background: var(--panel); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.btn.small { padding: 8px 13px; font-size: 13px; border-radius: 9px; }
.btn.tiny { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
.btn.disabled { opacity: 0.42; pointer-events: none; }
.btn.danger { background: linear-gradient(180deg, #ef4444, #b91c1c); border-color: #fca5a5; color: #fff; }
.btn .cost { font-weight: 500; font-size: 12px; opacity: 0.85; display: block; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: 8px;
}

.note { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 12px 2px 0; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}
.section-head { margin: 16px 2px 10px; }
.note + .section-head { margin-top: 22px; }
.panel-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

.power-banner {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(120deg, rgba(249, 115, 22, 0.16), rgba(56, 189, 248, 0.12));
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 14px;
}
.pb-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pb-value { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pb-note { font-size: 11px; color: var(--muted); flex: 1; text-align: right; }

.stars { letter-spacing: 1px; }
.stars .pip { color: rgba(255, 255, 255, 0.2); font-size: 12px; }
.stars .pip.on { color: var(--gold); text-shadow: 0 0 6px rgba(251, 191, 36, 0.6); }

.avatar-svg { width: 100%; height: 100%; display: block; }

/* Drawn art stands in for the SVG placeholder wherever a hero has sprites. */
.art-img { display: block; width: 100%; height: 100%; object-fit: contain; }
.art-img.bust { object-position: 50% 100%; }
.art-img.portrait { object-fit: contain; object-position: 50% 100%; }

/* ---------------- campaign ---------------- */

.stage-list { display: flex; flex-direction: column; gap: 10px; }

.stage-card {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 11px;
}
.stage-card.cleared { border-color: rgba(74, 222, 128, 0.35); }
.stage-card.locked { opacity: 0.45; }
.stage-card.risky { border-color: rgba(251, 191, 36, 0.35); }

.stage-num {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px;
  background: linear-gradient(180deg, #334155, #1e293b);
  font-weight: 800; font-size: 15px;
}
.stage-card.cleared .stage-num { background: linear-gradient(180deg, #16a34a, #14532d); }

.stage-body { flex: 1; min-width: 0; }
.stage-name { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.01em; text-wrap: balance; }
.stage-name .tick { color: var(--good); }
.stage-sub { color: var(--muted); font-size: 12px; margin-top: 1px; line-height: 1.35; }

.enemy-row { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
.enemy-chip {
  width: 30px; height: 30px; border-radius: 8px; overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
  border: 1.5px solid var(--rc, var(--panel-line));
}
.enemy-row .more { font-size: 11px; color: var(--muted); }

.stage-meta { margin-top: 6px; font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; }
.gate.ok { color: var(--good); }
.gate.warn { color: var(--warn); }
.stage-action { flex: none; }
.stage-action .lock { font-size: 20px; opacity: 0.7; }

/* ---------------- the protagonist ---------------- */

/* He sits above the collection rather than inside it \002014 the roster grid is for
   allies, and this card is the one character the whole game is about. */
.lead-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 10px 14px 10px 10px;
  margin-bottom: 14px;
  border-radius: var(--radius);
  border: 1.5px solid var(--rarity, #64748b);
  background:
    linear-gradient(110deg, color-mix(in srgb, var(--rarity, #64748b) 26%, #0b1020), rgba(0, 0, 0, 0.3)),
    var(--bg-2);
  box-shadow: 0 0 22px -10px var(--glow, transparent);
  cursor: pointer;
}
.lead-art {
  width: 84px; height: 84px; flex: none;
  border-radius: 12px; overflow: hidden;
  background: rgba(0, 0, 0, 0.28);
}
.lead-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.lead-eyebrow {
  position: absolute;
  /* visually hidden \002014 the card's placement already says what it is, but the
     label stays in the accessibility tree */
  width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);
}
.lead-name { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.01em; }
.lead-card { position: relative; }
.lead-sub { font-size: 12px; color: var(--muted); }
.lead-stats { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.lead-power {
  font-size: 15px; font-weight: 800; color: var(--gold);
  font-variant-numeric: tabular-nums; margin-top: 2px;
}

.lead-badge {
  display: inline-block; margin-left: 6px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: #241503; background: var(--gold);
  padding: 2px 8px; border-radius: 999px;
}

/* Formation: the lead slot is held, so it has no swap affordance. */
.form-unit.lead {
  border-width: 2px;
  box-shadow: 0 0 18px -8px var(--glow, transparent);
}
.form-unit.lead .fu-art { cursor: default; }
.lead-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
  color: var(--gold); text-align: center; margin-bottom: 1px;
}

/* ---------------- companion slots ---------------- */

.companion-head {
  display: flex; align-items: baseline; gap: 8px;
  margin: 18px 2px 8px;
}
.ch-title {
  font-family: var(--font-display); font-size: 18px; letter-spacing: 0.02em;
}
.ch-level { font-size: 15px; font-weight: 800; color: var(--gold); }
.ch-note { font-size: 10.5px; color: var(--muted); flex: 1; text-align: right; }

.slot-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

.comp-slot {
  border: 1.5px solid var(--panel-line);
  border-radius: 12px;
  padding: 8px;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.22));
  text-align: center;
}
/* The slot actually setting the companion level reads as the live one; a slot
   that has run ahead is dimmed, because raising it further changes nothing. */
.comp-slot.binding { border-color: var(--accent-2); }
.comp-slot.ahead { opacity: 0.72; }
.comp-slot.filled { border-color: var(--rarity, var(--panel-line)); }
.cs-stars { margin-bottom: 3px; }
.cs-bond {
  font-size: 10px; color: var(--gold); font-variant-numeric: tabular-nums;
  line-height: 1.35;
}
.field-tag {
  position: absolute; top: 4px; right: 5px;
  font-size: 8.5px; font-weight: 800; letter-spacing: 0.04em;
  background: var(--gold); color: #241503;
  padding: 1px 5px; border-radius: 5px;
}
.hero-card.fielded { box-shadow: 0 0 0 1px var(--gold), 0 0 16px -6px var(--glow); }

.cs-head { font-size: 11px; color: var(--muted); }
.cs-lv { color: var(--text); font-weight: 700; }
.cs-art {
  width: 64px; height: 64px; margin: 5px auto 3px;
  border-radius: 11px; overflow: hidden; background: rgba(0,0,0,0.3);
  display: grid; place-items: center;
}
.cs-empty { font-size: 26px; color: var(--muted); }
.cs-name { font-size: 12.5px; font-family: var(--font-display); margin-bottom: 6px; }
.cs-warn { font-size: 9.5px; color: var(--warn); margin-top: 4px; }
.btn.tiny.wide { display: block; width: 100%; }

.recruit-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ---------------- bonds ---------------- */

.bond-panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius); padding: 12px; margin-top: 12px;
}
.bond-panel.equipped { border-left-color: var(--gold); }
.bond-head { display: flex; align-items: baseline; gap: 8px; }
.bond-label { font-family: var(--font-display); font-size: 16px; flex: 1; }
.bond-share { font-size: 10.5px; color: var(--muted); }
.bond-rows { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bond-stat {
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,0.06); border: 1px solid var(--panel-line);
  border-radius: 999px; padding: 3px 10px;
}
.bond-panel.equipped .bond-stat { border-color: rgba(251,191,36,0.4); color: var(--gold); }

/* ---------------- roster ---------------- */

.hero-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.hero-card {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 4px 7px;
  border-radius: 12px;
  border: 1.5px solid var(--rarity, #64748b);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.25)),
    color-mix(in srgb, var(--rarity, #64748b) 22%, #0b1020);
  box-shadow: 0 0 14px -6px var(--glow, transparent);
  cursor: pointer;
  overflow: hidden;
}
.hero-card.locked { filter: grayscale(0.9) brightness(0.62); }
.hero-card.unlockable { filter: none; animation: readyPulse 1.8s ease-in-out infinite; }

@keyframes readyPulse {
  0%, 100% { box-shadow: 0 0 12px -6px var(--glow); }
  50% { box-shadow: 0 0 20px -2px var(--glow); }
}

.rarity-tag {
  position: absolute; top: 4px; left: 5px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.05em;
  background: var(--rarity); color: #0b1020;
  padding: 1px 5px; border-radius: 5px;
}
.card-art { width: 100%; aspect-ratio: 1 / 1; display: block; }
.card-name { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.02em; margin-top: 2px; }
.card-sub { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-stars { margin-top: 1px; }

.shard-frac {
  font-size: 12px; font-weight: 800;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 6px; padding: 1px 7px; margin-top: 2px;
}
.shard-frac.ready { background: var(--good); color: #062b12; }

.hero-card.small { padding: 6px 3px; }
.hero-card.small .card-art { aspect-ratio: 1 / 1; }
.hero-card.current { outline: 2px solid var(--accent); }

/* ---------------- hero detail ---------------- */

.hero-hero { text-align: center; margin-bottom: 6px; }
.rarity-badge {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: #0b1020; background: var(--rarity, #64748b);
  padding: 2px 9px; border-radius: 999px;
}
.hero-name { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.01em; margin-top: 3px; text-wrap: balance; }
.hero-title { font-size: 12px; color: var(--muted); }

.tab-bar {
  display: flex; gap: 8px; margin-top: 14px;
  /* Fixed to the bottom of the scroll area, as in the reference hero screen,
     so the tabs stay reachable however long the tab content is. */
  position: sticky; bottom: -14px; z-index: 3;
  margin-left: -14px; margin-right: -14px;
  padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  background: rgba(11, 16, 32, 0.93);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--panel-line);
}
.tab-btn {
  flex: 1; padding: 10px 0; border-radius: 11px;
  border: 1px solid var(--panel-line); background: var(--panel);
  font-size: 14px; font-weight: 650; color: var(--muted);
}
.tab-btn.active { background: var(--rarity, #38bdf8); color: #0b1020; border-color: transparent; }

.tab-body { min-height: 200px; padding-bottom: 62px; }

.portrait-stage {
  position: relative;
  /* Slightly shorter than square so the stat row and Upgrade button clear the
     sticky tab bar without scrolling on a small phone. */
  aspect-ratio: 1 / 0.86;
  max-width: 300px;
  margin: 0 auto;
  border-radius: 18px;
  background:
    radial-gradient(70% 60% at 50% 30%, color-mix(in srgb, var(--rarity) 30%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.35));
  border: 1px solid var(--panel-line);
  overflow: hidden;
}
.portrait-art { position: absolute; inset: 8% 14% 0; }
/* An ally has no gear slots to place, so the stage does not need to be square
   \002014 and it must not be, or the Train button lands under the sticky tab bar. */
.portrait-stage.no-gear {
  aspect-ratio: 1 / 0.62;
  max-width: 240px;
}
.portrait-stage.no-gear .portrait-art { inset: 5% 12% 0; }

.gear-slot {
  position: absolute;
  width: 46px; height: 46px;
  border-radius: 11px;
  border: 1.5px dashed rgba(255, 255, 255, 0.25);
  background: rgba(0, 0, 0, 0.45);
  display: grid; place-items: center;
  font-size: 20px;
}
.gear-slot.filled { border-style: solid; border-color: var(--gr); box-shadow: 0 0 12px -4px var(--gr); }
.gear-slot .gs-lv, .gear-slot .gs-item { z-index: 2; }
.gear-slot:not(.filled) .gi { opacity: 0.35; }
.slot-weapon { top: 10px; left: 10px; }
.slot-chest  { top: 66px; left: 10px; }
.slot-gloves { top: 10px; right: 10px; }
.slot-boots  { top: 66px; right: 10px; }

.power-plate {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.6); border: 1px solid var(--gold);
  color: var(--gold); font-weight: 800; font-size: 16px;
  padding: 3px 14px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

.stat-panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 10px; margin-top: 10px;
}
.level-line { text-align: center; font-size: 19px; font-weight: 800; color: var(--gold); }
.xp-track {
  height: 6px; border-radius: 3px; margin: 7px 4px 3px;
  background: rgba(0, 0, 0, 0.5); overflow: hidden;
}
.xp-fill {
  display: block; height: 100%;
  background: linear-gradient(90deg, #38bdf8, #a78bfa);
  transition: width 0.3s ease;
}
.xp-line {
  text-align: center; font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.reward.level-up { border-color: var(--gold); color: var(--gold); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 4px; }
.stat { text-align: center; }
.sn { display: block; font-size: 10px; color: var(--muted); }
.sv { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }

.stars-panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 14px; text-align: center;
}
.big-stars .pip { font-size: 26px; }
.star-caption { color: var(--muted); font-size: 12px; margin-top: 2px; }

.promo-table { margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
.promo-row {
  display: grid; grid-template-columns: 60px 1fr 26px 1fr;
  align-items: center; font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--panel-line); padding-bottom: 5px;
}
.pk { text-align: left; color: var(--muted); font-size: 12px; }
.pv { font-weight: 700; }
.pv.next { color: var(--good); }
.parrow { color: var(--good); }

.slot-row { display: flex; justify-content: center; gap: 8px; margin: 14px 0 6px; }
.skill-slot {
  width: 50px; height: 50px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  border: 1.5px solid var(--panel-line);
  background: linear-gradient(180deg, #3b2a5c, #241a3a);
  font-size: 21px;
}
.skill-slot.off { filter: grayscale(1) brightness(0.5); }
.skill-slot.reserved { border-style: dashed; }
.skill-slot .req {
  position: absolute; bottom: -2px; right: -2px;
  font-size: 9px; font-weight: 800;
  background: #0b1020; border: 1px solid var(--panel-line);
  border-radius: 5px; padding: 0 3px;
}

.skill-list { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.skill-row {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 12px; padding: 11px;
}
.skill-row.locked { opacity: 0.5; }
.skill-icon {
  width: 42px; height: 42px; flex: none; border-radius: 10px;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(180deg, #3b2a5c, #241a3a);
}
.skill-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.skill-name { font-weight: 700; font-size: 14px; }
.lock-tag {
  font-size: 10px; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold); border-radius: 5px; padding: 0 4px; margin-left: 6px;
}
.skill-slot-label { font-size: 10.5px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.05em; }
.skill-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

/* ---------------- sheets ---------------- */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, 0.62);
  display: flex; align-items: flex-end;
  backdrop-filter: blur(3px);
}
.sheet {
  width: 100%;
  background: var(--bg-2);
  border-top-left-radius: 20px; border-top-right-radius: 20px;
  border-top: 1px solid var(--panel-line);
  padding: 16px 14px calc(16px + var(--safe-bottom));
  max-height: 78dvh; overflow-y: auto;
  animation: sheetUp 0.22s ease;
}
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } }
.sheet-title { font-family: var(--font-display); font-size: 19px; margin-bottom: 12px; }

.gear-rows { display: flex; flex-direction: column; gap: 8px; }
.gear-row, .shard-row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-left: 3px solid var(--gr, var(--rc, var(--panel-line)));
  border-radius: 11px; padding: 10px; text-align: left;
}
.gear-row .gi { font-size: 21px; width: 30px; text-align: center; }
.gt, .sr-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.gt small, .sr-text small { color: var(--muted); font-size: 11px; }
.gr-tag, .sr-count { font-size: 11px; color: var(--muted); font-weight: 700; }
.shard-row { margin-bottom: 8px; }
.sr-art { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3); }

.pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 6px; }

/* ---------------- formation ---------------- */

.battle-brief {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 14px;
}
.brief-title { font-family: var(--font-display); font-size: 19px; letter-spacing: 0.01em; }
.brief-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.enemy-lineup { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.lineup-unit { text-align: center; width: 62px; }
.lu-art {
  width: 62px; height: 62px; border-radius: 11px; overflow: hidden;
  border: 1.5px solid var(--rc); background: rgba(0, 0, 0, 0.3);
}
.lu-name { font-family: var(--font-display); font-size: 12.5px; margin-top: 3px; }
.lu-row { font-size: 9.5px; color: var(--muted); text-transform: uppercase; }

.power-compare { font-size: 12.5px; }
.power-compare.ok { color: var(--good); }
.power-compare.warn { color: var(--warn); }
.warn-tag { background: var(--warn); color: #241503; border-radius: 5px; padding: 0 5px; font-weight: 800; font-size: 10px; margin-left: 5px; }

.formation-field { display: flex; flex-direction: column; gap: 12px; }
.form-row {
  border: 1px dashed var(--panel-line);
  border-radius: var(--radius);
  padding: 9px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
}
.form-front { border-color: rgba(249, 115, 22, 0.4); }
.form-back { border-color: rgba(56, 189, 248, 0.35); }
.row-label { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
.row-slots { display: flex; gap: 9px; flex-wrap: wrap; }

.form-unit {
  width: 96px; text-align: center;
  border: 1.5px solid var(--rarity, var(--panel-line));
  border-radius: 12px; padding: 6px 4px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
}
.fu-art { width: 100%; aspect-ratio: 1/1; background: none; border: 0; padding: 0; display: block; }
.fu-name { font-family: var(--font-display); font-size: 14px; }
.fu-sub { font-size: 10px; color: var(--muted); }
.fu-stars { margin-bottom: 5px; }
.form-unit.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 150px; border-style: dashed; color: var(--muted); font-size: 12px;
}
.form-unit .plus { font-size: 26px; }

.action-bar { margin-top: 16px; }

/* ---------------- results ---------------- */

.results {
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 40px) 18px calc(var(--safe-bottom) + 24px);
  text-align: center;
  display: flex; flex-direction: column;
}
.res-banner { font-family: var(--font-display); font-size: 52px; letter-spacing: 0.05em; }
.results.win .res-banner { color: var(--gold); text-shadow: 0 0 26px rgba(251, 191, 36, 0.55); }
.results.lose .res-banner { color: var(--bad); }
.res-stage { font-family: var(--font-display); font-size: 18px; margin-top: 6px; }
.res-line { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.first-clear {
  margin: 10px auto 0; display: inline-block;
  background: var(--gold); color: #241503; font-weight: 800; font-size: 12px;
  padding: 3px 12px; border-radius: 999px;
}
/* A dungeon opens the next difficulty rather than paying a one-off bonus. */
.first-clear.unlock { background: var(--accent); color: #1a0d02; }

.reward-list { margin: 22px 0; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.reward {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 11px; padding: 10px 13px; font-size: 14px;
}
.reward .ri { font-size: 21px; width: 30px; text-align: center; }
.reward .ri.shard { height: 30px; border-radius: 7px; overflow: hidden; background: rgba(0,0,0,0.3); }
.res-actions { display: flex; flex-direction: column; }

/* ---------------- toasts ---------------- */

#toasts {
  position: fixed; top: calc(var(--safe-top) + 60px); left: 0; right: 0;
  z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid var(--panel-line);
  border-radius: 999px; padding: 7px 16px; font-size: 13px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.toast-good { border-color: var(--good); color: var(--good); }
.toast-warn { border-color: var(--warn); color: var(--warn); }
.toast.out { opacity: 0; transform: translateY(-8px); }

/* ---------------- dungeons ---------------- */

.dungeon-head { margin: 16px 2px 9px; }
.dungeon-head .dh-saga {
  font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.dungeon-head .dh-name { font-family: var(--font-display); font-size: 20px; margin-top: 1px; }
.dungeon-head .dh-sub { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.35; }
.dungeon-head .dh-lock { color: var(--muted); font-size: 12px; margin-top: 6px; }
/* A saga that is not built yet is a signpost, not a control. */
.dungeon-head.soon { opacity: 0.42; }
.dungeon-head.soon .dh-saga { color: var(--muted); }

.tier-list { display: flex; flex-direction: column; gap: 9px; }

.tier-card {
  /* Top-aligned so the difficulty badge reads with the difficulty name rather
     than floating opposite the middle of the card. */
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-left: 3px solid var(--tier, var(--panel-line));
  border-radius: var(--radius);
  padding: 9px 10px;
}
.tier-card.cleared { border-color: rgba(74, 222, 128, 0.3); border-left-color: var(--tier); }
.tier-card.locked { opacity: 0.45; }
.tier-card.risky { border-color: rgba(251, 191, 36, 0.32); border-left-color: var(--tier); }
/* Extreme reads as an event, not just the fourth row down. */
.tier-card.bonus { box-shadow: inset 0 0 22px -10px var(--tier-glow, transparent); }

.tc-rank {
  width: 32px; height: 32px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px;
  background: color-mix(in srgb, var(--tier) 22%, #0b1220);
  color: var(--tier);
  font-family: var(--font-display); font-size: 13px; letter-spacing: 0.02em;
}

.tc-body { flex: 1; min-width: 0; }
.tc-name { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.tc-name .tick { color: var(--good); }
/* Enemy faces sit beside the billing rather than under it \002014 four of these
   cards have to fit on one phone screen. */
.tc-line { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
.tc-line .enemy-row { margin-top: 0; flex: none; }
.tc-line .enemy-chip { width: 24px; height: 24px; border-radius: 6px; border-width: 1.2px; }
.bonus-tag {
  margin-left: 6px; padding: 1px 5px; border-radius: 5px;
  background: var(--tier); color: #0b1220;
  font-family: system-ui, sans-serif; font-size: 8.5px; font-weight: 800; letter-spacing: 0.08em;
  vertical-align: 2px;
}
.tc-boss {
  color: var(--muted); font-size: 11.5px; line-height: 1.3; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.tc-drops { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
.drop-count { font-size: 10.5px; font-weight: 700; color: var(--text); flex: none; }
/* Two tiers often share a rarity and differ only here, so the band is the
   headline number on the card, not a footnote. */
.drop-lv { font-size: 10.5px; font-weight: 800; color: var(--gold); flex: none; }
.drop-pip {
  font-size: 9.5px; padding: 1px 5px; border-radius: 999px; white-space: nowrap;
  color: color-mix(in srgb, var(--rc) 70%, var(--muted));
  border: 1px solid color-mix(in srgb, var(--rc) 25%, transparent);
}
/* The rarity you should expect, as opposed to the ones that are merely possible. */
.drop-pip.modal {
  color: var(--rc); font-weight: 700;
  border-color: color-mix(in srgb, var(--rc) 55%, transparent);
  background: color-mix(in srgb, var(--rc) 14%, transparent);
}
.tier-card .stage-meta { margin-top: 5px; font-size: 11px; gap: 9px; }
.tier-card .stage-action { align-self: center; }
.tc-zeni { color: var(--muted); }

/* A dungeon brief keeps its tier colour through the pre-battle screen. */
.battle-brief.dungeon { border-left: 3px solid var(--tier, var(--panel-line)); }

/* ---------------- gear levels ---------------- */

/* The level is the number that actually differs between two copies of the same
   item, so it reads as part of the name rather than as metadata beside it. */
.glv {
  font-size: 0.82em; font-weight: 800; color: var(--gold);
  letter-spacing: 0.01em;
}
/* Two badges on one 46px slot, so each gets a corner and only the digits.
   Bottom-right is the SLOT's bought level (+N, gold, the reference's
   placement); top-left is the ITEM's own level in its rarity colour. */
.gs-lv {
  position: absolute; right: -3px; bottom: -3px;
  font-size: 9.5px; font-weight: 800; line-height: 1;
  padding: 2px 4px; border-radius: 999px;
  background: linear-gradient(180deg, #3f2d06, #1b1303);
  border: 1px solid var(--gold); color: var(--gold);
}
.gs-item {
  position: absolute; left: -3px; top: -3px;
  font-size: 9.5px; font-weight: 800; line-height: 1;
  padding: 2px 4px; border-radius: 999px;
  background: rgba(6, 11, 22, 0.92);
  border: 1px solid var(--gr); color: var(--gr);
}

/* ---------------- gear detail card ---------------- */

.sheet-backdrop.centred { align-items: center; justify-content: center; padding: 18px; }

/* The card is the item, so it is tinted by the item's rarity throughout
   rather than being a neutral panel with a coloured accent. */
.sheet.gear-detail {
  padding: 0; overflow: hidden;
  width: auto; max-width: 340px;
  border-radius: 18px;
  border: 1px solid var(--panel-line);
  box-shadow: 0 18px 50px -12px rgba(0, 0, 0, 0.8);
  animation: cardIn 0.18s ease;
}
@keyframes cardIn { from { transform: scale(0.94); opacity: 0; } }

.gd-head {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--gr) 42%, #0b1220),
    color-mix(in srgb, var(--gr) 20%, #0b1220));
  border-bottom: 1px solid color-mix(in srgb, var(--gr) 45%, transparent);
}
.gd-name { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.01em; min-width: 0;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-plus { font-family: var(--font-display); font-size: 20px; color: var(--gold); flex: none; }

.gd-band {
  position: relative;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 14px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--gr) 14%, #0b1220), #0b1220);
}
.gd-slot { font-size: 12px; color: var(--muted); }
.gd-rarity { font-family: var(--font-display); font-size: 17px; color: var(--gr); margin-top: 1px; }
.gd-worth { font-family: var(--font-display); font-size: 22px; color: var(--gold); margin-top: 3px; }
.gd-art {
  font-size: 46px; line-height: 1;
  filter: drop-shadow(0 3px 10px color-mix(in srgb, var(--gr) 60%, transparent));
}
.gd-level {
  position: absolute; right: 0; bottom: 0;
  padding: 3px 14px 3px 12px;
  border-top-left-radius: 999px;
  background: rgba(0, 0, 0, 0.5);
  font-size: 12px; color: var(--muted);
}
.gd-level b { color: var(--text); font-size: 14px; }

.gd-stats { padding: 10px 12px 4px; }
/* The item's own flat numbers are its headline, so those get the stronger
   ground; everything else is a plain row. (An even/odd zebra was tried and
   miscounts, because the section headings are siblings too.) */
.gd-stat {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13.5px;
}
.gd-stat + .gd-stat { background: rgba(255, 255, 255, 0.03); }
.gd-stat b { font-variant-numeric: tabular-nums; }
.gd-stat.main { background: rgba(255, 255, 255, 0.09); font-weight: 600; }
.gd-stat.main b { color: var(--gold); }
.gd-sub {
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin: 10px 0 4px 10px;
}

.gd-actions {
  display: flex; gap: 8px; padding: 10px 12px 12px;
}
/* Two buttons on a 340px card: the labels must not wrap. */
.gd-actions .btn { flex: 1; white-space: nowrap; font-size: 12.5px; padding: 9px 8px; }

.gear-row .scrap { flex: none; font-variant-numeric: tabular-nums; }
.gear-row .scrap.danger { border-color: var(--bad); color: var(--bad); }

/* ---------------- bag tabs ---------------- */

/* The hero screen pins its tabs to the bottom; the Bag's belong at the top,
   under the wallet, because its tabs switch between whole inventories rather
   than between views of one hero. */
.tab-bar.bag-tabs {
  position: static; margin: 12px 0 4px;
  padding: 0; background: none; backdrop-filter: none; border-top: 0;
}
.tab-bar.bag-tabs .tab-btn { padding: 9px 0; font-size: 13.5px; }
.tab-bar.bag-tabs .tab-btn.active { background: var(--accent); color: #1a0d02; }
.bag-tabs + .tab-body { padding-bottom: 20px; }

/* ---------------- dismantle grid ---------------- */

.scrap-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 6px 2px 10px;
  font-size: 13px;
}
.sh-count b { color: var(--gold); font-size: 15px; }
.sh-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; color: var(--muted); font-size: 12.5px;
}
.sh-toggle .sh-box {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--panel-line);
  display: grid; place-items: center; font-size: 11px; line-height: 1;
}
.sh-toggle.on { color: var(--text); }
.sh-toggle.on .sh-box { background: var(--good); border-color: var(--good); color: #0b1020; }

.scrap-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px;
}
.scrap-tile {
  position: relative; aspect-ratio: 1;
  border-radius: 14px;
  border: 2px solid var(--gr);
  background: color-mix(in srgb, var(--gr) 12%, #0b1220);
  display: grid; place-items: center;
  font-size: 27px;
}
/* Selection is the ACCENT, never a rarity colour \002014 a green "selected" ring on
   a green uncommon border is unreadable. */
.scrap-tile.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 22%, #0b1220);
  box-shadow: 0 0 0 2px var(--accent), 0 0 18px -5px var(--accent);
}
/* Held back rather than hidden: seeing why a piece is not on the table is the
   whole point of the exclude toggle. */
.scrap-tile.blocked { opacity: 0.42; }

/* Unchecked is an empty outline, not a filled disc \002014 a dark disc on a dark
   tile reads as a hole punched in the corner. */
.st-check {
  position: absolute; top: -4px; left: -4px;
  width: 20px; height: 20px; border-radius: 999px;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  background: rgba(11, 18, 32, 0.75); color: #1a0d02;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 900; line-height: 1;
}
.scrap-tile.on .st-check { background: var(--accent); border-color: var(--accent); }
.scrap-tile.blocked .st-check { display: none; }
.st-lv {
  position: absolute; right: 3px; bottom: 2px;
  font-size: 11px; font-weight: 800; color: var(--text);
  text-shadow: 0 1px 3px #000;
}
.st-flag { position: absolute; top: 2px; right: 3px; font-size: 11px; }

.scrap-rarities {
  display: flex; flex-wrap: wrap; gap: 7px;
  margin: 14px 0 10px;
}
.rarity-pick {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--rc) 40%, transparent);
  background: color-mix(in srgb, var(--rc) 10%, transparent);
  color: var(--rc); font-size: 12px; font-weight: 700;
}
.rarity-pick small { color: var(--muted); font-weight: 500; }
.rp-dot {
  width: 9px; height: 9px; border-radius: 999px;
  border: 1.5px solid var(--rc);
}
.rarity-pick.on {
  background: color-mix(in srgb, var(--accent) 22%, transparent);
  border-color: var(--accent); color: var(--text);
}
.rarity-pick.on .rp-dot { background: var(--accent); border-color: var(--accent); }

.scrap-actions { margin-top: 4px; }

/* ---------------- lock ---------------- */

.gd-lock {
  margin-left: auto; flex: none;
  width: 32px; height: 32px; border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(0, 0, 0, 0.28);
  font-size: 15px; line-height: 1;
}
.gd-lock.on { border-color: var(--gold); background: rgba(251, 191, 36, 0.16); }
.lock-note { color: var(--gold); }


/* battle.css \002014 the real-time battle screen.
   Side-view lanes: player left, enemies right; back row sits behind and above
   the front row to fake depth in portrait. */

.battle-screen {
  position: relative;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* Layered rather than a single wash: a low sun behind the horizon, haze
     above it, dark ground below. Depth is what stops a flat gradient reading
     as a placeholder. */
  background:
    radial-gradient(120% 42% at 50% 58%, rgba(255, 168, 92, 0.13) 0%, transparent 70%),
    radial-gradient(80% 40% at 50% 10%, #2c3c6e 0%, transparent 65%),
    linear-gradient(180deg, #0d1430 0%, #131c3d 38%, #0a1024 58%, #070b18 100%);
}
/* vignette \002014 pulls the eye to the middle of the field */
.battle-screen::after {
  content: '';
  position: absolute; inset: 0;
  pointer-events: none; z-index: 6;
  background: radial-gradient(115% 78% at 50% 50%, transparent 52%, rgba(2, 4, 12, 0.62) 100%);
}

/* ---- top bar ---- */

.bt-top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
}
.bt-stage { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.02em; flex: 1; opacity: 0.9; }
.bt-timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px;
  background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px; padding: 3px 11px;
}


/* ---- arena ---- */

.arena {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 4px;
  min-height: 0;
  position: relative;
  /* The whole field pushes in on a cinematic beat. */
  transform: scale(var(--arena-zoom, 1));
  transition: transform 260ms cubic-bezier(0.2, 0.9, 0.3, 1);
}
/* Ground plane. The transition has to be a haze rather than an edge \002014 a hard
   line across the middle of the screen reads as a seam in the layout, not as
   a horizon. */
.arena::after {
  content: '';
  position: absolute; left: -10%; right: -10%; bottom: 0;
  height: 52%;
  /* The warm pool is centred ABOVE the box so it fades in \002014 anchored at the
     box's own top edge it cut off flat and put a bright line across the
     screen, which is exactly the seam this is meant to hide. */
  background:
    radial-gradient(80% 78% at 50% -18%, rgba(255, 186, 122, 0.16), transparent 70%),
    linear-gradient(180deg,
      rgba(84, 64, 46, 0) 0%,
      rgba(84, 64, 46, 0.13) 30%,
      rgba(44, 32, 22, 0.4) 100%);
  z-index: 0;
}

.side { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; position: relative; z-index: 1; }
/* Keep the outer fighters off the bezel \002014 damage numbers and rings need
   room to play outside the body without leaving the screen. */
.side-player { justify-content: flex-start; padding-left: 10px; }
.side-enemy { justify-content: flex-end; padding-right: 16px; }

.lane { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
/* stagger stacked units sideways so a lane reads as a formation, not a column */
/* Formation stagger. Kept modest: a side has to hold two lanes of two on a
   390px screen, and a wider offset pushed the back rank off the edge. */
.side-player .lane .unit:nth-child(even) { margin-left: 16px; }
.side-enemy .lane .unit:nth-child(even) { margin-right: 16px; }
/* The back lane tucks behind the front one rather than sitting beside it \002014
   it is already drawn smaller and lifted, so the overlap reads as depth. */
.side-player .lane-back { margin-right: -22px; }
.side-enemy .lane-back { margin-left: -22px; }
/* back row: smaller and lifted, so it reads as "further away" */
.lane-back { transform: translateY(-40px) scale(0.8); opacity: 0.92; }

.unit {
  position: relative;
  width: 84px;
  display: flex; flex-direction: column; align-items: center;
  transition: opacity 0.35s ease;
}
.unit.dead { opacity: 0; transform: translateY(14px) scale(0.85); pointer-events: none; }


.u-art { width: 84px; height: 122px; position: relative; }

/* Sprite units. The frame is sized by height so every pose keeps one scale,
   and pinned by its --cx anchor (the character's torso centre) so a wide pose
   like a high kick or a knockback doesn't slide the character sideways. */
.u-sprite { position: absolute; inset: 0; }
.unit.enemy .u-sprite { transform: scaleX(-1); }
.u-frame {
  position: absolute;
  bottom: 0;
  left: 50%;
  height: calc(100% * var(--sprite-scale, 1));
  width: auto;
  max-width: none;
  transform: translateX(calc(var(--cx, 0.5) * -100%));
  image-rendering: auto;
  pointer-events: none;
}
/* Sprite units play their own defeat clip, so they hold at full opacity until
   it finishes. :not(.dead) matters \002014 this selector is more specific than
   .unit.dead, and without it the body would never fade out afterwards. */
.unit.has-sprite.dying:not(.dead) { opacity: 1; transform: none; }
/* Contact shadow: a dark ellipse under the feet plus the character's own
   aura, so a unit sits on the ground instead of floating over it. */
.u-art::after {
  content: '';
  position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 56px; height: 15px; border-radius: 50%;
  background:
    radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent 78%),
    radial-gradient(closest-side, var(--aura), transparent);
  opacity: 0.62;
}

/* hit / attack motion \002014 these are the only "animations" in the prototype */
.u-art.hit { animation: hitShake 0.22s ease; }
@keyframes hitShake {
  0% { transform: translateX(0); filter: none; }
  25% { transform: translateX(-5px); filter: brightness(2.4) saturate(0.3); }
  60% { transform: translateX(4px); filter: brightness(1.4); }
  100% { transform: translateX(0); filter: none; }
}
.unit.player .u-art.lunge { animation: lungeR 0.3s ease; }
.unit.enemy .u-art.lunge { animation: lungeL 0.3s ease; }
@keyframes lungeR { 50% { transform: translateX(11px); } }
@keyframes lungeL { 50% { transform: translateX(-11px); } }

/* Kamehameha. The release frame draws the hands but no beam \002014 this is the beam,
   so it can stretch to whatever it is aimed at. */
.u-beam {
  position: absolute;
  top: 52%;
  left: 100%;
  height: 9px;
  width: 0;
  opacity: 0;
  transform: translateY(-50%);
  border-radius: 999px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.98) 0%,
    rgba(186,230,253,0.95) 25%,
    rgba(56,189,248,0.75) 65%,
    rgba(56,189,248,0) 100%);
  box-shadow: 0 0 16px 4px rgba(125, 211, 252, 0.65);
  pointer-events: none;
  z-index: 3;
}
.unit.enemy .u-beam {
  left: auto; right: 100%;
  background: linear-gradient(270deg,
    rgba(255,255,255,0.98) 0%,
    rgba(254,215,170,0.95) 25%,
    rgba(249,115,22,0.75) 65%,
    rgba(249,115,22,0) 100%);
  box-shadow: 0 0 16px 4px rgba(251, 146, 60, 0.6);
}
.u-beam.fire { animation: beamOut var(--beam-ms, 400ms) ease-out forwards; }
@keyframes beamOut {
  0%   { width: 0; opacity: 0; }
  18%  { width: calc(var(--beam-len, 150px) * 0.55); opacity: 1; }
  55%  { width: var(--beam-len, 150px); opacity: 1; }
  100% { width: var(--beam-len, 150px); opacity: 0; }
}

.u-bar {
  width: 54px; height: 5px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(0, 0, 0, 0.8);
  overflow: hidden;
  margin-top: 2px;
}
.u-fill {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(180deg, #86efac, #22c55e);
  transition: width 0.16s linear;
}
.unit.enemy .u-fill { background: linear-gradient(180deg, #fca5a5, #ef4444); }
.u-fill.low { background: linear-gradient(180deg, #fde047, #f59e0b); }

.u-name {
  font-size: 9px; color: rgba(255, 255, 255, 0.7);
  margin-top: 2px; white-space: nowrap;
}

/* ---- floating combat text ---- */

.u-fx {
  position: absolute; left: 50%; top: 6px; width: 0; height: 0; z-index: 4; }
.float {
  position: absolute;
  left: 0; top: 0;
  transform: translateX(-50%);
  font-weight: 900;
  font-size: 15px;
  white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
  animation: floatUp 0.95s ease-out forwards;
  font-variant-numeric: tabular-nums;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(6px + var(--dy, 0px))) scale(0.7); }
  18%  { opacity: 1; transform: translate(calc(-50% + var(--dx, 0px)), calc(-4px + var(--dy, 0px))) scale(1.12); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-46px + var(--dy, 0px))) scale(0.95); }
}
.float.dmg { color: #fff; }
.float.crit { color: #fde047; font-size: 20px; }
.float.heal { color: #4ade80; }
.float.self { color: #fca5a5; }
.float.buff { color: #7dd3fc; font-size: 12px; }
.float.debuff { color: #c084fc; font-size: 12px; }

/* ---- skill call-out above the caster ---- */

/* Callouts on the outer edges of the arena would run off screen if they were
   centred on their unit, so each side's hang inward. */
.unit.enemy .u-callout { left: auto; right: 0; transform: none; }
.unit.player .u-callout { left: 0; right: auto; transform: none; }

.u-callout {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 800; white-space: nowrap;
  padding: 2px 8px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.18);
  opacity: 0; z-index: 5;
  transition: opacity 0.18s ease;
  max-width: 128px; overflow: hidden; text-overflow: ellipsis;
}
/* Both sides shout at once constantly. Putting the enemy's callouts on their
   own line stops two simultaneous skill names landing on top of each other. */
.unit.enemy .u-callout { top: -32px; left: auto; right: 0; transform: none; }
.u-callout.show { opacity: 1; }
.u-callout.ultimate { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px -3px var(--gold); }
.u-callout.technique { border-color: #38bdf8; color: #7dd3fc; }
.u-callout.passive { border-color: #c084fc; color: #d8b4fe; }
.u-callout.telegraph { border-color: var(--bad); color: #fecaca; box-shadow: 0 0 16px -2px var(--bad); }
.u-callout.phase { border-color: #fb7185; color: #fecdd3; box-shadow: 0 0 20px -2px #fb7185; }

/* ---- bottom dock: per-hero cooldown + ultimate meter ---- */

/* A status readout now, not a control \002014 the action bar below owns input. */
.bt-dock {
  display: flex; gap: 8px; justify-content: center;
  padding: 8px 12px 8px;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.5) 40%);
}

.dock-card {
  position: relative;
  width: 84px;
  border-radius: 13px;
  border: 1.5px solid var(--rarity, #64748b);
  background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(0,0,0,0.4));
  padding: 4px 4px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.dock-card.down { filter: grayscale(1) brightness(0.5); }

.dc-art { width: 46px; height: 46px; border-radius: 9px; overflow: hidden; background: rgba(0,0,0,0.3); }
.dc-name { font-size: 9.5px; color: rgba(255,255,255,0.72); }

.dc-ult, .dc-hp {
  width: 68px; height: 4px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.6); overflow: hidden;
}
.dc-ult-fill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #f97316); transition: width 0.15s linear; }
.dc-hp-fill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #86efac); transition: width 0.16s linear; }


/* the "ultimate ready" state called for in the reference dock */
.dock-card.ult-ready {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), 0 0 18px -2px var(--gold);
  animation: ultReady 1s ease-in-out infinite;
}
@keyframes ultReady {
  0%, 100% { box-shadow: 0 0 0 1px var(--gold), 0 0 12px -3px var(--gold); }
  50%      { box-shadow: 0 0 0 1px var(--gold), 0 0 24px 1px var(--gold); }
}


/* A unit that has turned keeps a permanent mark of it. */
.unit.phased .u-art { filter: drop-shadow(0 0 10px #fb7185); }

@media (prefers-reduced-motion: reduce) {
  .u-art.hit, .u-art.lunge, .dock-card.ult-ready, .hero-card.unlockable { animation: none; }
  .unit.charging::after, .unit.threatened::before, .unit.selected::before,
  .to-pip.now, .dock-card.nope { animation: none; }
  .unit.charging::after, .unit.threatened::before { opacity: 0.8; }
  .unit { transition: opacity 0.35s ease; }
  .u-beam.fire { animation: none; width: var(--beam-len, 150px); opacity: 1; }
}

/* ---- turn order ----
   The spine of a turn-based fight: who acts next has to be a fact on screen,
   not something the player infers from speed stats. Left is soonest. */

.turn-order {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 14px 8px;
  overflow-x: auto; scrollbar-width: none;
}
.turn-order::-webkit-scrollbar { display: none; }

.to-pip {
  position: relative; flex: none;
  width: 34px; height: 34px; border-radius: 10px;
  border: 1.5px solid var(--rarity, #64748b);
  background: rgba(0, 0, 0, 0.4);
  overflow: hidden;
  opacity: 0.55;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.to-pip .to-art { position: absolute; inset: 0; }
/* The one acting right now leads the strip and is the only one at full size. */
.to-pip.now {
  opacity: 1; width: 42px; height: 42px; border-width: 2px;
  box-shadow: 0 0 12px -2px var(--rarity);
}
.to-pip.enemy { border-style: dashed; }
.to-pip .to-flag {
  position: absolute; right: -1px; bottom: -2px;
  font-size: 11px; color: var(--bad); text-shadow: 0 1px 3px #000;
}

/* ---- unit states ---- */

/* Charging: announced this turn, lands on this unit's next one. */
.unit.charging::after {
  content: '';
  position: absolute; inset: -6px;
  border-radius: 50%;
  border: 2px solid var(--bad);
  animation: chargeRing 0.9s ease-in-out infinite;
  pointer-events: none;
}
@keyframes chargeRing {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50%      { opacity: 0.95; transform: scale(1.06); }
}
.unit.charging .u-art { filter: drop-shadow(0 0 14px var(--bad)); }

/* In the blast of something charging. */
.unit.threatened::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 12px;
  border: 2px dashed var(--bad);
  animation: threatPulse 0.7s ease-in-out infinite;
  pointer-events: none;
}
@keyframes threatPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }

/* Braced. Halves the next hit, so it needs to read at a glance. */
.unit.guarding .u-art { filter: drop-shadow(0 0 10px #38bdf8) brightness(0.95); }
.unit.guarding::after {
  content: '\01f6e1\00fe0f';
  position: absolute; top: 4px; right: 2px;
  font-size: 15px; z-index: 4;
  text-shadow: 0 1px 4px #000;
}

/* Whose turn it is. */
.unit.acting .u-art { filter: drop-shadow(0 0 12px var(--gold)); }

/* Picking a target. */
.unit.selectable { cursor: pointer; }
.unit.selectable .u-art { outline: 2px dotted rgba(255,255,255,0.28); outline-offset: 3px; border-radius: 10px; }
.unit.selected::before {
  content: '';
  position: absolute; inset: -5px;
  border-radius: 12px;
  border: 2.5px solid var(--gold);
  box-shadow: 0 0 16px -3px var(--gold);
  pointer-events: none;
}

.unit.phased .u-art { filter: drop-shadow(0 0 10px #fb7185); }


/* ---- action bar ----
   Only ever shows what the engine says is legal, so a greyed button is a
   cooldown or an unfilled meter and never a bug. */

.action-bar-battle {
  min-height: 92px;
  padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px));
}
.ab-who {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); text-align: center; margin-bottom: 6px;
}
.ab-who.waiting { color: var(--muted); padding-top: 22px; }
.ab-row { display: flex; gap: 6px; }
.ab-btn {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 8px 4px 7px;
  border-radius: 12px;
  border: 1.5px solid var(--panel-line);
  background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(0,0,0,0.42));
  color: var(--text);
}
.ab-ico { font-size: 19px; line-height: 1; }
.ab-name {
  font-size: 9.5px; font-weight: 700; line-height: 1.15; text-align: center;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ab-sub { font-size: 9px; color: var(--muted); }
.ab-btn.disabled { opacity: 0.4; pointer-events: none; }
.ab-btn.ultimate { border-color: var(--gold); box-shadow: 0 0 14px -4px var(--gold); }
.ab-btn.technique { border-color: #38bdf8; }
.ab-btn.guard { border-color: #94a3b8; }
.ab-btn:active { transform: scale(0.96); }

/* AUTO is a mode, so it stays lit while it is on. */
#bt-auto.on { border-color: var(--good); color: var(--good); }

.float.guard { color: #7dd3fc; font-size: 12px; }
.u-callout.charge { border-color: var(--bad); color: #fecaca; box-shadow: 0 0 16px -2px var(--bad); }
.u-callout.phase { border-color: #fb7185; color: #fecdd3; box-shadow: 0 0 20px -2px #fb7185; }
.u-callout.guard { border-color: #38bdf8; color: #bae6fd; }

/* ============================================================
   IMPACT
   A hit needs anticipation, contact and follow-through. Standing
   still and printing a number is what made every attack in the
   real-time build read the same weight.
   ============================================================ */

/* The attacker crosses the gap, connects, and returns. */
.unit.lunging {
  animation: lungeIn var(--lunge-ms, 520ms) cubic-bezier(0.3, 0, 0.2, 1);
  z-index: 5;
}
@keyframes lungeIn {
  0%   { transform: translate(0, 0); }
  16%  { transform: translate(calc(var(--lunge-x) * -0.12), 0) scale(0.97); }  /* wind back */
  42%  { transform: translate(var(--lunge-x), var(--lunge-y)) scale(1.04); }   /* contact */
  62%  { transform: translate(var(--lunge-x), var(--lunge-y)); }
  100% { transform: translate(0, 0); }
}
/* Ranged and casters plant and lean instead of closing. */
.unit.stepping {
  animation: castStep var(--lunge-ms, 520ms) ease-out;
  z-index: 5;
}
@keyframes castStep {
  0%   { transform: translate(0, 0); }
  22%  { transform: translate(calc(var(--lunge-x) * -0.07), 0) scale(0.98); }
  50%  { transform: translate(calc(var(--lunge-x) * 0.1), 0) scale(1.03); }
  100% { transform: translate(0, 0); }
}

/* Contact: white blowout on the body, then an expanding ring. */
.u-art.flashed { animation: flashOut 220ms ease-out; }
@keyframes flashOut {
  0%   { filter: brightness(6) saturate(0); }
  40%  { filter: brightness(2.2) saturate(0.4); }
  100% { filter: none; }
}
.impact {
  position: absolute; left: 50%; top: 46%;
  width: 30px; height: 30px; margin: -15px 0 0 -15px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 0 22px 6px rgba(255, 240, 200, 0.5);
  animation: ringOut 380ms cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  pointer-events: none; z-index: 6;
}
.impact.big {
  border-color: #fde68a;
  box-shadow: 0 0 34px 12px rgba(253, 224, 71, 0.55);
  animation-duration: 500ms;
}
@keyframes ringOut {
  0%   { transform: scale(0.25); opacity: 1; border-width: 4px; }
  100% { transform: scale(3.4); opacity: 0; border-width: 0.5px; }
}
.impact.big::after {
  content: '';
  position: absolute; inset: -8px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,0.5), transparent 70%);
}

/* HIT STOP \002014 everything holds for a few frames on contact. */
.battle-screen.hitstop .unit,
.battle-screen.hitstop .float,
.battle-screen.hitstop .impact,
.battle-screen.hitstop .u-art { animation-play-state: paused !important; }

/* SCREEN SHAKE, scaled to the size of the hit. */
.battle-screen.shake-sm .arena { animation: shakeSm 180ms ease-out; }
.battle-screen.shake-md .arena { animation: shakeMd 280ms ease-out; }
.battle-screen.shake-lg .arena { animation: shakeLg 420ms ease-out; }
@keyframes shakeSm {
  0%,100% { transform: scale(var(--arena-zoom,1)) translate(0,0); }
  30% { transform: scale(var(--arena-zoom,1)) translate(-3px, 2px); }
  70% { transform: scale(var(--arena-zoom,1)) translate(2px, -1px); }
}
@keyframes shakeMd {
  0%,100% { transform: scale(var(--arena-zoom,1)) translate(0,0); }
  20% { transform: scale(var(--arena-zoom,1)) translate(-7px, 4px); }
  45% { transform: scale(var(--arena-zoom,1)) translate(6px, -4px); }
  70% { transform: scale(var(--arena-zoom,1)) translate(-4px, 2px); }
}
@keyframes shakeLg {
  0%,100% { transform: scale(var(--arena-zoom,1)) translate(0,0); }
  12% { transform: scale(calc(var(--arena-zoom,1) * 1.02)) translate(-12px, 7px); }
  30% { transform: scale(calc(var(--arena-zoom,1) * 1.02)) translate(11px, -8px); }
  50% { transform: scale(var(--arena-zoom,1)) translate(-8px, 5px); }
  74% { transform: scale(var(--arena-zoom,1)) translate(5px, -3px); }
}

/* Damage numbers with weight: they punch in, hang, then drift. */
.float {
  animation: floatUp 1100ms cubic-bezier(0.15, 0.9, 0.3, 1) forwards;
  text-shadow: 0 2px 5px #000, 0 0 14px rgba(0,0,0,0.7);
}
@keyframes floatUp {
  0%   { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; }
  14%  { transform: translate(var(--dx), var(--dy)) scale(1.32); opacity: 1; }
  26%  { transform: translate(var(--dx), var(--dy)) scale(1); }
  60%  { transform: translate(var(--dx), calc(var(--dy) - 22px)) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), calc(var(--dy) - 46px)) scale(0.92); opacity: 0; }
}
.float.heavy { font-size: 26px; font-weight: 900; }
.float.crit.heavy { font-size: 30px; }

/* ============================================================
   CUT-IN
   The reason an ultimate is worth holding a turn for.
   ============================================================ */

.battle-screen.cinematic .unit:not(.spotlit) { filter: grayscale(0.7) brightness(0.42); }
.battle-screen.cinematic .unit.spotlit .u-art { filter: drop-shadow(0 0 22px var(--aura)) brightness(1.12); }
.battle-screen.cinematic .unit { transition: filter 140ms ease; }
.battle-screen.cinematic { --arena-zoom: 1.06; }

.cut-in {
  position: absolute; inset: 0;
  z-index: 20; pointer-events: none;
  display: grid; place-items: center;
  animation: cutHold var(--cut-ms, 1150ms) ease forwards;
}
@keyframes cutHold {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  82%  { opacity: 1; }
  100% { opacity: 0; }
}
/* the darkened band the portrait rides in on */
.cut-in::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 34%; height: 30%;
  background: linear-gradient(90deg,
    rgba(4, 6, 16, 0) 0%, rgba(4, 6, 16, 0.9) 12%,
    rgba(4, 6, 16, 0.9) 88%, rgba(4, 6, 16, 0) 100%);
  transform: skewY(-3deg);
}
/* speed lines raking across */
.ci-lines {
  position: absolute; left: 0; right: 0; top: 34%; height: 30%;
  overflow: hidden;
  transform: skewY(-3deg);
  background: repeating-linear-gradient(100deg,
    transparent 0px, transparent 26px,
    color-mix(in srgb, var(--rarity) 28%, transparent) 26px,
    color-mix(in srgb, var(--rarity) 28%, transparent) 27px);
  opacity: 0.4;
  animation: rake var(--cut-ms, 1150ms) linear;
}
@keyframes rake {
  0%   { background-position: 0 0; opacity: 0; }
  18%  { opacity: 0.4; }
  100% { background-position: -300px 0; opacity: 0.08; }
}

.ci-body {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  animation: ciSlide var(--cut-ms, 1150ms) cubic-bezier(0.15, 0.9, 0.25, 1);
}
.cut-in.enemy .ci-body { flex-direction: row-reverse; }
@keyframes ciSlide {
  0%   { transform: translateX(-70px); opacity: 0; }
  16%  { transform: translateX(0); opacity: 1; }
  84%  { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(26px); opacity: 0; }
}
.cut-in.enemy .ci-body { animation-name: ciSlideR; }
@keyframes ciSlideR {
  0%   { transform: translateX(70px); opacity: 0; }
  16%  { transform: translateX(0); opacity: 1; }
  84%  { transform: translateX(0); opacity: 1; }
  100% { transform: translateX(-26px); opacity: 0; }
}

.ci-portrait {
  width: 92px; height: 92px; flex: none;
  border-radius: 16px; overflow: hidden;
  border: 2.5px solid var(--rarity);
  background: rgba(0, 0, 0, 0.5);
  box-shadow: 0 0 30px -4px var(--aura), 0 10px 30px -8px #000;
}
.ci-text { min-width: 0; }
.ci-who {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--rarity); font-weight: 800;
}
.ci-move {
  font-family: var(--font-display);
  font-size: 30px; line-height: 1.02; color: #fff;
  text-shadow: 0 0 26px var(--aura), 0 3px 6px #000;
  text-wrap: balance;
}
.cut-in.phase .ci-move { color: #fecdd3; text-shadow: 0 0 26px #fb7185, 0 3px 6px #000; }

@media (prefers-reduced-motion: reduce) {
  .unit.lunging, .unit.stepping, .impact, .u-art.flashed,
  .battle-screen.shake-sm .arena, .battle-screen.shake-md .arena,
  .battle-screen.shake-lg .arena, .ci-lines { animation: none; }
  .cut-in, .ci-body { animation-duration: 1ms; animation-fill-mode: none; opacity: 1; }
  .float { animation: floatUp 900ms linear forwards; }
}

<script type="module">
/* Z-Fighters \u2014 generated by tools/build-artifact.mjs. Edit src/, not this. */

/* ===== src/config.js ===== */
/**
 * config.js \u2014 Global balance knobs.
 *
 * PLACEHOLDER BALANCE: essentially every number in this file is a first-pass
 * guess meant to be tuned. Nothing here is load-bearing for architecture \u2014
 * changing a value should never require touching a system module.
 */

/** Rarity ladder. Only UNCOMMON and RARE have heroes in this pass;
 *  EPIC and SSR are reserved for the stronger heroes coming later, and are
 *  currently only used by boss enemies. */
const RARITIES = {
  common: {
    id: 'common', name: 'Common', short: 'C',
    color: '#93a3b8', glow: 'rgba(147,163,184,0.55)',
    statMult: 0.8,        // PLACEHOLDER
    hasPassive: false,
    shardsToUnlock: 10,   // PLACEHOLDER
    order: 0,
  },
  uncommon: {
    id: 'uncommon', name: 'Uncommon', short: 'U',
    color: '#4ade80', glow: 'rgba(74,222,128,0.55)',
    statMult: 1.0,
    hasPassive: false,
    shardsToUnlock: 10,
    order: 1,
  },
  rare: {
    id: 'rare', name: 'Rare', short: 'R',
    color: '#38bdf8', glow: 'rgba(56,189,248,0.6)',
    statMult: 1.22,
    hasPassive: false,
    shardsToUnlock: 15,
    order: 2,
  },
  epic: {
    id: 'epic', name: 'Epic', short: 'E',
    color: '#c084fc', glow: 'rgba(192,132,252,0.6)',
    statMult: 1.55,
    hasPassive: true,
    shardsToUnlock: 25,
    order: 3,
  },
  ssr: {
    id: 'ssr', name: 'SSR', short: 'SSR',
    color: '#fbbf24', glow: 'rgba(251,191,36,0.65)',
    statMult: 2.0,
    hasPassive: true,
    shardsToUnlock: 40,
    order: 4,
  },
};

const RARITY_ORDER = ['common', 'uncommon', 'rare', 'epic', 'ssr'];

function rarityOf(id) {
  return RARITIES[id] || RARITIES.common;
}

/** Max star rank. Reference UI shows 5 pips. */
const MAX_STARS = 5;

/**
 * PLACEHOLDER: stat multiplier applied at each star rank. "Promote" raises a
 * hero's stats to the next star's fixed value, so these are absolute rungs,
 * not stacking bonuses.
 */
const STAR_STAT_MULT = [1.0, 1.15, 1.35, 1.6, 1.9, 2.25];

/** PLACEHOLDER: shard cost to promote FROM index star TO star+1. */
const STAR_PROMOTE_SHARDS = [6, 10, 20, 40, 80];

/**
 * PLACEHOLDER: star rank at which each skill slot unlocks.
 * Mirrors the reference screenshot's locked skill slots.
 * The passive slot ALSO requires a rarity with hasPassive === true.
 */
const SKILL_SLOT_UNLOCK = {
  attack: 0,
  technique: 1,
  ultimate: 2,
  passive: 3,
};

/** Order the five slots are laid out in the Stars tab. */
const SKILL_SLOTS = ['attack', 'technique', 'ultimate', 'passive', 'transform'];

/**
 * NOTE (future): 'transform' is the transformation slot, still locked. It
 * belongs to the protagonist alone. The agreed design, for when it is built:
 *
 *   - MANUAL activation, not automatic. The player taps to transform.
 *   - No countdown is shown. When a transformation is available the character
 *     card glows; that glow is the whole affordance.
 *   - Forms give a MODEST stat boost, not their nominal multiplier. Kaio-ken
 *     x3 is stronger than plain Kaio-ken but nowhere near three times as
 *     strong \u2014 think a step up, not a different league.
 *   - Campaign difficulty gets retuned around the forms once they exist, so
 *     they are part of the expected power curve rather than a free win.
 *
 * The Saiyan Saga ladder is Kaio-ken then Kaio-ken x3; Super Saiyan belongs to
 * the next arc and is the first form that needs new art (gold hair). Kaio-ken
 * is a red aura, which is a tint over the existing sprites.
 */
const RESERVED_SLOTS = ['transform'];

/**
 * FIGHT LENGTH \u2014 the one knob for pacing. Multiplies the HP of everyone on the
 * field, heroes and enemies alike, so raising it stretches every fight without
 * touching who beats whom: both sides gain the same survivability.
 *
 * It is not perfectly neutral, and the direction is worth knowing. A longer
 * fight means more turns, and more turns means more techniques and ultimates \u2014
 * so it quietly favours whoever has the better kit. That is usually the boss.
 * Re-run tools/simulate.mjs after changing this.
 *
 * Dropped from 2.0 when combat went turn-based: a unit that used to swing
 * thirty-odd times in a fight now takes six or eight turns, so the same HP
 * pool turned every boss into a stalemate against the turn cap.
 */
const HP_SCALE = 0.8;

const MAX_LEVEL = 60;             // PLACEHOLDER

/**
 * PLACEHOLDER: +3.5% of base stats per level, so level 30 is about 2.0x rather
 * than the 2.6x it used to be. Still a real step every time one lands \u2014 the
 * point of the reduction is that gear and stars get to matter too, not that
 * levelling should feel thin.
 */
const LEVEL_STAT_STEP = 0.035;

/**
 * PLACEHOLDER: XP needed to go from `level` to `level + 1`. The exponent is
 * what makes levels earned rather than bought \u2014 each one costs meaningfully
 * more than the last, so a level late in the game is a genuine milestone.
 */
function xpForLevel(level) {
  return Math.round(80 * Math.pow(level, 1.55));
}

/** Cumulative XP to reach each level. Index i holds the total for level i + 1. */
const XP_TABLE = (() => {
  const table = [0];
  for (let level = 1; level < MAX_LEVEL; level++) {
    table.push(table[level - 1] + xpForLevel(level));
  }
  return table;
})();

/** Total XP required to stand at `level`. */
function xpToReach(level) {
  return XP_TABLE[Math.max(0, Math.min(MAX_LEVEL, level) - 1)];
}

/** The level a given lifetime XP total buys. */
function levelFromXp(xp) {
  let level = 1;
  while (level < MAX_LEVEL && xp >= XP_TABLE[level]) level++;
  return level;
}

/* ---------------- companions ----------------
 *
 * Companions do not level individually. There are COMPANION_SLOTS slots, each
 * with its own level bought with senzu beans and zeni, and every companion you
 * own \u2014 equipped or not \u2014 fights at the level of the LOWEST slot.
 *
 * That rule is the whole point: a chain is as strong as its weakest link, so
 * there is nothing to gain from pouring everything into one slot, and raising
 * the roster means raising both. It also means a companion recruited today
 * arrives already useful instead of starting again at level 1.
 */
const COMPANION_SLOTS = 2;

/** PLACEHOLDER: zeni to raise one slot from `level` to `level + 1`. */
function slotTrainZeni(level) {
  return Math.round(40 * Math.pow(1.18, level - 1));
}

/**
 * PLACEHOLDER: senzu beans for the same step. See tools/economy.mjs \u2014 the
 * slope has to outrun the cap, or beans go cheap and the cap silently becomes
 * the only limit. Two slots means paying this twice per effective level.
 */
function slotTrainSenzu(level) {
  return 1 + Math.floor((level - 1) / 2);
}

/**
 * Companions never out-level the protagonist. Strict: pushing the team forward
 * always means pushing him forward first.
 */
const COMPANION_LEVEL_CAP_OFFSET = 0;

/* ---------------- bonds ----------------
 *
 * Every companion you own lends the protagonist something, whether or not it
 * is fielded. That is what makes collecting worth doing: a companion you never
 * equip still adds to your hero, and starring it up adds more.
 *
 * amount = base x rarity x star x slot share
 */

/** Rarer companions lend more. Epic and SSR are here for companions to come. */
const BOND_RARITY_MULT = {
  common: 0.6, uncommon: 1, rare: 1.5, epic: 2.2, ssr: 3.2,
};

/** Indexed by star rank. 0 means unowned, which lends nothing. */
const BOND_STAR_MULT = [0, 1, 1.35, 1.8, 2.35, 3];

/** An equipped companion lends in full; the rest of the collection a quarter. */
const BOND_EQUIPPED_SHARE = 1;
const BOND_COLLECTED_SHARE = 0.25;

/**
 * PLACEHOLDER: Power Level is a single headline number derived from final
 * stats (gear included) plus star rank. Tune freely \u2014 nothing branches on it
 * except stage power gates.
 *
 * NOTE (pass 2): levels should be MEANINGFUL AND HARD-EARNED, not weak. The
 * problem to solve is not that a level gives too much \u2014 it is that level is
 * currently the only axis that matters. LEVEL_STAT_STEP compounds to about
 * 2.6x by level 30, so power today is essentially a readout of level.
 *
 * The fix is two-sided, and doing only half of it makes levelling feel hollow:
 *   - slow levels down, so each one is earned rather than bought;
 *   - raise what gear, skill ranks and stars contribute, so power reads as the
 *     sum of several tracks and no single one dominates.
 * A level should still land as a real step up when it arrives.
 */
function computePower(stats, star = 0) {
  return Math.round(
    stats.atk * 2.4 +
    stats.hp * 0.22 +
    stats.def * 1.8 +
    stats.speed * 40 +
    star * 120
  );
}

/**
 * gear/gear.js \u2014 Equipment definitions (data only).
 *
 * Four slots per hero: weapon, chest, gloves, boots \u2014 matching the reference
 * hero-detail screen. Gear is drop-only for this prototype (no crafting or
 * shop). Pool is deliberately tiny; adding items is a data-only change.
 *
 * PLACEHOLDER: all bonuses and the rarity spread are untuned.
 *
 * These carry real weight now. Since levels were slowed down so that level is
 * no longer the only thing driving power, gear has to be one of the tracks
 * taking up the slack \u2014 a full set should read as a genuine step up, not a
 * rounding error next to a couple of levels.
 */

const GEAR_SLOTS = ['weapon', 'chest', 'gloves', 'boots'];

/**
 * GEAR LEVEL \u2014 the main axis of gear progression.
 *
 * An item drops at a level and keeps it forever; there is no upgrading. What
 * a level is worth: +8% of the item's own base stats, compounding linearly, so
 * a Lv.10 piece is 1.7x its Lv.1 self and a Lv.40 piece is 4.1x.
 *
 * Level is NOT tied to the hero's level and has no ceiling of its own. What
 * limits it is content: every drop source declares the band it rolls in, so
 * the deepest thing you have unlocked is the best gear you can hold. Adding a
 * saga raises the ceiling without touching this file.
 *
 * The multiplier applies to flat AND percentage bonuses alike. Percentages are
 * the ones to watch when tuning \u2014 they compound with every other multiplier in
 * statsFor() \u2014 so if late-game gear ever starts dwarfing the other power
 * tracks, this constant is the knob, not the drop tables.
 *
 * PLACEHOLDER: 0.08 is a first pass, checked against tools/simulate.mjs.
 */
const GEAR_LEVEL_STEP = 0.08;

function gearLevelMult(level = 1) {
  return 1 + (Math.max(1, level) - 1) * GEAR_LEVEL_STEP;
}

/**
 * GEAR SLOT LEVEL \u2014 the slow grind that runs underneath the drops.
 *
 * Each of the four slots carries its own level, bought with iron from
 * dismantling gear you do not want. It multiplies whatever is IN that slot, so
 * an empty slot is worth nothing and a slot level is worth more once you have
 * something good in it.
 *
 * The step is deliberately tiny: one slot level is 1/20th of one gear level.
 * Slot levels are a sink for surplus, not a substitute for finding better
 * gear, and the numbers are meant to climb into the hundreds over a long game
 * the way the reference does.
 *
 * PLACEHOLDER: 0.004 and the cost curve are first-pass guesses.
 */
const GEAR_SLOT_LEVEL_STEP = 0.004;

function gearSlotMult(slotLevel = 0) {
  return 1 + Math.max(0, slotLevel) * GEAR_SLOT_LEVEL_STEP;
}

/** Iron to take a slot from `level` to `level + 1`. */
function slotUpgradeCost(level = 0) {
  return Math.round(6 * Math.pow(1.035, Math.max(0, level)));
}

/**
 * Iron from dismantling one piece. Scales with both of the item's axes so
 * scrapping a deep drop is worth more than scrapping a starter piece \u2014 which
 * keeps the surplus a late dungeon produces meaningful instead of dwarfed by
 * the cost curve.
 */
function dismantleYield(def, level = 1) {
  const byRarity = { common: 3, uncommon: 7, rare: 16, epic: 34, ssr: 70 };
  return Math.max(1, Math.round((byRarity[def?.rarity] ?? 3) * gearLevelMult(level)));
}

/** An item's actual bonuses at a given level. */
function statsAtLevel(def, level = 1) {
  const mult = gearLevelMult(level);
  const scale = (obj) => Object.fromEntries(
    Object.entries(obj || {}).map(([k, v]) => [k, v * mult])
  );
  return { flat: scale(def.flat), pct: scale(def.pct) };
}

/**
 * save/index.js \u2014 Persistence layer.
 *
 * Owns the single mutable player-state object. Every other system reads and
 * mutates it through their own module APIs, then calls `persist()`.
 * Swapping localStorage for a server later means reimplementing only
 * `load()` / `persist()` \u2014 the state shape is the contract.
 */





// The key is deliberately NOT versioned: bumping it would orphan every save on
// every device. SCHEMA_VERSION plus migrate() handle format changes in place.
const STORAGE_KEY = 'dbz-rpg-prototype:v1';
const SCHEMA_VERSION = 9;

/** PLACEHOLDER: starting purse. */
const STARTING_ZENI = 800;

/** PLACEHOLDER: enough to train one ally a couple of levels and see how it works. */
const STARTING_SENZU = 3;

/** PLACEHOLDER: shards the player begins with, to show unlock progress. */
const STARTING_SHARDS = { piccolo: 4, gohan: 2, tien: 6 };

const listeners = new Set();

function emptyEquipped() {
  const e = {};
  for (const s of GEAR_SLOTS) e[s] = null;
  return e;
}

function defaultState() {
  const heroes = {};
  for (const def of Object.values(HEROES)) {
    heroes[def.id] = {
      owned: !!def.startsOwned,
      star: def.startsOwned ? (def.startStar ?? 1) : 0,
      // Only the protagonist carries progression of his own: lifetime XP,
      // from which his level is derived. Companions have no per-hero level \u2014
      // theirs comes from the slots below.
      xp: 0,
      equipped: emptyEquipped(),
    };
  }

  // The protagonist always leads; allies fill the remaining slots.
  const startingTeam = [HEROES[PROTAGONIST_ID], ...Object.values(HEROES)
    .filter((h) => h.startsOwned && !isProtagonist(h.id))]
    .slice(0, TEAM_SIZE)
    .map((h) => ({ heroId: h.id, row: h.preferredRow }));

  return {
    version: SCHEMA_VERSION,
    zeni: STARTING_ZENI,
    senzu: STARTING_SENZU,
    iron: 0,
    heroes,
    shards: { ...STARTING_SHARDS },
    gear: [],
    // One level per gear slot, bought with iron. Independent of each other and
    // of whatever item is in the slot.
    gearSlotLevels: Object.fromEntries(GEAR_SLOTS.map((s) => [s, 0])),
    campaign: { cleared: {}, highestCleared: 0 },
    // Dungeon clears, keyed `${dungeonId}:${tier}` \u2014 see progression/dungeons.js.
    dungeons: { cleared: {} },
    team: startingTeam,
    // One level per companion slot. Every companion fights at the lowest.
    companionSlots: Array.from({ length: COMPANION_SLOTS }, () => ({ level: 1 })),
    stats: { battlesWon: 0, battlesLost: 0 },

/**
 * Merge a loaded save over a fresh default so heroes/gear/fields added after
 * the save was written appear with sane values instead of undefined.
