/** The sprite set for a hero or enemy, or null when it uses the placeholder. */
function spriteSet(id) {
  return (id && SETS[id]) || null;
}

function hasSprites(id) {
  return !!spriteSet(id);
}

/** Every image URL a sprite set references \u2014 used by the single-file build. */
function spriteUrls() {
  const urls = new Set();
  for (const set of Object.values(SETS)) {
    for (const f of Object.values(set.frames)) urls.add(f.src);
    urls.add(set.portrait.src);
    urls.add(set.bust.src);
  }
  // Deduped: two sets can share one drawing (the elite Saibaman is the plain
  // one under a filter), and the bundler would otherwise inline it twice.
  return [...urls];
}

/**
 * Bust markup for cards, portraits and the battle dock: the drawn art when a
 * hero has it, otherwise the CSS/SVG placeholder.
 * `art` is the placeholder descriptor from the hero definition.
 */
function bustHTML(id, art, bustSVG) {
  const set = spriteSet(id);
  if (!set) return bustSVG(art);
  const f = set.filter ? ` style="filter:${set.filter}"` : '';
  return `<img class="art-img bust" src="${set.bust.src}"${f} alt="" decoding="async">`;
}

/** Full-body markup for the hero-detail portrait stage. */
function portraitHTML(id, art, bustSVG) {
  const set = spriteSet(id);
  if (!set) return bustSVG(art);
  const f = set.filter ? ` style="filter:${set.filter}"` : '';
  return `<img class="art-img portrait" src="${set.portrait.src}"${f} alt="" decoding="async">`;
}

/* ===== src/ui/spriteAnimator.js ===== */
/**
 * ui/spriteAnimator.js \u2014 Plays a sprite clip on one unit's <img>.
 *
 * Clips are declared in ui/sprites.js. This only sequences frames and enforces
 * the interruption rules: a higher-priority clip cuts off a lower one (getting
 * hit interrupts a swing; dying interrupts everything), while an equal or lower
 * one is ignored until the current clip finishes.
 *
 * Timings are divided by the battle's speed multiplier so animations stay in
 * step with the simulation at x2 and x3.
 */

function createAnimator(set, img, { speed = () => 1, onBeam = null } = {}) {
  let timer = null;
  let current = null;       // name of the clip playing, null when idle
  let priority = -1;
  let idleFrame = 'idle';
  let alive = true;

  function show(name) {
    const frame = set.frames[name];
    if (!frame) return;
    img.src = frame.src;
    img.style.setProperty('--cx', frame.cx);
  }

  function toIdle() {
    current = null;
    priority = -1;
    show(idleFrame);
  }

  /** Swap the resting pose \u2014 used to show a badly hurt unit reeling. */
  function setIdleFrame(name) {
    if (!set.frames[name] || idleFrame === name) return;
    idleFrame = name;
    if (!current) show(name);
  }

  /**
   * Start a clip. Returns how long it will run in ms (0 if it was ignored),
   * so the caller can schedule what happens afterwards.
   */
  function play(name) {
    if (!alive) return 0;
    const anim = set.anims[name];
    if (!anim) return 0;
    if (current && anim.priority <= priority) return 0;

    clearTimeout(timer);
    current = name;
    priority = anim.priority;

    const div = Math.max(0.25, speed());
    let total = 0;
    let i = 0;

    const step = () => {
      if (i >= anim.clip.length) {
        // A held clip stays "current" so nothing \u2014 not the resting-pose swap,
        // not a later hit \u2014 can put a downed unit back on its feet.
        if (!anim.hold) toIdle();
        return;
      }
      const [frameName, ms] = anim.clip[i];
      show(frameName);
      if (onBeam && set.beamOnFrame && set.beamOnFrame[name] === i) {
        onBeam(ms / div);
      }
      i += 1;
      timer = setTimeout(step, ms / div);
    };

    for (const [, ms] of anim.clip) total += ms / div;
    step();
    return total;
  }

  function stop() {
    alive = false;
    clearTimeout(timer);
  }

  show(idleFrame);
  return { play, stop, setIdleFrame, playing: () => current };
}

/* ===== src/ui/gearCard.js ===== */
/**
 * ui/gearCard.js \u2014 The item card, shared by the hero screen and the Bag.
 *
 * One piece of gear, everything about it, and the things you can do to it.
 * It opens in two modes because the same item means different things in
 * different places:
 *
 *   SLOT mode  \u2014 reached by tapping a slot on the hero. The slot may be empty.
 *                Stats are shown already multiplied by the slot level, because
 *                that is what the hero actually receives. Actions: Replace,
 *                Enhance.
 *   ITEM mode  \u2014 reached by tapping a row in the Bag, for a piece that is not
 *                equipped. Stats are the item's own; the slot's level is shown
 *                as what it *would* add. Actions: Equip, Scrap.
 *
 * Locking lives in the header in both modes, which is the point of putting the
 * card behind Bag rows at all \u2014 before this, unequipped gear could not be
 * inspected, so there was nowhere to lock it.
 */









const STAT_LABEL = { atk: 'ATK', hp: 'HP', def: 'DEF', speed: 'SPD' };

/**
 * @param {object} opts
 *   slot       \u2014 open the card for this equipment slot (may be empty)
 *   uid        \u2014 open the card for this owned piece; if it happens to be
 *                equipped, the card falls back to slot mode for its slot
 *   onReplace  \u2014 called instead of the built-in equip when the player taps the
 *                first action button (the hero screen passes its gear picker)
 */
function openGearCard({ slot, uid, onReplace } = {}) {
  const heroId = PROTAGONIST_ID;

  // An equipped piece is always shown as its slot \u2014 "what am I wearing" is the
  // same question however you arrived at it.
  let mode = 'item';
  let openSlot = slot || null;
  if (!openSlot) {
    const inst = uid ? inventory.gearByUid(uid) : null;
    const def = inst && getGearDef(inst.defId);
    if (inst?.equippedBy && def) { openSlot = def.slot; }
  }
  if (openSlot) mode = 'slot';

  const cardHTML = () => {
    const hs = heroSave(heroId);
    const inst = mode === 'slot'
      ? (hs.equipped[openSlot] ? inventory.gearByUid(hs.equipped[openSlot]) : null)
      : inventory.gearByUid(uid);
    const def = inst ? getGearDef(inst.defId) : null;
    const slotId = openSlot || def?.slot;
    const meta = GEAR_SLOT_META[slotId] || { name: 'Gear', icon: '\ud83c\udf92' };
    const r = def
      ? rarityOf(def.rarity)
      : { color: 'var(--panel-line)', name: 'Empty' };
    const up = inventory.slotUpgradeInfo(slotId);
    // In slot mode the slot level is already in these numbers; in item mode it
    // is not, because the piece is not in the slot yet.
    const mult = mode === 'slot' ? gearSlotMult(up.level) : 1;

    const worth = (mode === 'slot' && def)
      ? powerOf(heroId) - powerOf(heroId, { equipped: { ...hs.equipped, [openSlot]: null } })
      : 0;

    const at = def ? statsAtLevel(def, inst.level) : { flat: {}, pct: {} };
    const mainRows = Object.entries(at.flat).filter(([, v]) => v)
      .map(([k, v]) => `<div class="gd-stat main"><span>${STAT_LABEL[k] || k}</span><b>+${fmt(Math.round(v * mult))}</b></div>`).join('');
    const addRows = Object.entries(at.pct).filter(([, v]) => v)
      .map(([k, v]) => `<div class="gd-stat"><span>${STAT_LABEL[k] || k}</span><b>+${(v * mult * 100).toFixed(1)}%</b></div>`).join('');

    const slotPct = (up.level * GEAR_SLOT_LEVEL_STEP * 100).toFixed(1);
    const slotRow = mode === 'slot'
      ? `<div class="gd-stat"><span>Slot level +${up.level}</span><b>+${slotPct}%</b></div>`
      : `<div class="gd-stat"><span>${meta.name} slot is +${up.level}</span><b>+${slotPct}% once equipped</b></div>`;

    const actions = mode === 'slot'
      ? `<button class="btn ghost small" data-action="replace">${def ? 'Replace' : 'Equip'}</button>
         <button class="btn ${up.canUpgrade ? 'primary' : 'ghost'} small ${up.canUpgrade ? '' : 'disabled'}"
                 data-action="enhance">Enhance \ud83d\udd29${fmt(up.cost)}</button>`
      : `<button class="btn primary small" data-action="equip">Equip</button>
         <button class="btn ghost small ${inst?.locked ? 'disabled' : ''}" data-action="scrap">
           Scrap \ud83d\udd29${inst ? fmt(inventory.dismantleCandidates({ excludeUpgrades: false })
             .find((c) => c.inst.uid === inst.uid)?.yield ?? 0) : 0}
         </button>`;

    return `
      <div class="gd-head" style="--gr:${r.color}">
        <span class="gd-name">${def ? def.name : meta.name}</span>
        ${mode === 'slot' ? `<span class="gd-plus">+${up.level}</span>` : ''}
        ${inst ? `<button class="gd-lock ${inst.locked ? 'on' : ''}" data-action="lock"
                    aria-label="${inst.locked ? 'Unlock' : 'Lock'}">${inst.locked ? '\ud83d\udd12' : '\ud83d\udd13'}</button>` : ''}
      </div>

      <div class="gd-band" style="--gr:${r.color}">
        <div class="gd-band-text">
          <div class="gd-slot">${meta.name}</div>
          <div class="gd-rarity">${def ? r.name : 'Empty'}</div>
          ${worth ? `<div class="gd-worth">\u26a1 ${fmt(worth)}</div>` : ''}
        </div>
        <div class="gd-art">${def ? def.icon : meta.icon}</div>
        ${def ? `<div class="gd-level">Level <b>${inst.level}</b></div>` : ''}
      </div>

      <div class="gd-stats">
        ${def ? mainRows : '<p class="note">Nothing equipped in this slot.</p>'}
        ${addRows ? `<div class="gd-sub">Additional Stats</div>${addRows}` : ''}
        <div class="gd-sub">Slot</div>
        ${slotRow}
        ${inst?.locked ? '<p class="note lock-note">\ud83d\udd12 Locked \u2014 this piece will not be offered for scrapping.</p>' : ''}
      </div>

      <div class="gd-actions">${actions}</div>`;
  };

  const sheet = h('div', {
    // Centred rather than a bottom sheet: the picker is a list you scroll, this
    // is a single object you are looking at, and they should not feel alike.
    class: 'sheet-backdrop centred',
    html: `<div class="sheet gear-detail">${cardHTML()}</div>`,
  });
  const redraw = () => { sheet.querySelector('.gear-detail').innerHTML = cardHTML(); };

  let armedScrap = false;
  onAction(sheet, {
    lock: () => {
      const target = mode === 'slot' ? heroSave(heroId).equipped[openSlot] : uid;
      inventory.toggleGearLock(target);
      armedScrap = false;
      redraw();
      refresh();
    },
    replace: () => { sheet.remove(); onReplace?.(); },
    // Enhancing is a repeated action, so the card updates in place: the +N, the
    // stat rows and the power figure all move together on each tap.
    enhance: () => {
      if (inventory.upgradeGearSlot(openSlot)) { redraw(); refresh(); }
      else toast('Not enough iron. Scrap spare gear in the Bag.', 'warn');
    },
    equip: () => {
      inventory.equipGear(heroId, uid);
      sheet.remove();
      refresh();
      openGearCard({ uid, onReplace });
    },
    // Two taps: scrapping is destructive and there is no undo.
    scrap: (el) => {
      if (!armedScrap) {
        armedScrap = true;
        el.classList.add('danger');
        el.textContent = 'Scrap for good?';
        return;
      }
      const gained = inventory.dismantleGear(uid);
      sheet.remove();
      if (gained) toast(`Scrapped for ${gained} iron.`, 'good');
      else toast('Locked gear cannot be scrapped.', 'warn');
      refresh();
    },
  });
  sheet.addEventListener('click', (ev) => { if (ev.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);
  return sheet;
}

function render(host) {

    }));

    if (!available) continue;

    const list = h('div', { class: 'tier-list' });
    for (const t of tiers) {
      const { meta, def, cleared, locked, underpowered, enemies } = t;
      const previews = enemies.map((e) => {
        const r = rarityOf(e.rarity);
        return `<span class="enemy-chip" style="--rc:${r.color}">${bustHTML(e.defId, e.art, bustSVG)}</span>`;
      }).join('');

      const statusClass = locked ? 'locked' : cleared ? 'cleared' : underpowered ? 'risky' : 'ready';

      list.appendChild(h('div', {
        class: `tier-card ${statusClass} ${meta.bonus ? 'bonus' : ''}`,
        style: { '--tier': meta.color, '--tier-glow': meta.glow },
        html: `
          <div class="tc-rank">${meta.short}</div>
          <div class="tc-body">
            <div class="tc-name">
              ${meta.name}${meta.bonus ? '<span class="bonus-tag">BONUS</span>' : ''}
              ${cleared ? '<span class="tick">\u2713</span>' : ''}
            </div>
            <div class="tc-line">
              <span class="enemy-row">${previews}</span>
              <span class="tc-boss">${def.title}</span>
            </div>
            <div class="tc-drops">${dropLine(def.drops)}</div>
            <div class="stage-meta">
              <span class="gate ${underpowered ? 'warn' : 'ok'}">\u26a1 ${fmt(def.requiredPower)}</span>
              <span class="tc-zeni">\ud83d\udcb0 ${fmt(def.zeni)}</span>
            </div>
          </div>
          <div class="stage-action">
            ${locked
              ? '<span class="lock">\ud83d\udd12</span>'
              : `<button class="btn ${underpowered ? 'warn' : 'primary'} small"
                         data-action="run" data-tier="${t.tier}" data-dungeon="${dungeon.id}">
                   ${cleared ? 'Run' : 'Enter'}
                 </button>`}
          </div>`,
      }));
    }
    host.appendChild(list);
  }

  host.appendChild(h('p', {
    class: 'note',
    text: 'Dungeons drop gear and zeni only \u2014 no XP, no beans, no shards. Clear a '
        + 'difficulty to open the next one. Run them as often as you like.',
  }));

  onAction(host, {
    run: (el) => navigate('formation', {
      ref: dungeonRef(el.dataset.dungeon, el.dataset.tier),
    }),
  });
}

/**
 * The reason to pick this tier over the one below, in one line that must not
 * wrap on a 390px card: how many pieces, at what LEVEL band, and which
 * rarities can drop with the expected one filled. The level band leads the
 * rarities because two tiers can share a rarity and differ only in level \u2014
 * that is the normal case on this ladder, not the exception. Exact drop
 * percentages were tried here and pushed the line onto three rows.
 */
function dropLine(drops) {
  if (!drops) return '';
  const weights = Object.entries(drops.weights || {}).filter(([, w]) => w > 0);
  if (!weights.length) return '';
  const modal = weights.reduce((best, e) => (e[1] > best[1] ? e : best))[0];
  const pips = weights
    .sort((a, b) => RARITY_ORDER.indexOf(a[0]) - RARITY_ORDER.indexOf(b[0]))
    .map(([id]) => {
      const r = rarityOf(id);
      return `<span class="drop-pip ${id === modal ? 'modal' : ''}" style="--rc:${r.color}">${r.name}</span>`;
    });
  const band = drops.level
    ? `<span class="drop-lv">Lv.${drops.level[0]}\u2013${drops.level[1]}</span>`
    : '';
  return `<span class="drop-count">${drops.rolls}\u00d7 gear</span>${band}${pips.join('')}`;
}
return { render };
})();

}

/* ---------------- Dismantle ---------------- */

function renderDismantle(body) {
  const candidates = inventory.dismantleCandidates({ excludeUpgrades });
  const open = candidates.filter((c) => !c.blocked);
  const openUids = new Set(open.map((c) => c.inst.uid));

  // A piece can stop being selectable while it is selected \u2014 the exclude
  // toggle flips, or it gets locked \u2014 so the set is pruned every render rather
  // than trusted.
  for (const uid of [...selected]) if (!openUids.has(uid)) selected.delete(uid);

  const ironTotal = open.filter((c) => selected.has(c.inst.uid))
    .reduce((sum, c) => sum + c.yield, 0);

  const grid = h('div', { class: 'scrap-grid' });
  for (const c of sortGear(candidates.map((x) => x.inst))) {
    const entry = candidates.find((x) => x.inst.uid === c.uid);
    const def = getGearDef(c.defId);
    const r = rarityOf(def.rarity);
    const on = selected.has(c.uid);
    grid.appendChild(h('button', {
      class: `scrap-tile ${on ? 'on' : ''} ${entry.blocked ? `blocked ${entry.blocked}` : ''}`,
      style: { '--gr': r.color },
      dataset: { action: entry.blocked ? 'blocked' : 'pick', uid: c.uid, why: entry.blocked || '' },
      html: `
        <span class="st-check">${on ? '\u2713' : ''}</span>
        <span class="st-art">${def.icon}</span>
        <span class="st-lv">${c.level}</span>
        ${entry.blocked === 'locked' ? '<span class="st-flag">\ud83d\udd12</span>' : ''}
        ${entry.blocked === 'best' ? '<span class="st-flag">\u25b2</span>' : ''}`,
    }));
  }

  body.appendChild(h('div', {
    class: 'scrap-head',
    html: `<span class="sh-count">Selected: <b>${selected.size}</b>/${open.length}</span>
           <button class="sh-toggle ${excludeUpgrades ? 'on' : ''}" data-action="toggle-exclude">
             <span class="sh-box">${excludeUpgrades ? '\u2713' : ''}</span> Keep best per slot
           </button>`,
  }));

  body.appendChild(grid);

  if (!candidates.length) {
    body.appendChild(h('p', { class: 'note', text: 'Nothing spare to scrap \u2014 everything you own is equipped.' }));
  }

  // One tap per rarity is the fast path for clearing junk. Tapping a rarity
  // that is already fully selected clears it again, so the button is a toggle
  // rather than a one-way action.
  const present = RARITY_ORDER.filter((id) => open.some((c) => getGearDef(c.inst.defId).rarity === id));
  if (present.length) {
    body.appendChild(h('div', {
      class: 'scrap-rarities',
      html: present.map((id) => {
        const r = rarityOf(id);
        const ofRarity = open.filter((c) => getGearDef(c.inst.defId).rarity === id);
        const all = ofRarity.every((c) => selected.has(c.inst.uid));
        return `<button class="rarity-pick ${all ? 'on' : ''}" style="--rc:${r.color}"
                        data-action="pick-rarity" data-rarity="${id}">
                  <span class="rp-dot"></span>${r.name} <small>${ofRarity.length}</small>
                </button>`;
      }).join(''),
    }));
  }

  body.appendChild(h('div', {
    class: 'scrap-actions',
    html: `<button class="btn ${selected.size ? 'primary' : 'ghost'} wide ${selected.size ? '' : 'disabled'}"
                   data-action="dismantle">
             Dismantle ${selected.size || ''} ${selected.size ? `\u00b7 \ud83d\udd29 ${fmt(ironTotal)}` : ''}
           </button>`,
  }));

  body.appendChild(h('p', {
    class: 'note',
    text: excludeUpgrades
      ? 'Your best piece for each slot (\u25b2) and anything locked (\ud83d\udd12) is held back. Tap a piece in the Gear tab to lock it.'
      : 'Nothing is held back except locked pieces (\ud83d\udd12). Check what you are selecting.',
  }));

  let armed = false;
  onAction(body, {
    pick: (el) => {
      const uid = el.dataset.uid;
      if (selected.has(uid)) selected.delete(uid); else selected.add(uid);
      armed = false;
      refresh();
    },
    blocked: (el) => toast(el.dataset.why === 'locked'
      ? 'That piece is locked.'
      : 'That is the best one you own for its slot.', 'warn'),
    'toggle-exclude': () => { excludeUpgrades = !excludeUpgrades; armed = false; refresh(); },
    'pick-rarity': (el) => {
      const ofRarity = open.filter((c) => getGearDef(c.inst.defId).rarity === el.dataset.rarity);
      const all = ofRarity.every((c) => selected.has(c.inst.uid));
      for (const c of ofRarity) {
        if (all) selected.delete(c.inst.uid); else selected.add(c.inst.uid);
      }
      armed = false;
      refresh();
    },
    // Two taps, because this destroys several pieces at once and there is no
    // undo. The count and the iron are in the label both times.
    dismantle: (el) => {
      if (!armed) {
        armed = true;
        el.classList.add('danger');
        el.textContent = `Scrap ${selected.size} for good?`;
        return;
      }
      const { iron, count } = inventory.dismantleMany([...selected]);
      selected.clear();
      toast(`Scrapped ${count} for ${iron} iron.`, 'good');
      refresh();
    },
  });
}
return { render };
})();

        <div class="stat"><span class="sn">\u2764\ufe0f HP</span><span class="sv">${fmt(stats.hp)}</span></div>

/* ---------------- Gear picker sheet ---------------- */

/** Tapping a slot lands on the item card; Replace is what reaches the picker. */
function openSlotCard(slot) {
  openGearCard({ slot, onReplace: () => openGearSheet(slot) });
}

function openGearSheet(slot) {
  const heroId = PROTAGONIST_ID;
  const hs = heroSave(heroId);
  const equippedUid = hs.equipped[slot];
  const options = inventory.availableGearForSlot(slot);

  const rows = sortGear(options).map((inst) => {
    const gdef = getGearDef(inst.defId);
    const r = rarityOf(gdef.rarity);
    return `<button class="gear-row" data-action="equip" data-uid="${inst.uid}" style="--gr:${r.color}">
        <span class="gi">${gdef.icon}</span>
        <span class="gt">
          <b>${gdef.name} <span class="glv">Lv.${inst.level}</span></b>
          <small>${describeGear(gdef, inst.level)}</small>

  const sheet = h('div', {

        <div class="gear-rows">${rows || '<p class="note">No spare gear for this slot. Dungeons are where gear comes from.</p>'}</div>
        <button class="btn ghost wide" data-action="close">Back</button>
      </div>`,
  });

  onAction(sheet, {
    equip: (el) => {
      inventory.equipGear(heroId, el.dataset.uid);
      sheet.remove();
      refresh();
      openSlotCard(slot);
    },
    unequip: () => {
      inventory.unequipGear(heroId, slot);
      sheet.remove();
      refresh();
      openSlotCard(slot);
    },
    // Closing the picker returns to the item card it was opened from, rather
    // than dumping the player back on the hero screen mid-decision.
    close: () => { sheet.remove(); openSlotCard(slot); },

  sheet.addEventListener('click', (ev) => { if (ev.target === sheet) sheet.remove(); });

  document.body.appendChild(sheet);
}
return { render };
})();

const __screen_formation = (() => {
/**
 * ui/screens/formation.js \u2014 Pre-battle confirmation: pick 3 heroes and put
 * each in the front or back row, then start the auto-battle.
 *
 * Front row soaks single-target basic attacks; the back row is protected
 * until the front row is down (see battle/targeting.js for the exact rule).

function render(host, { ref }) {
  const state = getState();
  // No ref means "just edit the team" \u2014 reached from the Campaign banner.
  const info = ref ? encounterInfo(ref) : null;
  const power = teamPower();

  if (info) {

          }).join('')}

    const inRow = state.team.filter((s) => s && s.row === rowName);
    for (const slot of inRow) {

      const hsv = state.heroes[slot.heroId];
      const r = rarityOf(def.rarity);
      const lead = isProtagonist(slot.heroId);

            ? `<div class="fu-art">${bustHTML(slot.heroId, def.art, bustSVG)}</div>`
            : `<button class="fu-art" data-action="swap" data-hero="${slot.heroId}">${bustHTML(slot.heroId, def.art, bustSVG)}</button>`}
          <div class="fu-name">${def.name}</div>
          <div class="fu-sub">Lv.${levelOf(slot.heroId)} \u26a1${fmt(powerOf(slot.heroId))}</div>
          <div class="fu-stars">${starRow(hsv.star)}</div>
          <button class="btn ghost tiny" data-action="toggle-row" data-hero="${slot.heroId}">

          </button>`,
      }));

    if (rowName === 'front' && state.team.length < TEAM_SIZE) {

      persist();

    swap: (el) => openHeroPicker(el.dataset.hero),

/** Pick a hero for a slot; `replacingHeroId` null means "add a new slot". */
function openHeroPicker(replacingHeroId) {
  const state = getState();
  const inTeam = new Set(state.team.map((s) => s.heroId));
  // Allies only \u2014 the protagonist holds his slot and is not offered here.
  const candidates = allyEntries().filter((e) => e.owned && (!inTeam.has(e.id) || e.id === replacingHeroId));

  const sheet = h('div', {
    class: 'sheet-backdrop',
    html: `
      <div class="sheet">
        <div class="sheet-title">${replacingHeroId ? 'Swap ally' : 'Add ally'}</div>
        <div class="pick-grid">
          ${candidates.map((e) => `
            <button class="hero-card small ${e.id === replacingHeroId ? 'current' : ''}"
                    style="--rarity:${e.rarity.color};--glow:${e.rarity.glow}"
                    data-action="pick" data-hero="${e.id}">
              <span class="rarity-tag">${e.rarity.short}</span>
              <span class="card-art">${bustHTML(e.id, e.def.art, bustSVG)}</span>
              <span class="card-name">${e.def.name}</span>
              <span class="card-sub">\u26a1${fmt(e.power)}</span>
            </button>`).join('') || '<p class="note">No other allies available.</p>'}
        </div>
        ${replacingHeroId ? '<button class="btn ghost wide" data-action="remove">Remove from team</button>' : ''}
        <button class="btn ghost wide" data-action="close">Close</button>
      </div>`,
  });

  onAction(sheet, {
    pick: (el) => {
      const heroId = el.dataset.hero;
      const def = getHeroDef(heroId);
      if (replacingHeroId) {
        const slot = state.team.find((s) => s.heroId === replacingHeroId);
        if (slot) slot.heroId = heroId;
      } else if (state.team.length < TEAM_SIZE) {
        state.team.push({ heroId, row: def.preferredRow });
      }
      state.team = enforceProtagonist(state.team);
      persist();
      sheet.remove();
      refresh();
    },
    remove: () => {
      state.team = enforceProtagonist(state.team.filter((s) => s.heroId !== replacingHeroId));
      persist();
      sheet.remove();
      refresh();
    },
    close: () => sheet.remove(),
  });
  sheet.addEventListener('click', (ev) => { if (ev.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);
}
return { render };
})();

const __screen_battle = (() => {

 * ui/screens/battle.js \u2014 Turn-based battle presentation.

 * DOM; this file drives it one turn at a time and draws what it emits.
 *
 * The loop is deliberately not a frame loop. It asks the engine to open a
 * turn, plays that turn's events with enough delay to read them, and then
 * either waits for the player to choose (their hero's turn, auto off) or lets
 * the AI choose and carries on. Nothing here runs on requestAnimationFrame,
 * so a fight cannot drift out of step with the simulation.
 *
 * Three things carry the readability:
 *   - the TURN ORDER strip, so "who acts next" is never a guess
 *   - a CHARGING marker on the caster and everyone it is aimed at, so a heavy
 *     hit is a problem you have a turn to answer
 *   - the ACTION BAR, which only ever shows what the engine says is legal
 */










let battle = null;
let nodes = new Map();
let speed = 1;
let finished = false;
let timers = [];
let selectedTarget = null;
let els = {};

/**
 * Which sprite set a unit draws from. Heroes carry a heroId, enemies a defId,
 * and either can have drawn art or fall back to the CSS placeholder.
 */
function artId(unit) {

/** Per-set drawing corrections: relative size, and a recolour for variants. */
function artStyle(set) {

  if (set.filter) bits.push(`filter:${set.filter}`);
  if (set.scale) bits.push(`--sprite-scale:${set.scale}`);

/** Base beats, in ms at x1. Everything else is derived from these. */
const PACE = { open: 140, act: 620, big: 900, death: 480, cutIn: 1150 };

 * world holds for a few frames before the damage number flies, which is what
 * makes a hit land rather than merely happen. Scaled by how big the hit was.
 */
function hitStopMs(fraction) {

  if (fraction >= 0.08) return 100;

function wait(ms, fn) {

function dispose() {

/* ---------------- the turn loop ---------------- */

function step(ref) {
  if (!battle) return;
  if (battle.state !== 'running') return endBattle(ref);

  if (battle.pending) {
    if (battle.awaitingInput()) { showActions(ref); return; }
    // AI turn (an enemy, or one of yours under auto-battle). The bar says who
    // is acting rather than going blank \u2014 the space is reserved either way.
    showActing(battle.unitById(battle.pending.uid));
    wait(PACE.open, () => {
      if (!battle || battle.state !== 'running') return endBattle(ref);
      battle.takeAiTurn();
      playEvents(battle.events, () => step(ref));
    });
    return;
  }

  const events = battle.advance();
  playEvents(events, () => step(ref), PACE.open);
}

/**
 * Draw a turn's events, then continue. Everything lands at once in the
 * simulation; the pacing here is purely so a person can read it.
 *
 * An ultimate or a boss phase is split into two beats: the announce plays
 * alone with the screen to itself, and only when the cut-in clears does the
 * damage land. Rendering them together is what made a finisher read as one
 * more number a moment ago.
 */
function playEvents(events, done, lead = 0) {
  const cut = events.findIndex((e) => e.t === 'phase'
    || (e.t === 'skill' && e.slot === 'ultimate')
    || (e.t === 'release' && e.slot === 'ultimate'));

  if (cut >= 0 && !lead) {
    for (const ev of events.slice(0, cut + 1)) handleEvent(ev);
    paintAll();
    const ms = playCutIn(events[cut]);
    wait(ms, () => {
      for (const ev of events.slice(cut + 1)) handleEvent(ev);
      paintAll();
      settle(events, done);
    });
    return;
  }

  for (const ev of events) handleEvent(ev);
  paintAll();
  if (lead) { wait(lead, done); return; }
  settle(events, done);
}

/** Hold on the impact, then carry on. */
function settle(events, done) {
  const hit = events.filter((e) => e.t === 'damage' && !e.self);
  const died = events.some((e) => e.t === 'death');
  const ended = events.some((e) => e.t === 'end');

  let stop = 0;
  if (hit.length) {
    const worst = Math.max(...hit.map((e) => {
      const u = battle.unitById(e.uid);
      return u ? e.amount / u.maxHp : 0;
    }));
    stop = hitStopMs(worst);
    shake(worst);
    const screen = document.querySelector('.battle-screen');
    screen?.classList.add('hitstop');
    wait(stop, () => screen?.classList.remove('hitstop'));
  }

  const beat = stop + PACE.act + (died ? PACE.death : 0);
  wait(ended ? PACE.big : beat, done);
}

/* ---------------- player input ---------------- */

function clearActions() {
  if (els.actions) clear(els.actions);
  for (const n of nodes.values()) n.root.classList.remove('acting');
  selectedTarget = null;
  paintTargets();
}

function showActing(unit) {
  if (!els.actions || !unit) return;
  clear(els.actions);
  for (const n of nodes.values()) n.root.classList.toggle('acting', n.unit.uid === unit.uid);
  els.actions.appendChild(h('div', {
    class: 'ab-who waiting',
    text: unit.side === 'player' ? `${unit.name} \u2014 auto` : `${unit.name} acts`,
  }));
}

function showActions(ref) {
  const uid = battle.pending?.uid;
  const unit = battle.unitById(uid);
  if (!unit) return;

  for (const n of nodes.values()) n.root.classList.toggle('acting', n.unit.uid === uid);
  clear(els.actions);

  const label = h('div', { class: 'ab-who', text: `${unit.name}'s turn` });
  els.actions.appendChild(label);

  const row = h('div', { class: 'ab-row' });
  for (const action of battle.actions(uid)) {
    const sub = action.id === 'technique' && !action.ready ? `${action.cooldown} turn${action.cooldown === 1 ? '' : 's'}`
      : action.id === 'ultimate' && !action.ready ? `${Math.floor((action.charge / action.chargeMax) * 100)}%`
      : '';
    const btn = h('button', {
      class: `ab-btn ${action.id} ${action.ready ? '' : 'disabled'}`,
      html: `<span class="ab-ico">${action.skill.icon || '\u2022'}</span>
             <span class="ab-name">${action.skill.name}</span>
             ${sub ? `<span class="ab-sub">${sub}</span>` : ''}`,
    });
    if (action.ready) {
      btn.addEventListener('click', () => {
        if (!battle.awaitingInput()) return;
        clearActions();
        battle.act(action.id, selectedTarget);
        playEvents(battle.events, () => step(ref));
      });
    }
    row.appendChild(btn);
  }
  els.actions.appendChild(row);
  paintTargets();
}

/* ---------------- events -> DOM ---------------- */

function handleEvent(ev) {
  const n = nodes.get(ev.uid);
  switch (ev.t) {
    case 'turnStart':
      break;

    case 'damage': {
      if (!n) return;
      const unit = battle.unitById(ev.uid);
      const frac = unit ? ev.amount / unit.maxHp : 0;
      const heavy = ev.crit || frac > 0.12;
      floater(n.fx, `-${fmt(ev.amount)}`, ev.crit ? 'crit' : (ev.self ? 'self' : 'dmg'), heavy);
      if (ev.guarded) floater(n.fx, 'GUARD', 'guard');
      if (!ev.self) impact(n, heavy);
      pulse(n.art, 'hit');
      if (n.animator && !ev.self && unit?.alive) {
        n.animator.play(heavy ? 'hit_heavy' : 'hit');
      }
      break;
    }

    case 'heal':
      if (n) floater(n.fx, `+${fmt(ev.amount)}`, 'heal');
      break;

    case 'guard':
      if (n) { callout(n.callout, `${ev.icon} ${ev.name}`, 'guard'); n.root.classList.add('guarding'); }
      break;

    case 'skill': {
      if (!n) break;
      if (ev.slot !== 'ultimate') callout(n.callout, `${ev.icon || ''} ${ev.name}`, ev.slot);
      n.root.classList.remove('guarding');
      if (n.animator) {
        if (ev.slot === 'attack') n.animator.play(n.swings++ % 2 ? 'attack_alt' : 'attack');
        else if (ev.slot === 'technique' || ev.slot === 'ultimate') n.animator.play(ev.slot);
      }
      // Melee crosses the gap; anything with reach plants and fires.
      const melee = ev.slot === 'attack' && n.unit.engages;
      const first = (ev.targets || [])[0];
      if (first) lunge(ev.uid, first, melee ? 'attack' : 'cast');
      break;
    }

    // Announced now, lands at the start of this unit's next turn. Both the
    // caster and everyone in the blast are marked until it goes off.
    case 'charge': {
      if (n) {
        n.root.classList.add('charging');
        callout(n.callout, `${ev.icon || ''} ${ev.name}`, 'charge');
      }
      for (const uid of ev.targets || []) nodes.get(uid)?.root.classList.add('threatened');
      break;
    }

    case 'release': {
      if (n) {
        n.root.classList.remove('charging');
        n.animator?.play('ultimate');
      }
      for (const other of nodes.values()) other.root.classList.remove('threatened');
      break;
    }

    // The cut-in names the move in 30px display type, so the callout pill and
    // the old centre banner would be the same words three times over.
    case 'phase':
      if (n) n.root.classList.add('phased');
      break;

    case 'passive':
      if (n) callout(n.callout, `${ev.icon || ''} ${ev.name}`, 'passive');
      break;

    case 'buff':
      if (n) floater(n.fx, `${ev.stat.toUpperCase()} \u25b2`, 'buff');
      break;

    case 'debuff':
      if (n) floater(n.fx, `${ev.stat.toUpperCase()} \u25bc`, 'debuff');
      break;

    case 'death':
      if (!n) break;
      n.root.classList.remove('charging', 'threatened', 'guarding');
      if (n.animator) {
        const ms = n.animator.play('defeat');
        n.root.classList.add('dying');
        wait(ms * speed, () => n.root.classList.add('dead'));
      } else {
        n.root.classList.add('dead');
      }
      break;

    default:
      break;
  }
}

/* ---------------- painting ---------------- */

function paintAll() {
  if (!battle) return;
  if (els.turn) els.turn.textContent = `T${battle.turn}`;

  for (const unit of battle.units) {
    const n = nodes.get(unit.uid);
    if (!n) continue;
    const pct = Math.max(0, unit.hp / unit.maxHp) * 100;
    n.fill.style.width = `${pct}%`;
    n.fill.classList.toggle('low', pct < 30);
    n.root.classList.toggle('guarding', !!unit.guarding && unit.alive);
    if (unit.alive) n.animator?.setIdleFrame(pct < 25 ? 'heavy_stun' : 'idle');

    if (!n.dock) continue;
    n.dockHp.style.width = `${pct}%`;
    n.dock.classList.toggle('down', !unit.alive);
    const chargePct = unit.skills.ultimate ? unit.ultimateCharge : 0;
    n.dockUlt.style.width = `${Math.min(100, chargePct)}%`;
    n.dock.classList.toggle('ult-ready', !!unit.ultimateReady && unit.alive);
  }
  paintOrder();
  paintTargets();
}

/** The next several turns, soonest first. */
function paintOrder() {
  if (!els.order) return;
  clear(els.order);
  const upcoming = battle.preview(7);
  upcoming.forEach((uid, i) => {
    const unit = battle.unitById(uid);
    if (!unit) return;
    const r = rarityOf(unit.rarity);
    els.order.appendChild(h('div', {
      class: `to-pip ${unit.side} ${i === 0 ? 'now' : ''}`,
      style: { '--rarity': r.color },
      html: `<span class="to-art">${bustHTML(artId(unit), unit.art, bustSVG)}</span>
             ${unit.charging ? '<span class="to-flag">\u26a0</span>' : ''}`,
    }));
  });
}

/** Which enemy the next action will hit. */
function paintTargets() {
  const picking = !!battle && battle.awaitingInput();
  for (const n of nodes.values()) {
    const selectable = picking && n.unit.side === 'enemy' && n.unit.alive;
    n.root.classList.toggle('selectable', selectable);
    n.root.classList.toggle('selected', selectable && n.unit.uid === selectedTarget);
  }
}

/* ---------------- impact ---------------- */

/**
 * The attacker crosses the gap and comes back. Anticipation, contact,
 * follow-through \u2014 standing still and emitting a number is what made every
 * hit read the same weight regardless of what it was.
 */
function lunge(attacker, targetUid, kind = 'attack') {
  const a = nodes.get(attacker);
  const t = nodes.get(targetUid);
  if (!a || !t) return;
  const ab = a.root.getBoundingClientRect();
  const tb = t.root.getBoundingClientRect();
  // Stop short of the target rather than standing inside it.
  const gap = a.unit.side === 'player' ? -58 : 58;
  const dx = Math.round((tb.left + tb.width / 2) - (ab.left + ab.width / 2) + gap);
  const dy = Math.round((tb.top + tb.height / 2) - (ab.top + ab.height / 2));
  a.root.style.setProperty('--lunge-x', `${dx}px`);
  a.root.style.setProperty('--lunge-y', `${dy}px`);
  a.root.style.setProperty('--lunge-ms', `${Math.round(520 / speed)}ms`);
  a.root.classList.remove('lunging', 'stepping');
  void a.root.offsetWidth;
  a.root.classList.add(kind === 'attack' ? 'lunging' : 'stepping');
  wait(560, () => a.root.classList.remove('lunging', 'stepping'));
}

/** Screen shake, scaled by how much of the target's health went. */
function shake(fraction) {
  const screen = document.querySelector('.battle-screen');
  if (!screen) return;
  const cls = fraction >= 0.18 ? 'shake-lg' : fraction >= 0.07 ? 'shake-md' : 'shake-sm';
  screen.classList.remove('shake-sm', 'shake-md', 'shake-lg');
  void screen.offsetWidth;
  screen.classList.add(cls);
  wait(420, () => screen.classList.remove(cls));
}

/** White flash and an expanding ring at the point of contact. */
function impact(node, big) {
  const fx = h('span', { class: `impact ${big ? 'big' : ''}` });
  node.fx.appendChild(fx);
  setTimeout(() => fx.remove(), 500);
  node.art.classList.remove('flashed');
  void node.art.offsetWidth;
  node.art.classList.add('flashed');
}

/**
 * The cut-in: the screen darkens, speed lines rake across it, the caster's
 * portrait slides in and the move is named. This is the whole reason an
 * ultimate is worth saving a turn for, and a boss turning gets the same
 * treatment because it is the same kind of moment.
 * Returns how long to hold before the damage lands.
 */
function playCutIn(ev) {
  const screen = document.querySelector('.battle-screen');
  const unit = battle.unitById(ev.uid);
  if (!screen || !unit) return PACE.big;

  const r = rarityOf(unit.rarity);
  const phase = ev.t === 'phase';
  const node = h('div', {
    class: `cut-in ${unit.side} ${phase ? 'phase' : ''}`,
    style: { '--rarity': r.color, '--aura': unit.art?.aura || r.color },
    html: `
      <div class="ci-lines"></div>
      <div class="ci-body">
        <div class="ci-portrait">${bustHTML(artId(unit), unit.art, bustSVG)}</div>
        <div class="ci-text">
          <div class="ci-who">${unit.name}</div>
          <div class="ci-move">${ev.name}</div>
        </div>
      </div>`,
  });
  node.style.setProperty('--cut-ms', `${Math.round(PACE.cutIn / speed)}ms`);
  screen.appendChild(node);
  const ms = PACE.cutIn / speed;
  setTimeout(() => node.remove(), ms + 120);

  // The caster keeps the light while everything else is held down.
  screen.classList.add('cinematic');
  wait(PACE.cutIn, () => screen.classList.remove('cinematic'));
  for (const n of nodes.values()) n.root.classList.toggle('spotlit', n.unit.uid === ev.uid);
  wait(PACE.cutIn, () => { for (const n of nodes.values()) n.root.classList.remove('spotlit'); });

  return PACE.cutIn;
}

/* ---------------- fx helpers ---------------- */

function fireBeam(beam, node, unit, ms) {
  const target = battle.units.find((u) => u.side !== unit.side && u.alive);
  const tn = target && nodes.get(target.uid);
  let len = 150;
  if (tn) {
    const a = node.getBoundingClientRect();
    const b = tn.root.getBoundingClientRect();
    len = Math.max(60, Math.abs((b.left + b.width / 2) - (a.left + a.width / 2)) - 30);
  }
  beam.style.setProperty('--beam-len', `${Math.round(len)}px`);
  beam.style.setProperty('--beam-ms', `${Math.round(ms)}ms`);
  beam.classList.remove('fire');
  void beam.offsetWidth;
  beam.classList.add('fire');
}

/**
 * Numbers scatter so simultaneous hits stay readable, but they scatter INWARD:
 * a big crit on the rightmost enemy used to run off the side of the phone.
 */
function floater(host, text, kind, heavy = false) {
  const node = h('span', { class: `float ${kind} ${heavy ? 'heavy' : ''}`, text });
  const unit = host.closest('.unit');
  const bias = unit?.classList.contains('enemy') ? -30 : 24;
  node.style.setProperty('--dx', `${(bias + Math.random() * 30 - 15).toFixed(0)}px`);
  node.style.setProperty('--dy', `${(Math.random() * 26 - 8).toFixed(0)}px`);
  host.appendChild(node);
  setTimeout(() => node.remove(), 1100);
}

function callout(host, text, kind) {
  host.textContent = text;
  host.className = `u-callout show ${kind}`;
  clearTimeout(host._t);
  host._t = setTimeout(() => { host.className = 'u-callout'; }, 1100);
}

function pulse(node, cls) {
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

/* ---------------- resolution ---------------- */

function endBattle(ref) {
  if (finished) return;
  finished = true;
  clearActions();

  const won = battle.state === 'victory';
  const survivors = battle.units.filter((u) => u.side === 'player' && u.alive).length;
  const turns = battle.turn;

  const rewards = won ? completeEncounter(ref) : (recordDefeat(), null);

  wait(700, () => {
    navigate('results', { ref, won, survivors, turns, rewards });
  });
}
return { dispose, render };
})();

/* ===== src/ui/screens/results.js ===== */
const __screen_results = (() => {
/**
 * ui/screens/results.js \u2014 Post-battle summary and reward payout display.
 */









function render(host, { ref, won, survivors, turns, rewards }) {
  const info = encounterInfo(ref);

  const rewardRows = [];
  if (rewards) {
    if (rewards.xp) {
      rewardRows.push(`<div class="reward"><span class="ri">\u2728</span><span>${fmt(rewards.xp)} XP</span></div>`);
    }
    for (const up of rewards.levels || []) {
      const def = getHeroDef(up.heroId);
      rewardRows.push(`<div class="reward level-up">
          <span class="ri">\u2b06\ufe0f</span>
          <span>${def.name} reached <b>Lv.${up.to}</b></span>
        </div>`);
    }
    if (rewards.senzu) {
      rewardRows.push(`<div class="reward"><span class="ri">\ud83e\uded8</span><span>Senzu Bean \u00d7${rewards.senzu}</span></div>`);
    }
    if (rewards.zeni) rewardRows.push(`<div class="reward"><span class="ri">\ud83d\udcb0</span><span>${fmt(rewards.zeni)} Zeni</span></div>`);
    for (const s of rewards.shards) {
      const def = getHeroDef(s.heroId);
      rewardRows.push(`<div class="reward"><span class="ri shard">${bustHTML(s.heroId, def.art, bustSVG)}</span><span>${def.name} Shard \u00d7${s.amount}</span></div>`);
    }
    for (const g of rewards.gear) {
      const r = rarityOf(g.rarity);
      rewardRows.push(`<div class="reward">
          <span class="ri" style="color:${r.color}">${g.icon}</span>
          <span>${g.name} <span class="glv" style="color:${r.color}">Lv.${g.level}</span></span>
        </div>`);
    }
  }

  // What to offer next depends on where the fight came from: the story moves
  // you forward, a dungeon offers the difficulty you just unlocked.
  const follow = won ? nextEncounter(ref) : null;
  const home = ref?.kind === 'dungeon'
    ? { screen: 'dungeons', label: 'Dungeons' }
    : { screen: 'campaign', label: 'Campaign' };

  host.appendChild(h('div', {
    class: `results ${won ? 'win' : 'lose'}`,
    html: `
      <div class="res-banner">${won ? 'VICTORY' : 'DEFEAT'}</div>
      <div class="res-stage">${info ? info.title : ''}</div>
      <div class="res-line">${turns} turn${turns === 1 ? '' : 's'} \u00b7 ${survivors} hero${survivors === 1 ? '' : 'es'} standing</div>
      ${rewards?.firstClear ? '<div class="first-clear">First Clear Bonus!</div>' : ''}
      ${rewards?.unlocked ? `<div class="first-clear unlock">${rewards.unlocked} Unlocked!</div>` : ''}
      <div class="reward-list">
        ${won ? (rewardRows.join('') || '<p class="note">No drops this time.</p>')
              : '<p class="note">No rewards. Promote a hero, equip gear, or rethink your formation.</p>'}
      </div>
      <div class="res-actions">
        ${follow
          ? `<button class="btn primary wide" data-action="next">Next: ${follow.label}</button>`
          : `<button class="btn primary wide" data-action="retry">${won ? 'Fight Again' : 'Retry'}</button>`}
        <button class="btn ghost wide" data-action="roster">Manage Heroes</button>
        <button class="btn ghost wide" data-action="home">${home.label}</button>
      </div>`,
  }));

  onAction(host, {
    next: () => navigate('formation', { ref: follow.ref }, { replace: true }),
    retry: () => navigate('formation', { ref }, { replace: true }),
    roster: () => navigate('roster', {}, { replace: true }),
    home: () => navigate(home.screen, {}, { replace: true }),
  });
}

/**
 * The natural follow-up after a win. A story clear points at the next stage;
 * a dungeon clear points at the difficulty that clear just opened, and stops
 * offering one at Extreme.
 */
function nextEncounter(ref) {
  if (ref?.kind === 'dungeon') {
    const entry = dungeonList().find((d) => d.dungeon.id === ref.dungeonId);
    const idx = entry?.tiers.findIndex((t) => t.tier === ref.tier) ?? -1;
    const up = idx >= 0 ? entry.tiers[idx + 1] : null;
    return up
      ? { label: `${up.meta.name} \u2014 ${up.def.title}`, ref: dungeonRef(ref.dungeonId, up.tier) }
      : null;
  }
  const next = stageList().find((s) => !s.cleared && !s.locked);
  return next ? { label: next.stage.name, ref: stageRef(next.stage.id) } : null;
}
return { render };
})();

/* ===== src/ui/app.js ===== */
/**
 * ui/app.js \u2014 Screen router and app shell.
 *
 * Screens are plain modules exporting `render(container, params)` and an
 * optional `dispose()`. Adding a screen is a one-line registry change.
 */















const SCREENS = { campaign: __screen_campaign, dungeons: __screen_dungeons, roster: __screen_roster, companions: __screen_companions, bag: __screen_bag, heroDetail: __screen_heroDetail, formation: __screen_formation, battle: __screen_battle, results: __screen_results };

const TITLES = {
  campaign: 'Campaign',
  dungeons: 'Dungeons',
  roster: 'Hero',
  companions: 'Companions',
  bag: 'Bag',
  heroDetail: 'Hero',
  formation: 'Formation',
  battle: 'Battle',
  results: 'Results',
};

/** Screens that hide the shell chrome. */
const FULLSCREEN = new Set(['battle', 'results']);

/** Which tab lights up for a given screen. */
const TAB_OF = {
  campaign: 'campaign', dungeons: 'dungeons', roster: 'roster',
  companions: 'companions', bag: 'bag',
};

let current = null;
let history = [];

function navigate(name, params = {}, { replace = false } = {}) {
  const screen = SCREENS[name];
  if (!screen) { console.error('[app] unknown screen', name); return; }

  if (current && SCREENS[current.name]?.dispose) {
    try { SCREENS[current.name].dispose(); } catch (err) { console.error(err); }
  }

  if (current && !replace) history.push(current);
  if (FULLSCREEN.has(name)) history = history.filter((h) => !FULLSCREEN.has(h.name));

  current = { name, params };

  const host = $('#screen');
  clear(host);
  host.dataset.screen = name;
  document.body.dataset.screen = name;

  $('#screen-title').textContent = TITLES[name] || name;
  $('#topbar').hidden = FULLSCREEN.has(name);
  $('#tabbar').hidden = FULLSCREEN.has(name);
  $('.back-btn').hidden = history.length === 0 || FULLSCREEN.has(name);

  for (const tab of document.querySelectorAll('.tab')) {
    tab.classList.toggle('active', tab.dataset.tab === tabFor(name, params));
  }

  host.scrollTop = 0;
  screen.render(host, params);
  refreshWallet();
}

function back() {
  const prev = history.pop();
  if (!prev) return navigate('campaign', {}, { replace: true });
  const keep = history;
  navigate(prev.name, prev.params, { replace: true });
  history = keep;
}

/** Re-render the current screen in place (after a purchase, promote, etc). */
function refresh() {
  if (!current) return;
  const keep = history.slice();
  navigate(current.name, current.params, { replace: true });
  history = keep;
}

function currentScreen() {
  return current;
}

/** Which tab should light up. Hero detail depends on whose detail it is. */
function tabFor(name, params) {
  // A companion opened from either place still belongs to the companion tab;
  // the protagonist belongs to his own.
  if (name === 'heroDetail') {
    return params?.heroId === PROTAGONIST_ID ? 'roster' : 'companions';
  }
  // The pre-battle screen belongs to whichever list the fight came from.
  if (name === 'formation') {
    return params?.ref?.kind === 'dungeon' ? 'dungeons' : 'campaign';
  }
  return TAB_OF[name];
}

function refreshWallet() {
  const zeni = $('#wallet-zeni .val');
  if (zeni) zeni.textContent = fmt(getState().zeni);
  const senzu = $('#wallet-senzu .val');
  if (senzu) senzu.textContent = fmt(getState().senzu);
  const iron = $('#wallet-iron .val');
  if (iron) iron.textContent = fmt(getState().iron || 0);
}

function initShell() {
  document.querySelector('.back-btn').addEventListener('click', back);
  for (const tab of document.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => {
      history = [];
      navigate(tab.dataset.tab, {}, { replace: true });
    });
  }
  subscribe(refreshWallet);
  refreshWallet();
}

/* ===== src/main.js ===== */
/**
 * main.js \u2014 Entry point. Loads the save, boots the shell, shows the campaign.
 */




load();
initShell();
navigate('campaign', {}, { replace: true });

// iOS can discard a backgrounded tab without a beforeunload; pagehide is the
// reliable moment to flush.
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistNow();
});

// Surface module errors on-device, where there is no console.
window.addEventListener('error', (ev) => {
  const box = document.getElementById('toasts');
  if (!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="toast toast-warn">${ev.message}</div>`);
});
</script>
