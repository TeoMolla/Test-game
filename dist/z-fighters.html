/* main.css \002014 shell, roster, hero detail, campaign, bag.
   Mobile-first portrait; every size is tuned for a ~390px-wide iPhone. */

:root {
  --bg: #0b1020;
  --bg-2: #131a30;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-line: rgba(255, 255, 255, 0.1);
  --text: #eef2ff;
  --muted: #94a3b8;
  --accent: #f97316;
  --accent-2: #38bdf8;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --gold: #fbbf24;
  --radius: 14px;
  /* Anton: condensed heavy caps \002014 a fighting-game title-card voice, and the
     narrow width buys real room for long hero and stage names at 390px.
     Body text stays on the system UI stack, which is what iOS renders best. */
  --font-display: 'Anton', 'Arial Narrow', 'Helvetica Neue Condensed', 'Haettenschweiler', system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --topbar-h: 52px;
  --tabbar-h: 60px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(120% 70% at 50% 0%, #1c2545 0%, transparent 60%),
    radial-gradient(90% 60% at 80% 100%, #2a1a3a 0%, transparent 55%),
    var(--bg);
}

button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ---------------- shell ---------------- */

#topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 8px) 14px 8px;
  min-height: calc(var(--topbar-h) + var(--safe-top));
  background: linear-gradient(180deg, rgba(11, 16, 32, 0.96), rgba(11, 16, 32, 0.7));
  border-bottom: 1px solid var(--panel-line);
  backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 5;
}
#topbar[hidden] { display: none; }

.back-btn {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 10px;
  width: 34px; height: 34px;
  font-size: 22px; line-height: 1;
  padding: 0 0 3px;
}

.screen-title {
  font-family: var(--font-display);
  font-size: 21px; letter-spacing: 0.02em; flex: 1;
}

.wallet-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--panel-line);
  padding: 5px 11px; border-radius: 999px;
  font-size: 13px; font-variant-numeric: tabular-nums;
}

#screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 24px;
}
#screen[data-screen='battle'] { padding: 0; overflow: hidden; }
#screen[data-screen='results'] { padding: 0; }

#tabbar {
  display: flex;
  border-top: 1px solid var(--panel-line);
  background: rgba(11, 16, 32, 0.94);
  backdrop-filter: blur(12px);
  padding-bottom: var(--safe-bottom);
}
#tabbar[hidden] { display: none; }

.tab {
  flex: 1;
  background: none; border: 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 0 7px;
  font-size: 11px; color: var(--muted);
}
.tab .ico { font-size: 20px; }
.tab.active { color: var(--accent); }

/* ---------------- shared bits ---------------- */

.btn {
  border: 1px solid var(--panel-line);
  background: var(--panel);
  border-radius: 11px;
  padding: 11px 16px;
  font-weight: 650;
  font-size: 15px;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(180deg, #fb923c, #ea580c); border-color: #fdba74; color: #1a0e04; }
.btn.gold { background: linear-gradient(180deg, #fcd34d, #d97706); border-color: #fde68a; color: #241503; }
.btn.warn { background: linear-gradient(180deg, #64748b, #475569); border-color: #94a3b8; }
.btn.ghost { background: var(--panel); }
.btn.wide { display: block; width: 100%; margin-top: 10px; }
.btn.small { padding: 8px 13px; font-size: 13px; border-radius: 9px; }
.btn.tiny { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
.btn.disabled { opacity: 0.42; pointer-events: none; }
.btn.danger { background: linear-gradient(180deg, #ef4444, #b91c1c); border-color: #fca5a5; color: #fff; }
.btn .cost { font-weight: 500; font-size: 12px; opacity: 0.85; display: block; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: 8px;
}

.note { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 12px 2px 0; }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}
.panel-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

.power-banner {
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(120deg, rgba(249, 115, 22, 0.16), rgba(56, 189, 248, 0.12));
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 14px;
}
.pb-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.pb-value { font-size: 19px; font-weight: 800; flex: 1; font-variant-numeric: tabular-nums; }

.stars { letter-spacing: 1px; }
.stars .pip { color: rgba(255, 255, 255, 0.2); font-size: 12px; }
.stars .pip.on { color: var(--gold); text-shadow: 0 0 6px rgba(251, 191, 36, 0.6); }

.avatar-svg { width: 100%; height: 100%; display: block; }

/* Drawn art stands in for the SVG placeholder wherever a hero has sprites. */
.art-img { display: block; width: 100%; height: 100%; object-fit: contain; }
.art-img.bust { object-position: 50% 100%; }
.art-img.portrait { object-fit: contain; object-position: 50% 100%; }

/* ---------------- campaign ---------------- */

.stage-list { display: flex; flex-direction: column; gap: 10px; }

.stage-card {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 11px;
}
.stage-card.cleared { border-color: rgba(74, 222, 128, 0.35); }
.stage-card.locked { opacity: 0.45; }
.stage-card.risky { border-color: rgba(251, 191, 36, 0.35); }

.stage-num {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px;
  background: linear-gradient(180deg, #334155, #1e293b);
  font-weight: 800; font-size: 15px;
}
.stage-card.cleared .stage-num { background: linear-gradient(180deg, #16a34a, #14532d); }

.stage-body { flex: 1; min-width: 0; }
.stage-name { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.01em; text-wrap: balance; }
.stage-name .tick { color: var(--good); }
.stage-sub { color: var(--muted); font-size: 12px; margin-top: 1px; line-height: 1.35; }

.enemy-row { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
.enemy-chip {
  width: 30px; height: 30px; border-radius: 8px; overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
  border: 1.5px solid var(--rc, var(--panel-line));
}
.enemy-row .more { font-size: 11px; color: var(--muted); }

.stage-meta { margin-top: 6px; font-size: 11.5px; }
.gate.ok { color: var(--good); }
.gate.warn { color: var(--warn); }
.stage-action { flex: none; }
.stage-action .lock { font-size: 20px; opacity: 0.7; }

/* ---------------- roster ---------------- */

.hero-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.hero-card {
  position: relative;
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 4px 7px;
  border-radius: 12px;
  border: 1.5px solid var(--rarity, #64748b);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.25)),
    color-mix(in srgb, var(--rarity, #64748b) 22%, #0b1020);
  box-shadow: 0 0 14px -6px var(--glow, transparent);
  cursor: pointer;
  overflow: hidden;
}
.hero-card.locked { filter: grayscale(0.9) brightness(0.62); }
.hero-card.unlockable { filter: none; animation: readyPulse 1.8s ease-in-out infinite; }

@keyframes readyPulse {
  0%, 100% { box-shadow: 0 0 12px -6px var(--glow); }
  50% { box-shadow: 0 0 20px -2px var(--glow); }
}

.rarity-tag {
  position: absolute; top: 4px; left: 5px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.05em;
  background: var(--rarity); color: #0b1020;
  padding: 1px 5px; border-radius: 5px;
}
.card-art { width: 100%; aspect-ratio: 1 / 1; display: block; }
.card-name { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.02em; margin-top: 2px; }
.card-sub { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-stars { margin-top: 1px; }

.shard-frac {
  font-size: 12px; font-weight: 800;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 6px; padding: 1px 7px; margin-top: 2px;
}
.shard-frac.ready { background: var(--good); color: #062b12; }

.hero-card.small { padding: 6px 3px; }
.hero-card.small .card-art { aspect-ratio: 1 / 1; }
.hero-card.current { outline: 2px solid var(--accent); }

/* ---------------- hero detail ---------------- */

.hero-hero { text-align: center; margin-bottom: 6px; }
.rarity-badge {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: #0b1020; background: var(--rarity, #64748b);
  padding: 2px 9px; border-radius: 999px;
}
.hero-name { font-family: var(--font-display); font-size: 30px; letter-spacing: 0.01em; margin-top: 3px; text-wrap: balance; }
.hero-title { font-size: 12px; color: var(--muted); }

.tab-bar {
  display: flex; gap: 8px; margin-top: 14px;
  /* Fixed to the bottom of the scroll area, as in the reference hero screen,
     so the tabs stay reachable however long the tab content is. */
  position: sticky; bottom: -14px; z-index: 3;
  margin-left: -14px; margin-right: -14px;
  padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px));
  background: rgba(11, 16, 32, 0.93);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--panel-line);
}
.tab-btn {
  flex: 1; padding: 10px 0; border-radius: 11px;
  border: 1px solid var(--panel-line); background: var(--panel);
  font-size: 14px; font-weight: 650; color: var(--muted);
}
.tab-btn.active { background: var(--rarity, #38bdf8); color: #0b1020; border-color: transparent; }

.tab-body { min-height: 200px; padding-bottom: 62px; }

.portrait-stage {
  position: relative;
  /* Slightly shorter than square so the stat row and Upgrade button clear the
     sticky tab bar without scrolling on a small phone. */
  aspect-ratio: 1 / 0.86;
  max-width: 300px;
  margin: 0 auto;
  border-radius: 18px;
  background:
    radial-gradient(70% 60% at 50% 30%, color-mix(in srgb, var(--rarity) 30%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.35));
  border: 1px solid var(--panel-line);
  overflow: hidden;
}
.portrait-art { position: absolute; inset: 8% 14% 0; }

.gear-slot {
  position: absolute;
  width: 46px; height: 46px;
  border-radius: 11px;
  border: 1.5px dashed rgba(255, 255, 255, 0.25);
  background: rgba(0, 0, 0, 0.45);
  display: grid; place-items: center;
  font-size: 20px;
}
.gear-slot.filled { border-style: solid; border-color: var(--gr); box-shadow: 0 0 12px -4px var(--gr); }
.gear-slot:not(.filled) .gi { opacity: 0.35; }
.slot-weapon { top: 10px; left: 10px; }
.slot-chest  { top: 66px; left: 10px; }
.slot-gloves { top: 10px; right: 10px; }
.slot-boots  { top: 66px; right: 10px; }

.power-plate {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.6); border: 1px solid var(--gold);
  color: var(--gold); font-weight: 800; font-size: 16px;
  padding: 3px 14px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}

.stat-panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 10px; margin-top: 10px;
}
.level-line { text-align: center; font-size: 19px; font-weight: 800; color: var(--gold); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 4px; }
.stat { text-align: center; }
.sn { display: block; font-size: 10px; color: var(--muted); }
.sv { display: block; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }

.stars-panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 14px; text-align: center;
}
.big-stars .pip { font-size: 26px; }
.star-caption { color: var(--muted); font-size: 12px; margin-top: 2px; }

.promo-table { margin: 14px 0; display: flex; flex-direction: column; gap: 6px; }
.promo-row {
  display: grid; grid-template-columns: 60px 1fr 26px 1fr;
  align-items: center; font-variant-numeric: tabular-nums;
  border-bottom: 1px solid var(--panel-line); padding-bottom: 5px;
}
.pk { text-align: left; color: var(--muted); font-size: 12px; }
.pv { font-weight: 700; }
.pv.next { color: var(--good); }
.parrow { color: var(--good); }

.slot-row { display: flex; justify-content: center; gap: 8px; margin: 14px 0 6px; }
.skill-slot {
  width: 50px; height: 50px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  border: 1.5px solid var(--panel-line);
  background: linear-gradient(180deg, #3b2a5c, #241a3a);
  font-size: 21px;
}
.skill-slot.off { filter: grayscale(1) brightness(0.5); }
.skill-slot.reserved { border-style: dashed; }
.skill-slot .req {
  position: absolute; bottom: -2px; right: -2px;
  font-size: 9px; font-weight: 800;
  background: #0b1020; border: 1px solid var(--panel-line);
  border-radius: 5px; padding: 0 3px;
}

.skill-list { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.skill-row {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 12px; padding: 11px;
}
.skill-row.locked { opacity: 0.5; }
.skill-icon {
  width: 42px; height: 42px; flex: none; border-radius: 10px;
  display: grid; place-items: center; font-size: 20px;
  background: linear-gradient(180deg, #3b2a5c, #241a3a);
}
.skill-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.skill-name { font-weight: 700; font-size: 14px; }
.lock-tag {
  font-size: 10px; font-weight: 800; color: var(--gold);
  border: 1px solid var(--gold); border-radius: 5px; padding: 0 4px; margin-left: 6px;
}
.skill-slot-label { font-size: 10.5px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.05em; }
.skill-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

/* ---------------- sheets ---------------- */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0, 0, 0, 0.62);
  display: flex; align-items: flex-end;
  backdrop-filter: blur(3px);
}
.sheet {
  width: 100%;
  background: var(--bg-2);
  border-top-left-radius: 20px; border-top-right-radius: 20px;
  border-top: 1px solid var(--panel-line);
  padding: 16px 14px calc(16px + var(--safe-bottom));
  max-height: 78dvh; overflow-y: auto;
  animation: sheetUp 0.22s ease;
}
@keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } }
.sheet-title { font-family: var(--font-display); font-size: 19px; margin-bottom: 12px; }

.gear-rows { display: flex; flex-direction: column; gap: 8px; }
.gear-row, .shard-row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-left: 3px solid var(--gr, var(--rc, var(--panel-line)));
  border-radius: 11px; padding: 10px; text-align: left;
}
.gear-row .gi { font-size: 21px; width: 30px; text-align: center; }
.gt, .sr-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.gt small, .sr-text small { color: var(--muted); font-size: 11px; }
.gr-tag, .sr-count { font-size: 11px; color: var(--muted); font-weight: 700; }
.shard-row { margin-bottom: 8px; }
.sr-art { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3); }

.pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 6px; }

/* ---------------- formation ---------------- */

.battle-brief {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 14px;
}
.brief-title { font-family: var(--font-display); font-size: 19px; letter-spacing: 0.01em; }
.brief-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.enemy-lineup { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.lineup-unit { text-align: center; width: 62px; }
.lu-art {
  width: 62px; height: 62px; border-radius: 11px; overflow: hidden;
  border: 1.5px solid var(--rc); background: rgba(0, 0, 0, 0.3);
}
.lu-name { font-family: var(--font-display); font-size: 12.5px; margin-top: 3px; }
.lu-row { font-size: 9.5px; color: var(--muted); text-transform: uppercase; }

.power-compare { font-size: 12.5px; }
.power-compare.ok { color: var(--good); }
.power-compare.warn { color: var(--warn); }
.warn-tag { background: var(--warn); color: #241503; border-radius: 5px; padding: 0 5px; font-weight: 800; font-size: 10px; margin-left: 5px; }

.formation-field { display: flex; flex-direction: column; gap: 12px; }
.form-row {
  border: 1px dashed var(--panel-line);
  border-radius: var(--radius);
  padding: 9px;
  background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
}
.form-front { border-color: rgba(249, 115, 22, 0.4); }
.form-back { border-color: rgba(56, 189, 248, 0.35); }
.row-label { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
.row-slots { display: flex; gap: 9px; flex-wrap: wrap; }

.form-unit {
  width: 96px; text-align: center;
  border: 1.5px solid var(--rarity, var(--panel-line));
  border-radius: 12px; padding: 6px 4px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.25));
}
.fu-art { width: 100%; aspect-ratio: 1/1; background: none; border: 0; padding: 0; display: block; }
.fu-name { font-family: var(--font-display); font-size: 14px; }
.fu-sub { font-size: 10px; color: var(--muted); }
.fu-stars { margin-bottom: 5px; }
.form-unit.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; min-height: 150px; border-style: dashed; color: var(--muted); font-size: 12px;
}
.form-unit .plus { font-size: 26px; }

.action-bar { margin-top: 16px; }

/* ---------------- results ---------------- */

.results {
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 40px) 18px calc(var(--safe-bottom) + 24px);
  text-align: center;
  display: flex; flex-direction: column;
}
.res-banner { font-family: var(--font-display); font-size: 52px; letter-spacing: 0.05em; }
.results.win .res-banner { color: var(--gold); text-shadow: 0 0 26px rgba(251, 191, 36, 0.55); }
.results.lose .res-banner { color: var(--bad); }
.res-stage { font-family: var(--font-display); font-size: 18px; margin-top: 6px; }
.res-line { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.first-clear {
  margin: 10px auto 0; display: inline-block;
  background: var(--gold); color: #241503; font-weight: 800; font-size: 12px;
  padding: 3px 12px; border-radius: 999px;
}
.reward-list { margin: 22px 0; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.reward {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 11px; padding: 10px 13px; font-size: 14px;
}
.reward .ri { font-size: 21px; width: 30px; text-align: center; }
.reward .ri.shard { height: 30px; border-radius: 7px; overflow: hidden; background: rgba(0,0,0,0.3); }
.res-actions { display: flex; flex-direction: column; }

/* ---------------- toasts ---------------- */

#toasts {
  position: fixed; top: calc(var(--safe-top) + 60px); left: 0; right: 0;
  z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(15, 23, 42, 0.96);
  border: 1px solid var(--panel-line);
  border-radius: 999px; padding: 7px 16px; font-size: 13px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.toast-good { border-color: var(--good); color: var(--good); }
.toast-warn { border-color: var(--warn); color: var(--warn); }
.toast.out { opacity: 0; transform: translateY(-8px); }


/* battle.css \002014 the real-time battle screen.
   Side-view lanes: player left, enemies right; back row sits behind and above
   the front row to fake depth in portrait. */

.battle-screen {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(90% 50% at 50% 12%, #24325c 0%, transparent 62%),
    linear-gradient(180deg, #101736 0%, #0a0f22 55%, #131a2e 100%);
}

/* ---- top bar ---- */

.bt-top {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
}
.bt-stage { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.02em; flex: 1; opacity: 0.9; }
.bt-timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: 14px;
  background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px; padding: 3px 11px;
}

/* ---- arena ---- */

.arena {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 6px;
  min-height: 0;
  position: relative;
}
/* ground plane */
.arena::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 56%;
  background: linear-gradient(180deg, rgba(120, 90, 60, 0) 0%, rgba(120, 90, 60, 0.14) 28%, rgba(60, 45, 30, 0.3) 100%);
  z-index: 0;
}

.side { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; position: relative; z-index: 1; }
.side-player { justify-content: flex-start; }
.side-enemy { justify-content: flex-end; }

.lane { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
/* stagger stacked units sideways so a lane reads as a formation, not a column */
.side-player .lane .unit:nth-child(even) { margin-left: 20px; }
.side-enemy .lane .unit:nth-child(even) { margin-right: 20px; }
/* back row: smaller and lifted, so it reads as "further away" */
.lane-back { transform: translateY(-34px) scale(0.82); opacity: 0.94; }

.unit {
  position: relative;
  width: 74px;
  display: flex; flex-direction: column; align-items: center;
  /* --advance-x/y is where this unit has run to engage; 0 for anyone holding
     the back line. Every transform below has to carry it, or a unit snaps back
     to its lane the moment another class touches `transform`. */
  transform: translate(var(--advance-x, 0px), var(--advance-y, 0px));
  transition: opacity 0.35s ease, transform var(--approach-ms, 550ms) ease-in-out;
}
.unit.dead {
  opacity: 0;
  transform: translate(var(--advance-x, 0px), calc(var(--advance-y, 0px) + 14px)) scale(0.85);
  pointer-events: none;
}

/* Running in. There is no run cycle in the sprite set, so the guard pose plus
   a bob carries it; a real run frame would drop straight in here. */
.unit.advancing .u-art { animation: runBob 280ms ease-in-out infinite; }
@keyframes runBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

.u-art { width: 74px; height: 104px; position: relative; }

/* Sprite units. The frame is sized by height so every pose keeps one scale,
   and pinned by its --cx anchor (the character's torso centre) so a wide pose
   like a high kick or a knockback doesn't slide the character sideways. */
.u-sprite { position: absolute; inset: 0; }
.unit.enemy .u-sprite { transform: scaleX(-1); }
.u-frame {
  position: absolute;
  bottom: 0;
  left: 50%;
  height: 100%;
  width: auto;
  max-width: none;
  transform: translateX(calc(var(--cx, 0.5) * -100%));
  image-rendering: auto;
  pointer-events: none;
}
/* Sprite units play their own defeat clip, so they hold at full opacity until
   it finishes. :not(.dead) matters \002014 this selector is more specific than
   .unit.dead, and without it the body would never fade out afterwards. */
.unit.has-sprite.dying:not(.dead) { opacity: 1; transform: translate(var(--advance-x, 0px), var(--advance-y, 0px)); }
.u-art::after {
  content: '';
  position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
  width: 46px; height: 12px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--aura), transparent);
  opacity: 0.5;
}

/* hit / attack motion \002014 these are the only "animations" in the prototype */
.u-art.hit { animation: hitShake 0.22s ease; }
@keyframes hitShake {
  0% { transform: translateX(0); filter: none; }
  25% { transform: translateX(-5px); filter: brightness(2.4) saturate(0.3); }
  60% { transform: translateX(4px); filter: brightness(1.4); }
  100% { transform: translateX(0); filter: none; }
}
.unit.player .u-art.lunge { animation: lungeR 0.3s ease; }
.unit.enemy .u-art.lunge { animation: lungeL 0.3s ease; }
@keyframes lungeR { 50% { transform: translateX(11px); } }
@keyframes lungeL { 50% { transform: translateX(-11px); } }

/* Kamehameha. The release frame draws the hands but no beam \002014 this is the beam,
   so it can stretch to whatever it is aimed at. */
.u-beam {
  position: absolute;
  top: 52%;
  left: 100%;
  height: 9px;
  width: 0;
  opacity: 0;
  transform: translateY(-50%);
  border-radius: 999px;
  background: linear-gradient(90deg,
    rgba(255,255,255,0.98) 0%,
    rgba(186,230,253,0.95) 25%,
    rgba(56,189,248,0.75) 65%,
    rgba(56,189,248,0) 100%);
  box-shadow: 0 0 16px 4px rgba(125, 211, 252, 0.65);
  pointer-events: none;
  z-index: 3;
}
.unit.enemy .u-beam {
  left: auto; right: 100%;
  background: linear-gradient(270deg,
    rgba(255,255,255,0.98) 0%,
    rgba(254,215,170,0.95) 25%,
    rgba(249,115,22,0.75) 65%,
    rgba(249,115,22,0) 100%);
  box-shadow: 0 0 16px 4px rgba(251, 146, 60, 0.6);
}
.u-beam.fire { animation: beamOut var(--beam-ms, 400ms) ease-out forwards; }
@keyframes beamOut {
  0%   { width: 0; opacity: 0; }
  18%  { width: calc(var(--beam-len, 150px) * 0.55); opacity: 1; }
  55%  { width: var(--beam-len, 150px); opacity: 1; }
  100% { width: var(--beam-len, 150px); opacity: 0; }
}

.u-bar {
  width: 54px; height: 5px; border-radius: 3px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(0, 0, 0, 0.8);
  overflow: hidden;
  margin-top: 2px;
}
.u-fill {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(180deg, #86efac, #22c55e);
  transition: width 0.16s linear;
}
.unit.enemy .u-fill { background: linear-gradient(180deg, #fca5a5, #ef4444); }
.u-fill.low { background: linear-gradient(180deg, #fde047, #f59e0b); }

.u-name {
  font-size: 9px; color: rgba(255, 255, 255, 0.7);
  margin-top: 2px; white-space: nowrap;
}

/* ---- floating combat text ---- */

.u-fx { position: absolute; left: 50%; top: 6px; width: 0; height: 0; z-index: 4; }
.float {
  position: absolute;
  left: 0; top: 0;
  transform: translateX(-50%);
  font-weight: 900;
  font-size: 15px;
  white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.85);
  animation: floatUp 0.95s ease-out forwards;
  font-variant-numeric: tabular-nums;
}
@keyframes floatUp {
  0%   { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(6px + var(--dy, 0px))) scale(0.7); }
  18%  { opacity: 1; transform: translate(calc(-50% + var(--dx, 0px)), calc(-4px + var(--dy, 0px))) scale(1.12); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-46px + var(--dy, 0px))) scale(0.95); }
}
.float.dmg { color: #fff; }
.float.crit { color: #fde047; font-size: 20px; }
.float.heal { color: #4ade80; }
.float.self { color: #fca5a5; }
.float.buff { color: #7dd3fc; font-size: 12px; }
.float.debuff { color: #c084fc; font-size: 12px; }

/* ---- skill call-out above the caster ---- */

.u-callout {
  position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 800; white-space: nowrap;
  padding: 2px 8px; border-radius: 999px;

/* ===== src/save/index.js ===== */
/**
 * save/index.js \u2014 Persistence layer.
 *
 * Owns the single mutable player-state object. Every other system reads and
 * mutates it through their own module APIs, then calls `persist()`.
 * Swapping localStorage for a server later means reimplementing only
 * `load()` / `persist()` \u2014 the state shape is the contract.
 */




const STORAGE_KEY = 'dbz-rpg-prototype:v1';
const SCHEMA_VERSION = 1;

/** PLACEHOLDER: starting purse. */
const STARTING_ZENI = 800;

/** PLACEHOLDER: shards the player begins with, to show unlock progress. */
const STARTING_SHARDS = { piccolo: 4, gohan: 2, tien: 6 };

const listeners = new Set();

function emptyEquipped() {
  const e = {};
  for (const s of GEAR_SLOTS) e[s] = null;
  return e;
}

function defaultState() {
  const heroes = {};
  for (const def of Object.values(HEROES)) {
    heroes[def.id] = {
      owned: !!def.startsOwned,
      star: def.startsOwned ? (def.startStar ?? 1) : 0,
      level: 1,
      equipped: emptyEquipped(),
    };
  }

  const startingTeam = Object.values(HEROES)
    .filter((h) => h.startsOwned)
    .slice(0, 3)
    .map((h) => ({ heroId: h.id, row: h.preferredRow }));

  return {
    version: SCHEMA_VERSION,
    zeni: STARTING_ZENI,
    heroes,
    shards: { ...STARTING_SHARDS },
    gear: [],
    campaign: { cleared: {}, highestCleared: 0 },
    team: startingTeam,
    stats: { battlesWon: 0, battlesLost: 0 },
  };
}

/**
 * Merge a loaded save over a fresh default so heroes/gear/fields added after
 * the save was written appear with sane values instead of undefined.
 */
function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;

  const merged = { ...base, ...raw, version: SCHEMA_VERSION };
  merged.heroes = { ...base.heroes };
  for (const [id, saved] of Object.entries(raw.heroes || {})) {
    if (!base.heroes[id]) continue; // hero removed from the game
    merged.heroes[id] = {
      ...base.heroes[id],
      ...saved,
      equipped: { ...emptyEquipped(), ...(saved.equipped || {}) },
    };
  }
  merged.shards = { ...raw.shards };
  merged.gear = Array.isArray(raw.gear) ? raw.gear : [];
  merged.campaign = { ...base.campaign, ...(raw.campaign || {}) };
  merged.campaign.cleared = { ...(raw.campaign?.cleared || {}) };
  merged.team = Array.isArray(raw.team) ? raw.team.filter((s) => s && merged.heroes[s.heroId]) : base.team;
  merged.stats = { ...base.stats, ...(raw.stats || {}) };
  return merged;
}

let state = defaultState();

function getState() {
  return state;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    state = migrate(raw ? JSON.parse(raw) : null);
  } catch (err) {
    // Private-browsing Safari can throw on read; fall back to a fresh run.
    console.warn('[save] load failed, starting fresh', err);
    state = defaultState();
  }
  return state;
}

let pending = null;

/** Debounced write \u2014 battles mutate state often. */
function persist() {
  if (pending) return;
  pending = setTimeout(() => {
    pending = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn('[save] persist failed (quota or private mode)', err);
    }
    emit();
  }, 60);
}

/** Write immediately \u2014 used before navigating away. */
function persistNow() {
  if (pending) { clearTimeout(pending); pending = null; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn('[save] persist failed', err);
  }
  emit();
}

function resetSave() {
  state = defaultState();
  persistNow();
  return state;
}

function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function emit() {
  for (const fn of listeners) {
    try { fn(state); } catch (err) { console.error('[save] listener error', err); }
  }
}

/* ===== src/gear/index.js ===== */
/**
 * gear/index.js \u2014 Public interface of the gear system.
 *
 * A gear *definition* lives in gear.js; a gear *instance* is what the player
 * owns: { uid, defId, equippedBy }. Instances live in the inventory so that
 * unequipping never loses an item.
 */





let uidCounter = 0;

/** Create an owned instance of a gear definition. */
function createGearInstance(defId, seedUid) {
  if (!GEAR[defId]) return null;
  const uid = seedUid || `g_${Date.now().toString(36)}_${(uidCounter++).toString(36)}`;
  return { uid, defId, equippedBy: null };
}

/**
 * Sum the bonuses of an equipped map ({ weapon: uid, ... }) into
 * { flat, pct } totals. Unknown / missing uids are ignored, so a save that
 * references deleted gear degrades gracefully.
 */
function bonusesFor(equipped, gearInstances) {
  const flat = { atk: 0, hp: 0, def: 0, speed: 0 };
  const pct = { atk: 0, hp: 0, def: 0, speed: 0 };
  if (!equipped) return { flat, pct };

  for (const slot of GEAR_SLOTS) {
    const uid = equipped[slot];
    if (!uid) continue;
    const inst = gearInstances.find((g) => g.uid === uid);
    const def = inst && getGearDef(inst.defId);
    if (!def) continue;
    for (const k of Object.keys(flat)) {
      if (def.flat && def.flat[k]) flat[k] += def.flat[k];
      if (def.pct && def.pct[k]) pct[k] += def.pct[k];
    }
  }
  return { flat, pct };
}

/** Short "+12 ATK, +5% ATK" style summary for list rows. */
function describeGear(def) {
  if (!def) return '';
  const parts = [];
  for (const [k, v] of Object.entries(def.flat || {})) parts.push(`+${v} ${k.toUpperCase()}`);
  for (const [k, v] of Object.entries(def.pct || {})) parts.push(`+${Math.round(v * 100)}% ${k.toUpperCase()}`);
  return parts.join(' \u00b7 ');
}

/**
 * Roll a drop from a stage's drop table.
 * PLACEHOLDER: flat weighted roll, no pity, no level scaling.
 * table: [{ defId, weight, chance }]
 */
function rollGearDrops(table) {
  const drops = [];
  for (const entry of table || []) {
    if (Math.random() < (entry.chance ?? 0.35)) drops.push(entry.defId);
  }
  return drops;
}

/* ===== src/inventory/index.js ===== */
/**
 * inventory/index.js \u2014 Shared player resources: currency, shards, gear items.
 *
 * Every system that grants or spends resources goes through here so there is
 * exactly one place that touches the numbers (and one place to add analytics,
 * animations or anti-cheat later).
 */





/* ---------------- currency ---------------- */

function zeni() {
  return getState().zeni;
}

function addZeni(amount) {
  getState().zeni += amount;
  persist();
}

function spendZeni(amount) {
  const s = getState();
  if (s.zeni < amount) return false;
  s.zeni -= amount;
  persist();
  return true;
}

/* ---------------- shards ---------------- */

function shards(heroId) {
  return getState().shards[heroId] || 0;
}

function addShards(heroId, amount) {
  const s = getState();
  s.shards[heroId] = (s.shards[heroId] || 0) + amount;
  persist();
}

function spendShards(heroId, amount) {
  const s = getState();
  if ((s.shards[heroId] || 0) < amount) return false;
  s.shards[heroId] -= amount;
  persist();
  return true;
}

/* ---------------- gear ---------------- */

function allGear() {
  return getState().gear;
}

function gearByUid(uid) {
  return getState().gear.find((g) => g.uid === uid) || null;
}

function addGear(defId) {
  const inst = createGearInstance(defId);
  if (!inst) return null;
  getState().gear.push(inst);
  persist();
  return inst;
}

/** Unequipped gear for a slot, for the equip picker. */
function availableGearForSlot(slot) {
  return getState().gear.filter((g) => {
    const def = getGearDef(g.defId);
    return def && def.slot === slot && !g.equippedBy;
  });
}

/**
 * Equip an item onto a hero. Handles swapping out whatever occupied the slot
 * and stealing the item off another hero if it was equipped elsewhere.
 */
function equipGear(heroId, uid) {
  const s = getState();
  const inst = gearByUid(uid);
  const hero = s.heroes[heroId];
  if (!inst || !hero) return false;
  const def = getGearDef(inst.defId);
  if (!def) return false;

  if (inst.equippedBy && inst.equippedBy !== heroId) {
    const prev = s.heroes[inst.equippedBy];
    if (prev && prev.equipped[def.slot] === uid) prev.equipped[def.slot] = null;
  }

  const displaced = hero.equipped[def.slot];
  if (displaced) {
    const old = gearByUid(displaced);
    if (old) old.equippedBy = null;
  }

  hero.equipped[def.slot] = uid;
  inst.equippedBy = heroId;
  persist();
  return true;
}

function unequipGear(heroId, slot) {
  const s = getState();
  const hero = s.heroes[heroId];
  if (!hero || !GEAR_SLOTS.includes(slot)) return false;
  const uid = hero.equipped[slot];
  if (!uid) return false;
  const inst = gearByUid(uid);
  if (inst) inst.equippedBy = null;
  hero.equipped[slot] = null;
  persist();
  return true;
}

/** Grant a batch of rewards from a stage clear. Returns a display summary. */
function grantRewards({ zeni: z = 0, shards: sh = {}, gear: gearDefIds = [] } = {}) {
  const summary = { zeni: z, shards: [], gear: [] };
  if (z) addZeni(z);
  for (const [heroId, amount] of Object.entries(sh)) {
    if (!amount) continue;
    addShards(heroId, amount);
    summary.shards.push({ heroId, amount });
  }
  for (const defId of gearDefIds) {
    const inst = addGear(defId);
    if (inst) summary.gear.push(getGearDef(defId));
  }
  return summary;
}
const inventory = { zeni, addZeni, spendZeni, shards, addShards, spendShards, allGear, gearByUid, addGear, availableGearForSlot, equipGear, unequipGear, grantRewards };

/* ===== src/skills/index.js ===== */
/**
 * skills/index.js \u2014 Public interface of the skill system.
 *
 * Responsibilities:
 *   - report which skill slots a hero has unlocked (star rank + rarity gates)
 *   - resolve a loadout into concrete skill objects
 *
 * Applying a skill's effects to units is the battle engine's job
 * (battle/engine.js) \u2014 this module stays free of combat state so skills can be
 * inspected from the roster UI without spinning up a battle.
 */






/** Star rank required for a slot, or null if the slot can never unlock. */
function slotRequirement(slot, rarityId) {
  if (RESERVED_SLOTS.includes(slot)) return null; // transformation \u2014 future pass
  if (slot === 'passive' && !rarityOf(rarityId).hasPassive) return null;
  const req = SKILL_SLOT_UNLOCK[slot];
  return req === undefined ? null : req;
}

function isSlotUnlocked(slot, rarityId, star) {
  const req = slotRequirement(slot, rarityId);
  return req !== null && star >= req;
}

/**
 * Human-readable reason a slot is locked, for the Stars tab.
 */
function slotLockLabel(slot, rarityId) {
  if (RESERVED_SLOTS.includes(slot)) return 'Future';
  if (slot === 'passive' && !rarityOf(rarityId).hasPassive) return 'Epic+';
  const req = slotRequirement(slot, rarityId);
  return req === null ? '\u2014' : `${req}\u2605`;
}

/**
 * Every slot for a hero with its skill + lock state. Drives the Stars tab and
 * the skills list, and is also what the battle engine filters on.
 */
function loadoutSlots(loadout, rarityId, star) {
  return SKILL_SLOTS.map((slot) => {
    const skill = loadout && loadout[slot] ? getSkill(loadout[slot]) : null;
    const requirement = slotRequirement(slot, rarityId);
    return {
      slot,
      skill,
      requirement,
      unlocked: requirement !== null && star >= requirement && !!skill,
      lockLabel: slotLockLabel(slot, rarityId),
      reserved: RESERVED_SLOTS.includes(slot),
    };
  });
}

/** The skills a unit can actually use in combat right now. */
function activeSkills(loadout, rarityId, star) {
  const out = { attack: null, technique: null, ultimate: null, passive: null };
  for (const entry of loadoutSlots(loadout, rarityId, star)) {
    if (entry.unlocked && entry.slot in out) out[entry.slot] = entry.skill;
  }
  return out;
}

/* ===== src/hero/index.js ===== */
/**
 * hero/index.js \u2014 Public interface of the hero system.
 *
 * Turns a hero *definition* (static, hero/heroes.js) plus the player's *hero
 * state* (owned / star / level / equipped, in the save) into the concrete
 * numbers the rest of the game uses.
 *
 * Nothing outside this module should multiply base stats by anything.
 */










function heroSave(heroId) {
  return getState().heroes[heroId] || null;
}

function isOwned(heroId) {
  const hs = heroSave(heroId);
  return !!(hs && hs.owned);
}

/**
 * Stats before gear, at a given star + level.
 * PLACEHOLDER: `speed` deliberately does NOT scale with star or level \u2014 it
 * sets combat pacing, and letting it inflate makes battles unreadable. Only
 * gear moves it.
 */
function baseStatsAt(def, star, level = 1) {
  const rarity = rarityOf(def.rarity);
  const starMult = STAR_STAT_MULT[Math.min(star, MAX_STARS)] ?? 1;
  const levelMult = 1 + LEVEL_STAT_STEP * (level - 1);
  const scale = rarity.statMult * starMult * levelMult;
  return {
    atk: Math.round(def.baseStats.atk * scale),
    hp: Math.round(def.baseStats.hp * scale),
    def: Math.round(def.baseStats.def * scale),
    speed: def.baseStats.speed,
  };
}

/** Final stats including equipped gear. */
function statsFor(heroId, override = {}) {
  const def = getHeroDef(heroId);
  if (!def) return { atk: 0, hp: 0, def: 0, speed: 1 };
  const hs = heroSave(heroId) || { star: 0, level: 1, equipped: {} };
  const star = override.star ?? hs.star;
  const level = override.level ?? hs.level;
  const equipped = override.equipped ?? hs.equipped;

  const base = baseStatsAt(def, star, level);
  const { flat, pct } = bonusesFor(equipped, getState().gear);

  return {
    atk: Math.round((base.atk + flat.atk) * (1 + pct.atk)),
    hp: Math.round((base.hp + flat.hp) * (1 + pct.hp)),
    def: Math.round((base.def + flat.def) * (1 + pct.def)),
    speed: +((base.speed + flat.speed) * (1 + pct.speed)).toFixed(3),
  };
}

function powerOf(heroId, override = {}) {
  const hs = heroSave(heroId) || { star: 0 };
  return computePower(statsFor(heroId, override), override.star ?? hs.star);
}

function teamPower(team = getState().team) {
  return team.reduce((sum, slot) => sum + (slot?.heroId ? powerOf(slot.heroId) : 0), 0);
}

/** Skills usable right now, given the hero's star rank. */
function skillsFor(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId);
  if (!def || !hs) return { attack: null, technique: null, ultimate: null, passive: null };
  return activeSkills(def.loadout, def.rarity, hs.star);
}

/** Every slot with lock state \u2014 drives the Stars tab. */
function slotsFor(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId) || { star: 0 };
  if (!def) return [];
  return loadoutSlots(def.loadout, def.rarity, hs.star);
}

/* ---------------- unlocking ---------------- */

function unlockInfo(heroId) {
  const def = getHeroDef(heroId);
  const rarity = rarityOf(def.rarity);
  const have = inventory.shards(heroId);
  const need = rarity.shardsToUnlock;
  return { have, need, canUnlock: !isOwned(heroId) && have >= need };
}

function unlockHero(heroId) {
  const info = unlockInfo(heroId);
  if (!info.canUnlock) return false;
  if (!inventory.spendShards(heroId, info.need)) return false;
  const hs = heroSave(heroId);
  hs.owned = true;
  hs.star = getHeroDef(heroId).startStar ?? 1;
  persist();
  return true;
}

/* ---------------- star promotion ---------------- */

function promoteInfo(heroId) {
  const def = getHeroDef(heroId);
  const hs = heroSave(heroId);
  if (!def || !hs) return null;
  const atMax = hs.star >= MAX_STARS;
  const cost = atMax ? 0 : STAR_PROMOTE_SHARDS[hs.star];
  const have = inventory.shards(heroId);
  const current = baseStatsAt(def, hs.star, hs.level);
  const next = atMax ? current : baseStatsAt(def, hs.star + 1, hs.level);
  return { star: hs.star, atMax, cost, have, canPromote: !atMax && have >= cost, current, next };
}

function promote(heroId) {
  const info = promoteInfo(heroId);
  if (!info || !info.canPromote) return false;
  if (!inventory.spendShards(heroId, info.cost)) return false;
  heroSave(heroId).star += 1;
  persist();
  return true;
}

/* ---------------- levelling ---------------- */

function levelInfo(heroId) {
  const hs = heroSave(heroId);
  if (!hs) return null;
  const atMax = hs.level >= MAX_LEVEL;
  const cost = atMax ? 0 : levelUpCost(hs.level);
  return { level: hs.level, atMax, cost, have: inventory.zeni(), canLevel: !atMax && inventory.zeni() >= cost };
}

function levelUp(heroId) {
  const info = levelInfo(heroId);
  if (!info || !info.canLevel) return false;
  if (!inventory.spendZeni(info.cost)) return false;
  heroSave(heroId).level += 1;
  persist();
  return true;
}

/* ---------------- roster view model ---------------- */

function rosterEntries() {
  return HERO_IDS.map((id) => {
    const def = getHeroDef(id);
    const hs = heroSave(id);
    const owned = !!hs?.owned;
    return {
      id, def, rarity: rarityOf(def.rarity), owned,
      star: hs?.star ?? 0,
      level: hs?.level ?? 1,
      power: owned ? powerOf(id) : 0,
      unlock: unlockInfo(id),
    };
  }).sort((a, b) => (b.owned - a.owned) || (b.rarity.order - a.rarity.order) || b.power - a.power);
}

/* ===== src/progression/index.js ===== */
/**
 * progression/index.js \u2014 Campaign state: which stages are open, what a clear
 * pays out, and how the enemy team for a stage is built.
 */










function isCleared(stageId) {
  return !!getState().campaign.cleared[stageId];
}

/**
 * A stage is playable when the previous stage is cleared. Power is a *warning*
 * gate, not a hard lock \u2014 the player can attempt an over-tuned fight and lose,
 * which reads better than a greyed-out button.
 * PLACEHOLDER: flip `locked` to include power if a hard gate is preferred.
 */
function stageList() {
  const power = teamPower();
  return STAGES.map((stage, idx) => {
    const prevCleared = idx === 0 || isCleared(STAGES[idx - 1].id);
    return {
      stage,
      cleared: isCleared(stage.id),
      locked: !prevCleared,
      underpowered: power < stage.requiredPower,
      power,
    };
  });
}

function nextStage() {
  const list = stageList();
  return (list.find((s) => !s.cleared && !s.locked) || list[list.length - 1]).stage;
}

/** Build the concrete enemy units for a stage (pre-battle preview + combat). */
function buildEnemyTeam(stageId) {
  const stage = getStage(stageId);
  if (!stage) return [];
  return stage.enemies.map((entry, i) => {
    const def = getEnemyDef(entry.defId);
    if (!def) return null;
    const scale = entry.scale ?? 1;
    return {
      uid: `e${i}`,
      defId: def.id,
      name: def.name,
      rarity: def.rarity,
      row: entry.row || 'front',
      art: def.art,
      skills: def.skills,
      stats: {
        atk: Math.round(def.stats.atk * scale),
        hp: Math.round(def.stats.hp * scale),
        def: Math.round(def.stats.def * scale),
        speed: def.stats.speed,
      },
    };
  }).filter(Boolean);
}

/** Rough "how hard is this" number, shown next to the team's power. */
function stagePower(stageId) {
  return buildEnemyTeam(stageId).reduce(
    (sum, e) => sum + Math.round(e.stats.atk * 2.4 + e.stats.hp * 0.22 + e.stats.def * 1.8),
    0
  );
}

/**
 * Record a victory and pay out. First clear adds a one-time bonus.
 * Returns a summary for the results screen.
 */
function completeStage(stageId) {
  const stage = getStage(stageId);
  if (!stage) return null;
  const first = !isCleared(stageId);

  const shards = { ...(stage.rewards.shards || {}) };
  let zeni = stage.rewards.zeni || 0;
  if (first && stage.firstClear) {
    zeni += stage.firstClear.zeni || 0;
    for (const [heroId, amount] of Object.entries(stage.firstClear.shards || {})) {
      shards[heroId] = (shards[heroId] || 0) + amount;
    }
  }

  const gear = rollGearDrops(stage.rewards.gearTable);
  const summary = inventory.grantRewards({ zeni, shards, gear });

  const st = getState();
  st.campaign.cleared[stageId] = true;
  st.campaign.highestCleared = Math.max(st.campaign.highestCleared, stageId);
  st.stats.battlesWon += 1;
  persist();

  return { ...summary, firstClear: first, stage };
}

function recordDefeat() {
  getState().stats.battlesLost += 1;
  persist();
}

/* ===== src/battle/targeting.js ===== */
/**
 * battle/targeting.js \u2014 Who a skill hits.
 *
 * FORMATION RULE (adjustable via TARGETING_MODE in config.js):
 *   'strict'   \u2014 single-target *basic* attacks can only hit the enemy front
 *                row while any front-row unit is alive. Back row is protected.
 *   'priority' \u2014 back row is targetable but only chosen when nothing in the
 *                front row is available.
 *
 * Basic attacks also STICK: a unit keeps swinging at whoever it picked until
 * that target goes down, rather than choosing again every swing. With
 * FOCUS_FIRE on, the replacement pick prefers whoever its allies are already
 * fighting, so a team converges on one enemy instead of spreading out \u2014 which
 * is what makes a group of attackers visibly gang up on a single defender.
 *
 * Deliberate exception: `lowestHp` and `highestAtk` targeting IGNORE rows.
 * That is what makes techniques and ultimates feel different from auto-attacks
 * and keeps a back-row glass cannon genuinely at risk. Change `respectsRows`
 * below to make row protection absolute.
 */



const respectsRows = {
  frontFirst: true,
  lowestHp: false,
  highestAtk: false,
  allEnemies: false,
  self: false,
  allies: false,
  lowestHpAlly: false,
};

function livingOpponents(battle, unit) {
  return battle.units.filter((u) => u.side !== unit.side && u.alive);
}

function livingAllies(battle, unit) {
  return battle.units.filter((u) => u.side === unit.side && u.alive);
}

/**
 * Prefer whoever this unit's allies are already attacking. Ties \u2014 including
 * the opening pick, when nobody has a target yet \u2014 break randomly, so a team
 * does not deterministically pile onto the same slot every battle.
 */
function focusPick(battle, unit, allowed) {
  const votes = new Map();
  for (const ally of battle.units) {
    if (ally === unit || ally.side !== unit.side || !ally.alive || !ally.targetUid) continue;
    votes.set(ally.targetUid, (votes.get(ally.targetUid) || 0) + 1);
  }
  let best = -1;
  let tied = [];
  for (const cand of allowed) {
    const v = votes.get(cand.uid) || 0;
    if (v > best) { best = v; tied = [cand]; }
    else if (v === best) tied.push(cand);
  }
  return tied[Math.floor(Math.random() * tied.length)];
}

/** Apply the formation rule to a candidate pool. */
function applyRowRule(candidates) {
  const front = candidates.filter((u) => u.row === 'front');
  if (TARGETING_MODE === 'strict') {
    return front.length ? front : candidates;
  }
  // 'priority': back row only when the front row is empty of choices
  return front.length ? front : candidates;
}

/**
 * Resolve a targeting mode into an array of units.
 * Returns [] when nothing is targetable (caller should skip the skill).
 */
function resolveTargets(battle, unit, mode) {
  switch (mode) {
    case 'self':
      return unit.alive ? [unit] : [];

    case 'allies':
      return livingAllies(battle, unit);

    case 'lowestHpAlly': {
      const allies = livingAllies(battle, unit);
      if (!allies.length) return [];
      return [allies.reduce((a, b) => (a.hp / a.maxHp <= b.hp / b.maxHp ? a : b))];
    }

    case 'allEnemies':
      return livingOpponents(battle, unit);

    case 'lowestHp': {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      return [pool.reduce((a, b) => (a.hp <= b.hp ? a : b))];
    }

    case 'highestAtk': {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      return [pool.reduce((a, b) => (a.stats.atk >= b.stats.atk ? a : b))];
    }

    case 'frontFirst':
    default: {
      const pool = livingOpponents(battle, unit);
      if (!pool.length) return [];
      const allowed = respectsRows[mode] === false ? pool : applyRowRule(pool);

      // Keep the current target while it is alive and still a legal pick.
      const held = allowed.find((u) => u.uid === unit.targetUid);
      if (held) return [held];

      const pick = FOCUS_FIRE ? focusPick(battle, unit, allowed) : allowed[Math.floor(Math.random() * allowed.length)];
      unit.targetUid = pick.uid;
      return [pick];
    }
  }
}

/* ===== src/battle/engine.js ===== */
/**
 * battle/engine.js \u2014 Real-time auto-battle simulation.
 *
 * Not turn-based: every unit runs its own timers and acts the moment they
 * come due, so both teams act simultaneously.
 *
 * Per unit, per tick:
 *   1. tick buffs/debuffs down
 *   2. tick the ultimate charge meter; fire it the instant it fills
 *      (ULTIMATE_MODE === 'auto'; 'tap' defers to requestUltimate())
 *   3. tick the technique cooldown; fire it the instant it is off cooldown
 *   4. tick the auto-attack timer; fire when due
 *
 * The engine is headless \u2014 it emits events and never touches the DOM, so the
 * same simulation can be replayed, fast-forwarded or run in a test.
 */





let uidSeq = 0;

function makeUnit(desc, side) {
  const skills = {};
  for (const [slot, id] of Object.entries(desc.skills || {})) {
    const skill = typeof id === 'string' ? getSkill(id) : id;
    if (skill) skills[slot] = skill;
  }
  const maxHp = Math.max(1, Math.round(desc.stats.hp));
  return {
    uid: desc.uid || `u${uidSeq++}`,
    side,
    heroId: desc.heroId || null,
    defId: desc.defId || null,
    name: desc.name,
    rarity: desc.rarity,
    level: desc.level ?? 1,
    star: desc.star ?? 0,
    row: desc.row === 'back' ? 'back' : 'front',
    art: desc.art,
    stats: { ...desc.stats },
    maxHp,
    hp: maxHp,
    alive: true,
    skills,
    buffs: [],
    // PLACEHOLDER: small random offset so units don't all swing in lockstep.
    attackTimer: Math.random() * 0.4,
    attackInterval: COMBAT.baseAttackInterval / Math.max(0.2, desc.stats.speed || 1),
    // Front-line melee units run in first; nobody acts before they arrive, so
    // the fight never starts with someone swinging across an empty gap.
    engages: engagesInMelee(desc.row === 'back' ? 'back' : 'front', skills.attack),
    readyAt: 0,
    targetUid: null,
    techniqueTimer: skills.technique ? (skills.technique.cooldown || 8) * 0.6 : Infinity,
    ultimateCharge: 0,
    ultimateReady: false,
    passiveFired: false,
  };
}

function effectiveStat(unit, stat) {
  let pct = 0;
  for (const b of unit.buffs) if (b.stat === stat) pct += b.pct;
  return Math.max(0, unit.stats[stat] * (1 + pct));
}

/**
 * PLACEHOLDER damage formula:
 *   atk * mult * K / (K + effectiveDef) , then variance and crit.
 * Defence is a soft mitigation curve, so stacking DEF never reaches immunity.
 */
function computeDamage(attacker, target, effect) {
  const atk = effectiveStat(attacker, 'atk');
  const def = effectiveStat(target, 'def') * (1 - (effect.defIgnore || 0));
  const base = atk * (effect.mult ?? 1) * (COMBAT.defenseConstant / (COMBAT.defenseConstant + def));
  const variance = 1 + (Math.random() * 2 - 1) * COMBAT.damageVariance;
  const crit = Math.random() < COMBAT.critChance;
  const amount = Math.max(1, Math.round(base * variance * (crit ? COMBAT.critMult : 1)));
  return { amount, crit };
}

function addCharge(unit, amount) {
  if (!unit.skills.ultimate || unit.ultimateReady) return;
  unit.ultimateCharge = Math.min(COMBAT.ultimateChargeMax, unit.ultimateCharge + amount);
}

function createBattle({ playerUnits = [], enemyUnits = [], stageId = null } = {}) {
  const units = [
    ...playerUnits.map((d) => makeUnit(d, 'player')),
    ...enemyUnits.map((d) => makeUnit(d, 'enemy')),
  ];

  const battle = {
    stageId,
    units,
    elapsed: 0,
    state: 'running',      // 'running' | 'victory' | 'defeat'
    events: [],
    _accumulator: 0,
    log: [],
  };

  battle.player = () => battle.units.filter((u) => u.side === 'player');
  battle.enemy = () => battle.units.filter((u) => u.side === 'enemy');
  battle.unitById = (uid) => battle.units.find((u) => u.uid === uid) || null;

  // Melee units pick their target up front rather than on their first swing, so
  // they know who to run at during the approach.
  for (const unit of units) {
    if (!unit.engages) continue;
    unit.readyAt = COMBAT.approachSeconds;
    resolveTargets(battle, unit, 'frontFirst');
  }

  // Passives with a battleStart trigger land before the first swing.
  for (const unit of units) {
    const passive = unit.skills.passive;
    if (passive && passive.trigger === 'battleStart') {
      firePassive(battle, unit, passive);
    }
  }

  /** Player-activated ultimates (ULTIMATE_MODE === 'tap'). */
  battle.requestUltimate = (uid) => {
    const unit = battle.unitById(uid);
    if (!unit || !unit.alive || !unit.ultimateReady) return false;
    castSkill(battle, unit, unit.skills.ultimate, 'ultimate');
    unit.ultimateCharge = 0;
    unit.ultimateReady = false;
    return true;
  };

  /**
   * Advance the simulation. `dt` is wall-clock seconds; internally the battle
   * runs on fixed COMBAT.tickMs steps so results don't depend on frame rate.
   * Returns the events produced during this call.
   */
  battle.update = (dt) => {
    battle.events = [];
    if (battle.state !== 'running') return battle.events;

    battle._accumulator += Math.min(dt, 0.25); // clamp: tab-switch catch-up
    const step = COMBAT.tickMs / 1000;

    while (battle._accumulator >= step && battle.state === 'running') {
      battle._accumulator -= step;
      tick(battle, step);
    }
    return battle.events;
  };

  return battle;
}

function tick(battle, dt) {
  battle.elapsed += dt;

  for (const unit of battle.units) {
    if (!unit.alive) continue;

    // 1. buffs expire
    if (unit.buffs.length) {
      unit.buffs = unit.buffs.filter((b) => {
        b.remaining -= dt;
        return b.remaining > 0;
      });
    }

    // Still closing the distance \u2014 no attacking, charging or cooling down yet.
    if (battle.elapsed < unit.readyAt) continue;

    // 2. ultimate meter
    if (unit.skills.ultimate) {
      if (!unit.ultimateReady) {
        addCharge(unit, COMBAT.ultimateChargePerSecond * dt);
        if (unit.ultimateCharge >= COMBAT.ultimateChargeMax) {
          unit.ultimateReady = true;
          battle.events.push({ t: 'ultReady', uid: unit.uid });
        }
      }
      if (unit.ultimateReady && ULTIMATE_MODE === 'auto') {
        castSkill(battle, unit, unit.skills.ultimate, 'ultimate');
        unit.ultimateCharge = 0;
        unit.ultimateReady = false;
        continue; // one action per tick keeps the readout legible
      }
    }

    // 3. technique
    if (unit.skills.technique) {
      unit.techniqueTimer -= dt;
      if (unit.techniqueTimer <= 0) {
        const fired = castSkill(battle, unit, unit.skills.technique, 'technique');
        unit.techniqueTimer = unit.skills.technique.cooldown || 8;
        if (fired) continue;
      }
    }

    // 4. auto-attack
    if (unit.skills.attack) {
      unit.attackTimer -= dt;
      if (unit.attackTimer <= 0) {
        unit.attackTimer = unit.attackInterval;
        castSkill(battle, unit, unit.skills.attack, 'attack');
      }
    }
  }

  checkEnd(battle);
}

/** Returns true if the skill actually went off (had a legal target). */
function castSkill(battle, caster, skill, slot) {
  if (!skill || !caster.alive) return false;
  const targets = resolveTargets(battle, caster, skill.targeting || 'frontFirst');
  const needsTarget = (skill.effects || []).some((e) => e.kind === 'damage');
  if (needsTarget && !targets.length) return false;

  battle.events.push({ t: 'skill', uid: caster.uid, skillId: skill.id, slot, name: skill.name, icon: skill.icon });

  for (const effect of skill.effects || []) {
    applyEffect(battle, caster, effect, targets, { skill, slot });
  }
  return true;
}

function applyEffect(battle, caster, effect, targets, ctx) {
  switch (effect.kind) {
    case 'damage': {
      const hits = effect.hits || 1;
      for (let h = 0; h < hits; h++) {
        for (const target of targets) {
          if (!target.alive) continue;
          dealDamage(battle, caster, target, effect, ctx);
        }
      }
      break;
    }

    case 'heal': {
      const amount = Math.round(effectiveStat(caster, 'atk') * (effect.mult ?? 1));
      for (const target of targets) {
        if (!target.alive) continue;
        target.hp = Math.min(target.maxHp, target.hp + amount);
        battle.events.push({ t: 'heal', uid: target.uid, amount });
      }
      break;
    }

    case 'selfDamage': {
      const amount = Math.max(1, Math.round(caster.maxHp * (effect.pctMaxHp || 0)));
      caster.hp = Math.max(0, caster.hp - amount);
      battle.events.push({ t: 'damage', uid: caster.uid, from: caster.uid, amount, crit: false, self: true });
      if (caster.hp <= 0) killUnit(battle, caster);
      break;
    }

    case 'buff': {
      const pool = effect.target === 'allies'
        ? battle.units.filter((u) => u.side === caster.side && u.alive)
        : [caster];
      for (const target of pool) {
        target.buffs.push({ stat: effect.stat, pct: effect.pct, remaining: effect.seconds });
        battle.events.push({ t: 'buff', uid: target.uid, stat: effect.stat, pct: effect.pct });
      }
      break;
    }

    case 'debuff': {
      for (const target of targets) {
        if (!target.alive) continue;
        target.buffs.push({ stat: effect.stat, pct: -Math.abs(effect.pct), remaining: effect.seconds });
        battle.events.push({ t: 'debuff', uid: target.uid, stat: effect.stat, pct: effect.pct });
      }
      break;
    }

    case 'charge':
      addCharge(caster, effect.amount || 0);
      break;

    default:
      console.warn('[battle] unknown effect kind', effect.kind);
  }
}

function dealDamage(battle, attacker, target, effect, ctx = {}) {
  const { amount, crit } = computeDamage(attacker, target, effect);
  target.hp = Math.max(0, target.hp - amount);
  battle.events.push({
    t: 'damage', uid: target.uid, from: attacker.uid,
    amount, crit, slot: ctx.slot || null,
  });

  addCharge(attacker, COMBAT.ultimateChargeOnHitDealt);
  addCharge(target, COMBAT.ultimateChargeOnHitTaken);

  if (target.hp <= 0) {
    killUnit(battle, target);
  } else {
    checkLowHpPassive(battle, target);
  }

  // on-hit passives \u2014 `fromPassive` stops a passive proccing itself
  if (!ctx.fromPassive) {
    const passive = attacker.skills.passive;
    if (passive && passive.trigger === 'onHitDealt' && Math.random() < (passive.chance ?? 1)) {
      firePassive(battle, attacker, passive, [target]);
    }
  }
}

function checkLowHpPassive(battle, unit) {
  const passive = unit.skills.passive;
  if (!passive || passive.trigger !== 'lowHp' || unit.passiveFired) return;
  if (unit.hp / unit.maxHp <= (passive.hpThreshold ?? 0.5)) {
    unit.passiveFired = true;
    firePassive(battle, unit, passive);
  }
}

function firePassive(battle, unit, passive, targets) {
  const resolved = targets || resolveTargets(battle, unit, passive.targeting || 'self');
  battle.events.push({
    t: 'passive', uid: unit.uid, skillId: passive.id, name: passive.name, icon: passive.icon,
  });
  for (const effect of passive.effects || []) {
    applyEffect(battle, unit, effect, resolved, { skill: passive, slot: 'passive', fromPassive: true });
  }
}

function killUnit(battle, unit) {
  if (!unit.alive) return;
  unit.alive = false;
  unit.hp = 0;
  unit.ultimateReady = false;
  unit.targetUid = null;
  // Whoever was locked onto this unit picks again next time they swing, which
  // is what makes a focused group move on together.
  for (const other of battle.units) {
    if (other.targetUid === unit.uid) other.targetUid = null;
  }
  battle.events.push({ t: 'death', uid: unit.uid });
}

function checkEnd(battle) {
  if (battle.state !== 'running') return;
  const playersAlive = battle.units.some((u) => u.side === 'player' && u.alive);
  const enemiesAlive = battle.units.some((u) => u.side === 'enemy' && u.alive);

  if (!enemiesAlive) {
    battle.state = 'victory';
  } else if (!playersAlive) {
    battle.state = 'defeat';
  } else if (battle.elapsed >= COMBAT.maxBattleSeconds) {
    // PLACEHOLDER: a timeout counts as a loss. Could become a judged result
    // (most remaining HP%) later.
    battle.state = 'defeat';
  } else {
    return;
  }
  battle.events.push({ t: 'end', result: battle.state });
}

/* ===== src/battle/index.js ===== */
/**
 * battle/index.js \u2014 Public interface of the battle system.
 *
 * Bridges saved player/campaign data into the headless engine so the engine
 * itself never imports the save layer.
 */









/** Turn the saved team ([{heroId,row}]) into engine unit descriptors. */
function buildPlayerUnits(team = getState().team) {
  return team
    .filter((slot) => slot && slot.heroId)
    .slice(0, TEAM_SIZE)
    .map((slot, i) => {
      const def = getHeroDef(slot.heroId);
      const hs = getState().heroes[slot.heroId];
      if (!def || !hs) return null;
      const skills = skillsFor(slot.heroId);
      return {
        uid: `p${i}`,
        heroId: def.id,
        name: def.name,
        rarity: def.rarity,
        row: slot.row || def.preferredRow,
        art: def.art,
        level: hs.level,
        star: hs.star,
        stats: statsFor(slot.heroId),
        // Only unlocked slots make it into combat \u2014 a 0\u2605 hero really does
        // fight with nothing but its auto-attack.
        skills: Object.fromEntries(
          Object.entries(skills).filter(([, s]) => !!s).map(([slotName, s]) => [slotName, s.id])
        ),
      };
    })
    .filter(Boolean);
}

function startStageBattle(stageId) {
  return createBattle({
    stageId,
    playerUnits: buildPlayerUnits(),
    enemyUnits: buildEnemyTeam(stageId),
  });
}

/**
 * Headless run used for balance checks (see tools/simulate.js). Returns the
 * result plus how long the fight took.
 */
function simulate(battle, { maxSeconds = 120, step = 0.05 } = {}) {
  let guard = Math.ceil(maxSeconds / step) + 10;
  while (battle.state === 'running' && guard-- > 0) battle.update(step);
  return {
    result: battle.state,
    seconds: +battle.elapsed.toFixed(1),
    survivors: battle.units.filter((u) => u.side === 'player' && u.alive).length,
    enemyHpLeft: battle.units.filter((u) => u.side === 'enemy').reduce((s, u) => s + u.hp, 0),
  };
}

/* ===== src/ui/dom.js ===== */
/**
 * ui/dom.js \u2014 Minimal DOM helpers. No framework, no build step.
 */

function h(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') {
      // Custom properties (--foo) are invisible to Object.assign \u2014 they must
      // go through setProperty, which is how rarity colours reach the CSS.
      for (const [prop, val] of Object.entries(v)) {
        if (prop.startsWith('--')) node.style.setProperty(prop, val);
        else node.style[prop] = val;
      }
    }
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of [].concat(children)) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** Bind clicks by [data-action] within a root \u2014 cheap event delegation. */
function onAction(root, handlers) {
  root.addEventListener('click', (ev) => {
    const target = ev.target.closest('[data-action]');
    if (!target || !root.contains(target)) return;
    const fn = handlers[target.dataset.action];
    if (fn) { ev.preventDefault(); fn(target, ev); }
  });
}

function fmt(n) {
  return Math.round(n).toLocaleString('en-US');
}

/** Star pip row, e.g. \u2605\u2605\u2605\u2606\u2606 */
function starRow(star, max = 5) {
  let out = '';
  for (let i = 0; i < max; i++) out += `<span class="pip ${i < star ? 'on' : ''}">\u2605</span>`;
  return `<span class="stars">${out}</span>`;
}

/** Brief non-blocking message at the top of the screen. */
function toast(message, kind = 'info') {
  const host = document.getElementById('toasts') || document.body;
  const node = h('div', { class: `toast toast-${kind}`, text: message });
  host.appendChild(node);
  setTimeout(() => node.classList.add('out'), 1800);
  setTimeout(() => node.remove(), 2200);
}

/* ===== src/ui/avatar.js ===== */
/**
 * ui/avatar.js \u2014 PLACEHOLDER CHARACTER ART.
 *
 * Every character is drawn as an inline SVG from a handful of colour/shape
 * parameters on the hero definition (`art`). This is stand-in art: it exists
 * so the prototype reads as a game on a phone screen without shipping any
 * real or borrowed artwork. Replacing it with sprites means swapping this one
 * module \u2014 nothing else knows how a character is drawn.
 */

const EYE = '#1f2937';

function hair(style, colour, cx, cy, rx, ry, skin = '#f2c9a0') {
  switch (style) {
    case 'spiky': {
      const spikes = [];
      const count = 9;
      for (let i = 0; i < count; i++) {
        const a = Math.PI + (Math.PI * i) / (count - 1);
        const x = cx + Math.cos(a) * rx * 1.02;
        const y = cy + Math.sin(a) * ry * 1.02;
        // Tip radii are the largest that keep every spike inside the viewBox
        // for both the bust (cy 44, ry 24) and the body (cy 30, ry 17).
        const tx = cx + Math.cos(a) * rx * 1.8;
        const ty = cy + Math.sin(a) * ry * 1.68;
        const px = cx + Math.cos(a + 0.34) * rx * 1.02;
        const py = cy + Math.sin(a + 0.34) * ry * 1.02;
        spikes.push(`<polygon points="${x},${y} ${tx},${ty} ${px},${py}" fill="${colour}"/>`);
      }
      return `${spikes.join('')}<path d="M${cx - rx},${cy} a${rx},${ry} 0 0 1 ${rx * 2},0 z" fill="${colour}"/>`;
    }
    case 'mane': {
      return `<path d="M${cx - rx * 1.5},${cy + ry * 2.6} Q${cx - rx * 1.9},${cy - ry * 1.1} ${cx},${cy - ry * 1.25}
        Q${cx + rx * 1.9},${cy - ry * 1.1} ${cx + rx * 1.5},${cy + ry * 2.6}
        Q${cx + rx * 0.9},${cy + ry * 1.2} ${cx},${cy + ry * 1.1}
        Q${cx - rx * 0.9},${cy + ry * 1.2} ${cx - rx * 1.5},${cy + ry * 2.6} z" fill="${colour}"/>`;
    }
    case 'long': {
      return `<path d="M${cx - rx * 1.25},${cy + ry * 1.9} Q${cx - rx * 1.4},${cy - ry} ${cx},${cy - ry * 1.15}
        Q${cx + rx * 1.4},${cy - ry} ${cx + rx * 1.25},${cy + ry * 1.9}
        Q${cx + rx * 0.7},${cy + ry * 0.6} ${cx},${cy + ry * 0.55}
        Q${cx - rx * 0.7},${cy + ry * 0.6} ${cx - rx * 1.25},${cy + ry * 1.9} z" fill="${colour}"/>`;
    }
    case 'bowl': {
      return `<path d="M${cx - rx * 1.06},${cy - ry * 0.02} a${rx * 1.06},${ry * 1.0} 0 0 1 ${rx * 2.12},0 z"
        fill="${colour}"/>`;
    }
    case 'widowsPeak': {
      return `<path d="M${cx - rx},${cy - ry * 0.1} a${rx},${ry} 0 0 1 ${rx * 2},0
        l${-rx * 0.2},${-ry * 0.15} l${-rx * 0.8},${ry * 0.5} l${-rx * 0.8},${-ry * 0.5} z" fill="${colour}"/>`;
    }
    case 'turban': {
      // Antennae are drawn first so the turban sits in front of their base;
      // the turban itself must stop well above the eyes (cy + 0.12ry).
      return `
        <path d="M${cx - rx * 0.5},${cy - ry * 0.9} q${-rx * 0.14},${-ry * 0.6} ${rx * 0.12},${-ry * 0.85}"
          stroke="${skin}" stroke-width="${rx * 0.13}" fill="none" stroke-linecap="round"/>
        <path d="M${cx + rx * 0.5},${cy - ry * 0.9} q${rx * 0.14},${-ry * 0.6} ${-rx * 0.12},${-ry * 0.85}"
          stroke="${skin}" stroke-width="${rx * 0.13}" fill="none" stroke-linecap="round"/>
        <path d="M${cx - rx * 1.06},${cy - ry * 0.32} a${rx * 1.06},${ry * 0.86} 0 0 1 ${rx * 2.12},0
          l0,${ry * 0.2} l${-rx * 2.12},0 z" fill="${colour}"/>
        <rect x="${cx - rx * 1.14}" y="${cy - ry * 0.2}" width="${rx * 2.28}" height="${ry * 0.2}"
          rx="${ry * 0.1}" fill="${colour}" opacity="0.72"/>`;
    }
    case 'saibaman': {
      return `<path d="M${cx},${cy - ry * 1.85} q${rx * 0.2},${ry * 0.55} ${-rx * 0.05},${ry * 0.9}"
        stroke="${colour === 'none' ? '#3f6212' : colour}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
    case 'bald':
    case 'thirdEye':
    case 'none':
    default:
      return '';
  }
}

function face(style, cx, cy, rx, ry, opts = {}) {
  const w = rx * 0.2;
  const h = ry * 0.26;
  const dy = cy + ry * 0.12;
  const dx = rx * 0.42;
  if (style === 'saibaman') {
    return `
      <ellipse cx="${cx - dx}" cy="${dy}" rx="${w * 1.5}" ry="${h * 1.3}" fill="#111827"/>
      <ellipse cx="${cx + dx}" cy="${dy}" rx="${w * 1.5}" ry="${h * 1.3}" fill="#111827"/>
      <ellipse cx="${cx - dx}" cy="${dy - h * 0.3}" rx="${w * 0.5}" ry="${h * 0.45}" fill="#fef08a"/>
      <ellipse cx="${cx + dx}" cy="${dy - h * 0.3}" rx="${w * 0.5}" ry="${h * 0.45}" fill="#fef08a"/>`;
  }
  const third = style === 'thirdEye'
    ? `<ellipse cx="${cx}" cy="${cy - ry * 0.42}" rx="${w * 0.85}" ry="${h * 0.85}" fill="${EYE}"/>`
    : '';
  return `
    <ellipse cx="${cx - dx}" cy="${dy}" rx="${w}" ry="${h}" fill="${EYE}"/>
    <ellipse cx="${cx + dx}" cy="${dy}" rx="${w}" ry="${h}" fill="${EYE}"/>
    ${third}
    ${opts.mouth === false ? '' : `<path d="M${cx - rx * 0.25},${cy + ry * 0.52} q${rx * 0.25},${ry * 0.16} ${rx * 0.5},0"
      stroke="${EYE}" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.65"/>`}`;
}

/** Head-and-shoulders bust \u2014 roster cards, hero detail, battle portraits. */
function bustSVG(art = {}, { className = '' } = {}) {
  const a = { skin: '#f2c9a0', hair: '#1b1b23', hairStyle: 'spiky', gi: '#f97316', trim: '#1d4ed8', ...art };
  const cx = 50, cy = 44, rx = 21, ry = 24;
  const backHair = ['long', 'mane'].includes(a.hairStyle) ? hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin) : '';
  const frontHair = backHair ? '' : hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin);

  return `<svg class="avatar-svg ${className}" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    ${backHair}
    <path d="M14,100 Q14,74 34,68 L66,68 Q86,74 86,100 Z" fill="${a.gi}"/>
    <path d="M34,68 L50,86 L66,68 L58,66 L50,76 L42,66 Z" fill="${a.trim}"/>
    <rect x="43" y="60" width="14" height="12" fill="${a.skin}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${a.skin}"/>
    ${frontHair}
    ${face(a.hairStyle, cx, cy, rx, ry)}
  </svg>`;
}

/** Full body \u2014 battlefield units. `facing` flips enemies to face the player. */
function bodySVG(art = {}, { facing = 'right', className = '' } = {}) {
  const a = { skin: '#f2c9a0', hair: '#1b1b23', hairStyle: 'spiky', gi: '#f97316', trim: '#1d4ed8', ...art };
  const cx = 50, cy = 30, rx = 15, ry = 17;
  const backHair = ['long', 'mane'].includes(a.hairStyle) ? hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin) : '';
  const frontHair = backHair ? '' : hair(a.hairStyle, a.hair, cx, cy, rx, ry, a.skin);
  const flip = facing === 'left' ? 'transform="scale(-1,1) translate(-100,0)"' : '';

  return `<svg class="avatar-svg body ${className}" viewBox="0 0 100 150" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <g ${flip}>
      <ellipse cx="50" cy="146" rx="26" ry="5" fill="rgba(0,0,0,0.32)"/>
      ${backHair}
      <path d="M40,92 L36,140 L46,140 L50,100 L54,140 L64,140 L60,92 Z" fill="${a.trim}"/>
      <path d="M33,60 Q30,52 40,49 L60,49 Q70,52 67,60 L64,94 L36,94 Z" fill="${a.gi}"/>
      <rect x="34" y="82" width="32" height="7" fill="${a.trim}"/>
      <path d="M36,54 L24,80 L31,84 L41,60 Z" fill="${a.gi}"/>
      <path d="M64,54 L76,80 L69,84 L59,60 Z" fill="${a.gi}"/>
      <circle cx="26" cy="83" r="5" fill="${a.skin}"/>
      <circle cx="74" cy="83" r="5" fill="${a.skin}"/>
      <rect x="45" y="42" width="10" height="10" fill="${a.skin}"/>
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${a.skin}"/>
      ${frontHair}
      ${face(a.hairStyle, cx, cy, rx, ry, { mouth: false })}
    </g>
  </svg>`;
}

/* ===== src/ui/sprites.js ===== */
/**
 * ui/sprites.js \u2014 Hand-drawn sprite sets, and the fallback rule.
 *
 * A hero either has a sprite set here or it doesn't. Heroes that don't fall
 * back to the CSS/SVG placeholder in ui/avatar.js, so the roster can mix drawn
 * characters with placeholder ones while art is still being made \u2014 nothing
 * outside this module needs to know which is which.
 *
 * Frames were sliced from the source sheet by tools/ (see assets/sprites/).
 * Every battle frame shares one canvas height and one drawing scale, and is
 * bottom-aligned on that canvas, so the character never changes size or jumps
 * off the ground between poses. `cx` is the character's torso centre as a
 * fraction of the frame's width: the renderer pins that point to the unit's
 * centre, which is what stops a wide pose (a high kick, a knockback) from
 * sliding the character sideways.
 *
 * PLACEHOLDER: frame durations below are feel, not measurement \u2014 tune freely.
 */

/* Paths are written out in full rather than assembled from a prefix: the
   single-file build finds every asset by scanning for literal 'assets/...'
   strings and swaps them for data URIs. */

/**
 * Clips are [frameName, milliseconds] pairs.
 *
 * `hold: true` means the last frame stays up instead of returning to idle \u2014
 * used for defeat, where the unit is done acting.
 *
 * `priority` decides what may interrupt what:
 *   - getting hit interrupts a basic swing, which reads as the hit landing
 *   - but a technique or ultimate plays through hits. A front-row hero takes
 *     chip damage almost continuously, so letting hits interrupt these cancels
 *     the release frame \u2014 and the payoff of a Kamehameha is the release frame.
 *     The hit flash still fires, so being hit is never silent.
 *   - death outranks everything, so a unit that dies mid-swing stops swinging.
 */
const SPRITE_ANIMS = {
  idle:      { priority: 0, loop: true,  clip: [['idle', 1000]] },
  // The punch runs wind-up -> contact -> recoil; the kick leads on the sheet's
  // neutral guard instead, because the punch wind-up telegraphs a right cross
  // and reads wrong in front of a high kick. Both settle on the same recoil.
  attack:    { priority: 1, clip: [['windup', 110], ['punch', 160], ['recoil', 150]] },
  attack_alt:{ priority: 1, clip: [['guard', 100], ['kick', 180], ['recoil', 140]] },
  hit:       { priority: 2, clip: [['stagger', 260]] },
  hit_heavy: { priority: 2, clip: [['knockback', 230], ['ground_impact', 260]] },
  technique: { priority: 3, clip: [['charge_start', 200], ['charge_build', 250], ['release', 430]] },
  ultimate:  { priority: 4, clip: [['charge_start', 250], ['charge_build', 310], ['release', 520]] },
  defeat:    { priority: 9, hold: true, clip: [['falling', 210], ['crumpled', 260], ['ko', 380]] },
};
